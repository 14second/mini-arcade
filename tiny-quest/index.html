<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#1d4a22">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tiny Quest</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#1d4a22;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    touch-action:none; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color: transparent; }
  canvas { position:fixed; inset:0; display:block; touch-action:none; }
  #muteBtn { position:fixed; top:10px; right:10px; z-index:10; width:48px; height:48px; border-radius:12px;
    border:2px solid rgba(255,255,255,.55); background:rgba(10,30,15,.55); color:#fff; font-size:22px;
    line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; }
  .ctl { position:fixed; z-index:10; width:58px; height:58px; border-radius:50%;
    border:2px solid rgba(255,255,255,.6); background:rgba(10,30,15,.5); color:#fff; font-size:24px;
    display:flex; align-items:center; justify-content:center; }
  #btnU { left:74px; bottom:150px; } #btnD { left:74px; bottom:34px; }
  #btnL { left:16px; bottom:92px; } #btnR { left:132px; bottom:92px; }
  #btnS { right:20px; bottom:92px; width:72px; height:72px; background:rgba(200,60,60,.55); }
  .ctl:active { background:rgba(255,255,255,.35); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="muteBtn" aria-label="Toggle sound">🔊</button>
<button class="ctl" id="btnU">▲</button>
<button class="ctl" id="btnD">▼</button>
<button class="ctl" id="btnL">◀</button>
<button class="ctl" id="btnR">▶</button>
<button class="ctl" id="btnS">⚔️</button>
<script>
// iOS audio routing: Web Audio defaults to the "ambient" channel, which the
// iPhone silent switch mutes entirely. Route it to the media/playback
// channel (iOS 17+ Audio Session API) on the first user gesture and inside
// audio init, so game music/SFX play even with silent mode on.
function iosPlaybackSession() {
  try { if ('audioSession' in navigator) navigator.audioSession.type = 'playback'; } catch (e) {}
}
document.addEventListener('pointerdown', iosPlaybackSession, true);
document.addEventListener('touchstart', iosPlaybackSession, true);
"use strict";
/* TINY QUEST — original top-down mini adventure. Explore the field, enter the
   cave, find the key, open the gate, survive the 3-wave gauntlet.
   Fairness: no enemy spawns within 3 tiles of the player; contact damage has
   a 0.9s invulnerability window; a heart pickup sits before the gauntlet. */
const VW = 420, VH = 720, TILE = 48, COLS = 9, ROWS = 13;
const canvas = document.getElementById("game"), ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1, scale = 1, ox = 0, oy = 0;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  scale = Math.min(W / VW, H / VH) * DPR; ox = (W * DPR - VW * scale) / 2; oy = (H * DPR - VH * scale) / 2;
}
window.addEventListener("resize", resize); resize();
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

let actx = null, muted = localStorage.getItem("tqMuted") === "1", musicTimer = null, musicStep = 0;
const muteBtn = document.getElementById("muteBtn");
muteBtn.textContent = muted ? "🔇" : "🔊";
muteBtn.addEventListener("click", () => { muted = !muted; localStorage.setItem("tqMuted", muted ? "1" : "0"); muteBtn.textContent = muted ? "🔇" : "🔊"; });
function initAudio() {
  iosPlaybackSession();
  if (!actx) { try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); } catch (e) {} }
  if (actx && actx.state === "suspended") actx.resume();
}
function tone(freq, dur, type, vol, when) {
  if (!actx || muted) return;
  const t = when || actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = type || "triangle"; o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.14, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
}
function sfx(n) {
  if (!actx || muted) return;
  if (n === "swing") tone(587, 0.12, "square", 0.1);
  else if (n === "hit") { tone(330, 0.1, "square", 0.14); tone(220, 0.12, "triangle", 0.12); }
  else if (n === "hurt") tone(196, 0.3, "square", 0.15);
  else if (n === "pick") { tone(880, 0.1, "triangle", 0.13); tone(1174, 0.16, "triangle", 0.12, actx.currentTime + 0.08); }
  else if (n === "win") { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.22, "triangle", 0.13, actx.currentTime + i * 0.12)); }
}
const MELODY = [392, 523, 659, 523, 440, 523, 587, 659, 587, 523, 440, 392];
function startMusic() {
  if (musicTimer) return;
  musicTimer = setInterval(() => {
    if (!actx || muted) return;
    tone(MELODY[musicStep % MELODY.length], 0.24, "triangle", 0.06);
    if (musicStep % 4 === 0) tone(147, 0.3, "triangle", 0.05);
    musicStep++;
  }, 260);
}

// Maps: '#'=wall, '.'=floor, 'D'=cave door (overworld) / exit (dungeon),
// 'K'=key chest, 'G'=locked gate, 'H'=heart pickup, 'C'=clearing (gauntlet).
const OVERWORLD = [
"#########",
"#.......#",
"#.###...#",
"#...#...#",
"###.#.###",
"#...#...#",
"#.###.#.#",
"#.....#.#",
"###.###.#",
"#D..#..G#",
"#.###.H.#",
"#...#..C#",
"#########"];
const DUNGEON = [
"#########",
"#...#...#",
"#.###.#.#",
"#.#...#.#",
"#.#.###.#",
"#...#...#",
"###.#.###",
"#.....#.#",
"#.#.#.#.#",
"#.#K#..D#",
"#########",
"#########",
"#########"];
let state = "menu", area = "over", hearts = 3, hasKey = false, gateOpen = false;
let wave = 0, waveSpawn = 0, slimes = [], px = 0, py = 0, face = "down";
let swing = 0, invuln = 0, startTime = 0, elapsed = 0, won = false;
let best = parseInt(localStorage.getItem("tqBest") || "0", 10);
let chestOpen = false, heartTaken = false;

function mapAt(areaName, c, r) {
  const m = areaName === "over" ? OVERWORLD : DUNGEON;
  if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return "#";
  return m[r][c];
}
function solid(c, r) { const ch = mapAt(area, c, r); return ch === "#" || (ch === "G" && !gateOpen); }
function resetGame() {
  area = "over"; hearts = 3; hasKey = false; gateOpen = false; wave = 0;
  slimes = []; px = 1 * TILE + 6; py = 1 * TILE + 6; face = "down";
  swing = 0; invuln = 0; chestOpen = false; heartTaken = false; won = false;
  startTime = performance.now(); elapsed = 0;
  spawnSlimes(area, 2);
}
function spawnSlimes(a, n) {
  // never within 3 tiles of the player
  const spots = [];
  const m = a === "over" ? OVERWORLD : DUNGEON;
  for (let r = 1; r < ROWS - 1; r++) for (let c = 1; c < COLS - 1; c++) {
    if (m[r][c] !== ".") continue;
    const dx = Math.abs(c * TILE - px), dy = Math.abs(r * TILE - py);
    if (dx < 3 * TILE && dy < 3 * TILE) continue;
    spots.push([c, r]);
  }
  for (let i = 0; i < n && spots.length; i++) {
    const s = spots.splice(Math.floor(Math.random() * spots.length), 1)[0];
    slimes.push({ x: s[0] * TILE + 6, y: s[1] * TILE + 6, w: 36, h: 36, hp: 1, t: Math.random() * 6 });
  }
}
function update(dt) {
  if (state !== "play") return;
  elapsed = (performance.now() - startTime) / 1000;
  let mx = 0, my = 0;
  if (keys.left || touch.left) { mx -= 1; face = "left"; }
  if (keys.right || touch.right) { mx += 1; face = "right"; }
  if (keys.up || touch.up) { my -= 1; face = "up"; }
  if (keys.down || touch.down) { my += 1; face = "down"; }
  if (mx && my) { mx *= 0.7071; my *= 0.7071; }
  const speed = 150;
  let nx = px + mx * speed * dt, ny = py + my * speed * dt;
  const pc = Math.floor((nx + 18) / TILE), pr = Math.floor((ny + 30) / TILE);
  if (!solid(pc, pr) && !solid(Math.floor((nx + 18) / TILE), Math.floor((ny + 6) / TILE))) px = clamp(nx, 0, COLS * TILE - 36);
  const pc2 = Math.floor((px + 18) / TILE), pr2 = Math.floor((ny + 30) / TILE);
  if (!solid(pc2, pr2) && !solid(pc2, Math.floor((ny + 6) / TILE))) py = clamp(ny, 0, ROWS * TILE - 36);
  if (swing > 0) swing -= dt;
  if ((keys.swing || touch.swing) && swing <= 0) {
    swing = 0.28; sfx("swing");
    // sword arc in facing direction
    const sx = px + (face === "left" ? -34 : face === "right" ? 36 : 0);
    const sy = py + (face === "up" ? -34 : face === "down" ? 36 : 0);
    for (const s of slimes) {
      if (Math.abs(s.x - sx) < 46 && Math.abs(s.y - sy) < 46) { s.hp = 0; sfx("hit"); }
    }
    slimes = slimes.filter(s => s.hp > 0);
  }
  // slime AI: drift toward player
  for (const s of slimes) {
    s.t += dt;
    const dx = px - s.x, dy = py - s.y, d = Math.hypot(dx, dy) || 1;
    const sp = 46 + wave * 6;
    const nx2 = s.x + (dx / d) * sp * dt, ny2 = s.y + (dy / d) * sp * dt;
    const c = Math.floor((nx2 + 18) / TILE), r = Math.floor((ny2 + 18) / TILE);
    if (!solid(c, r)) { s.x = nx2; s.y = ny2; }
    if (invuln <= 0 && Math.abs(s.x - px) < 32 && Math.abs(s.y - py) < 32) {
      hearts--; invuln = 0.9; sfx("hurt");
      if (hearts <= 0) { state = "over"; return; }
    }
  }
  if (invuln > 0) invuln -= dt;
  // tile interactions
  const c = Math.floor((px + 18) / TILE), r = Math.floor((py + 18) / TILE);
  const ch = mapAt(area, c, r);
  if (area === "over" && ch === "D") { area = "dun"; px = 6 * TILE + 6; py = 9 * TILE + 6; slimes = []; spawnSlimes("dun", 2); sfx("pick"); }
  else if (area === "dun" && ch === "D") { area = "over"; px = 2 * TILE + 6; py = 9 * TILE + 6; slimes = []; if (!gateOpen) spawnSlimes("over", 2); }
  else if (area === "dun" && ch === "K" && !chestOpen) { chestOpen = true; hasKey = true; sfx("pick"); }
  else if (area === "over" && ch === "G" && hasKey && !gateOpen) { gateOpen = true; sfx("pick"); }
  else if (area === "over" && ch === "H" && !heartTaken) { heartTaken = true; hearts = Math.min(3, hearts + 1); sfx("pick"); }
  else if (area === "over" && ch === "C" && gateOpen && wave === 0) {
    wave = 1; slimes = []; spawnSlimes("over", 3); sfx("pick");
  }
  // gauntlet waves
  if (wave > 0 && slimes.length === 0) {
    if (wave < 3) { wave++; spawnSlimes("over", 2 + wave); }
    else {
      won = true; state = "win"; sfx("win");
      const t = Math.floor(elapsed);
      if (best === 0 || t < best) { best = t; localStorage.setItem("tqBest", String(t)); }
    }
  }
}

const keys = { left: false, right: false, up: false, down: false, swing: false };
const touch = { left: false, right: false, up: false, down: false, swing: false };
window.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft" || e.key === "a") keys.left = true;
  if (e.key === "ArrowRight" || e.key === "d") keys.right = true;
  if (e.key === "ArrowUp" || e.key === "w") keys.up = true;
  if (e.key === "ArrowDown" || e.key === "s") keys.down = true;
  if (e.key === " ") { keys.swing = true; e.preventDefault(); }
  if (e.key === "Enter" && state !== "play") { initAudio(); startMusic(); resetGame(); state = "play"; }
});
window.addEventListener("keyup", e => {
  if (e.key === "ArrowLeft" || e.key === "a") keys.left = false;
  if (e.key === "ArrowRight" || e.key === "d") keys.right = false;
  if (e.key === "ArrowUp" || e.key === "w") keys.up = false;
  if (e.key === "ArrowDown" || e.key === "s") keys.down = false;
  if (e.key === " ") keys.swing = false;
});
function bindBtn(id, prop) {
  const el = document.getElementById(id);
  const on = e => { e.preventDefault(); touch[prop] = true; initAudio(); };
  const off = e => { e.preventDefault(); touch[prop] = false; };
  el.addEventListener("pointerdown", on); el.addEventListener("pointerup", off);
  el.addEventListener("pointercancel", off); el.addEventListener("pointerleave", off);
}
bindBtn("btnU", "up"); bindBtn("btnD", "down"); bindBtn("btnL", "left"); bindBtn("btnR", "right"); bindBtn("btnS", "swing");
canvas.addEventListener("pointerdown", () => {
  initAudio();
  if (state === "menu") { startMusic(); resetGame(); state = "play"; }
  else if (state === "over" || state === "win") state = "menu";
});

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = "#1d4a22"; ctx.fillRect(0, 0, W, H);
  ctx.setTransform(scale, 0, 0, scale, ox, oy);
  const m = area === "over" ? OVERWORLD : DUNGEON;
  const offY = 44;
  if (state === "menu") {
    ctx.fillStyle = "#fff"; ctx.textAlign = "center";
    ctx.font = "bold 42px system-ui"; ctx.fillText("🗡️ Tiny Quest", VW / 2, 130);
    ctx.font = "20px system-ui"; ctx.fillText("Find the key in the cave,", VW / 2, 190);
    ctx.fillText("open the gate, survive the gauntlet.", VW / 2, 220);
    ctx.font = "18px system-ui"; ctx.fillText("Best time: " + (best ? best + "s" : "—"), VW / 2, 270);
    ctx.fillText("D-pad to move • ⚔️ to swing • Arrows / Space", VW / 2, 320);
    ctx.font = "bold 22px system-ui"; ctx.fillText("Tap to start", VW / 2, 420);
    return;
  }
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const ch = m[r][c], x = c * TILE, y = offY + r * TILE;
    if (area === "over") ctx.fillStyle = ch === "#" ? "#2f6b34" : "#57a85c";
    else ctx.fillStyle = ch === "#" ? "#3a3348" : "#574a6e";
    ctx.fillRect(x, y, TILE, TILE);
    if (ch === "#") { ctx.fillStyle = area === "over" ? "#1d4a22" : "#241f33"; ctx.fillRect(x + 4, y + 4, TILE - 8, TILE - 8); }
    if (ch === "D") { ctx.fillStyle = "#6b4a2a"; ctx.fillRect(x + 6, y + 6, TILE - 12, TILE - 12); ctx.fillStyle = "#000"; ctx.fillRect(x + 16, y + 20, 16, 20); }
    if (ch === "G" && !gateOpen) { ctx.fillStyle = "#c9a227"; ctx.fillRect(x + 4, y + 4, TILE - 8, TILE - 8); ctx.fillStyle = "#7a5c00"; ctx.font = "bold 22px system-ui"; ctx.textAlign = "center"; ctx.fillText("🔒", x + 24, y + 32); }
    if (ch === "K" && !chestOpen) { ctx.fillStyle = "#c98f2e"; ctx.fillRect(x + 8, y + 14, 32, 22); ctx.fillStyle = "#7a5510"; ctx.fillRect(x + 8, y + 14, 32, 6); }
    if (ch === "H" && !heartTaken) { ctx.fillStyle = "#e23b3b"; ctx.font = "26px system-ui"; ctx.textAlign = "center"; ctx.fillText("❤️", x + 24, y + 32); }
    if (ch === "C") { ctx.fillStyle = "rgba(255,217,59,.25)"; ctx.fillRect(x, y, TILE, TILE); }
  }
  for (const s of slimes) {
    ctx.fillStyle = "#39d353";
    ctx.beginPath(); ctx.arc(s.x + 18, s.y + 18 + Math.sin(s.t * 6) * 2, 17, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.fillRect(s.x + 10, s.y + 12, 7, 7); ctx.fillRect(s.x + 24, s.y + 12, 7, 7);
    ctx.fillStyle = "#000"; ctx.fillRect(s.x + 13, s.y + 15, 3, 3); ctx.fillRect(s.x + 27, s.y + 15, 3, 3);
  }
  // player (blink while invulnerable)
  if (!(invuln > 0 && Math.floor(invuln * 10) % 2 === 0)) {
    const y = offY + py;
    ctx.fillStyle = "#2f7de1"; ctx.fillRect(px, y, 36, 36);
    ctx.fillStyle = "#f2c894"; ctx.fillRect(px + 8, y + 6, 20, 16);
    ctx.fillStyle = "#000"; ctx.fillRect(px + 12, y + 11, 4, 4); ctx.fillRect(px + 22, y + 11, 4, 4);
    if (swing > 0) {
      ctx.fillStyle = "#e8e8e8";
      if (face === "left") ctx.fillRect(px - 30, y + 8, 28, 6);
      if (face === "right") ctx.fillRect(px + 36, y + 8, 28, 6);
      if (face === "up") ctx.fillRect(px + 15, y - 30, 6, 28);
      if (face === "down") ctx.fillRect(px + 15, y + 36, 6, 28);
    }
  }
  ctx.fillStyle = "rgba(10,30,15,.7)"; ctx.fillRect(0, 0, VW, 44);
  ctx.fillStyle = "#fff"; ctx.font = "bold 18px system-ui"; ctx.textAlign = "left";
  ctx.fillText(area === "over" ? "🌿 Field" : "🕳️ Cave", 12, 28);
  ctx.textAlign = "center";
  ctx.fillText("❤️".repeat(hearts) + "  " + (hasKey ? "🔑" : "") + (wave > 0 ? "  Wave " + wave + "/3" : ""), VW / 2, 28);
  ctx.textAlign = "right"; ctx.fillText(Math.floor(elapsed) + "s", VW - 12, 28);
  if (state === "over" || state === "win") {
    ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(0, 0, VW, VH);
    ctx.fillStyle = "#fff"; ctx.textAlign = "center";
    ctx.font = "bold 38px system-ui";
    ctx.fillText(state === "win" ? "🏆 Quest complete!" : "You fell…", VW / 2, VH / 2 - 20);
    ctx.font = "20px system-ui";
    ctx.fillText(state === "win" ? "Time: " + Math.floor(elapsed) + "s  •  Best: " + best + "s" : "Tap to try again", VW / 2, VH / 2 + 20);
    if (state === "win") ctx.fillText("Tap to return to menu", VW / 2, VH / 2 + 60);
  }
}
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
resetGame(); state = "menu";
requestAnimationFrame(loop);
</script>
</body>
</html>
