// iOS audio routing: Web Audio defaults to the "ambient" channel, which the
// iPhone silent switch mutes entirely. Route it to the media/playback
// channel (iOS 17+ Audio Session API) on the first user gesture and inside
// audio init, so game music/SFX play even with silent mode on.
function iosPlaybackSession() {
  try { if ('audioSession' in navigator) navigator.audioSession.type = 'playback'; } catch (e) {}
}
document.addEventListener('pointerdown', iosPlaybackSession, true);
// Sleep in the background (2026-11-09): the wrapper's pauseTimers stops
// JS timers, but the Web Audio graph is a separate engine — suspend the
// audio context whenever the page is hidden so nothing keeps the CPU
// (or the sound) running while the app is in the background.
document.addEventListener("visibilitychange", function () {
  try {
    var c = window.__maCtx;
    if (document.hidden) {
      window.__maHidden = true;
      if (c) {
        if (c.close) { try { var p = c.close(); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
        if (c.suspend && c.state === "running") { try { c.suspend(); } catch (e) {} }
        window.__maCtx = null;
      }
    } else {
      window.__maHidden = false;
      var ac = c || (window.__maActx && window.__maActx());
      if (ac && ac.state === "suspended" && ac.resume) { try { ac.resume(); } catch (e) {} }
    }
  } catch (e) {}
});

document.addEventListener('touchstart', iosPlaybackSession, true);

/* TINY QUEST — original top-down mini adventure in 12 levels. You are a
   knight: in each level explore the field, enter the cave, find the key,
   open the gate, survive the slime gauntlet. Clear level 12 and the knight
   rescues the princess.
   Fairness: no enemy spawns within 3 tiles of the player; contact damage has
   a 1.2s invulnerability window; the sword's reach (56) clearly beats a
   slime's touch (32); a heart pickup sits before the gauntlet; waves
   trickle in at most 3 at a time; slimes pathfind to the player so no
   gauntlet can stall; slime speed stays below the player's speed. */

let W = 0, H = 0, DPR = 1, scale = 1, ox = 0, oy = 0;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  scale = Math.min(W / VW, H / VH) * DPR; ox = (W * DPR - VW * scale) / 2; oy = (H * DPR - VH * scale) / 2;
}

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

muteBtn.textContent = muted ? "🔇" : "🔊";
muteBtn.addEventListener("click", () => { muted = !muted; localStorage.setItem("tqMuted", muted ? "1" : "0"); muteBtn.textContent = muted ? "🔇" : "🔊"; });
function initAudio() {
  iosPlaybackSession();
  if (!actx || actx.state === "closed") { try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); window.__maCtx = actx; window.__maActx = function () { return actx; };; } catch (e) {} }
  if (actx && actx.state === "suspended") actx.resume();
}
function tone(freq, dur, type, vol, when) {
  if (!actx || muted) return;
  const t = when || actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = type || "triangle"; o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.14, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
}
function sfx(n) {
  if (!actx || muted) return;
  if (n === "swing") tone(587, 0.12, "square", 0.1);
  else if (n === "hit") { tone(330, 0.1, "square", 0.14); tone(220, 0.12, "triangle", 0.12); }
  else if (n === "hurt") tone(196, 0.3, "square", 0.15);
  else if (n === "pick") { tone(880, 0.1, "triangle", 0.13); tone(1174, 0.16, "triangle", 0.12, actx.currentTime + 0.08); }
  else if (n === "win") { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.22, "triangle", 0.13, actx.currentTime + i * 0.12)); }
}
const MELODY = [392, 523, 659, 523, 440, 523, 587, 659, 587, 523, 440, 392];
function startMusic() {
  if (musicTimer) return;
  musicTimer = setInterval(() => {
    if (!actx || muted) return;
    tone(MELODY[musicStep % MELODY.length], 0.24, "triangle", 0.06);
    if (musicStep % 4 === 0) tone(147, 0.3, "triangle", 0.05);
    musicStep++;
  }, 260);
}

let state = "menu", area = "over", level = 0, hearts = 3, hasKey = false, gateOpen = false;
let wave = 0, slimes = [], px = 0, py = 0, face = "down";
let spawnQueue = 0, spawnTimer = 0;
let slimePrev = null, slimePathTimer = 0;
function computeSlimePrev() {
  // BFS outward from the player's tile over non-solid tiles. The prev map
  // lets each slime trace a real route to the player instead of drifting
  // straight at him and wedging on walls. Cheap on a 9x13 grid.
  const pc = clamp(Math.floor((px + 18) / TILE), 0, COLS - 1), pr = clamp(Math.floor((py + 18) / TILE), 0, ROWS - 1);
  const key = (c, r) => c + "," + r;
  const prev = new Map([[key(pc, pr), null]]);
  const q = [[pc, pr]];
  while (q.length) {
    const [c, r] = q.shift();
    for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nc = c + dc, nr = r + dr, k = key(nc, nr);
      if (nc < 0 || nr < 0 || nc >= COLS || nr >= ROWS || prev.has(k)) continue;
      const ch = mapAt(area, nc, nr);
      if (ch === "#" || (ch === "G" && !gateOpen)) continue;
      prev.set(k, [c, r]); q.push([nc, nr]);
    }
  }
  slimePrev = prev;
}

function curMap(areaName) { return areaName === "over" ? LEVELS[level].over : LEVELS[level].dun; }
function mapAt(areaName, c, r) {
  const m = curMap(areaName);
  if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return "#";
  return m[r][c];
}
function solid(c, r) { const ch = mapAt(area, c, r); return ch === "#" || (ch === "G" && !gateOpen); }
function placeNear(areaName, ch) {
  // put the player on a floor tile next to the named tile in that area
  const m = curMap(areaName);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (m[r][c] !== ch) continue;
    const near = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    for (const [dc, dr] of near) {
      const nc = c + dc, nr = r + dr;
      if (mapAt(areaName, nc, nr) === ".") { px = nc * TILE + 6; py = nr * TILE + 6; return; }
    }
  }
}
function loadLevel(n) {
  level = n; area = "over"; hearts = 3; hasKey = false; gateOpen = false; wave = 0;
  spawnQueue = 0; spawnTimer = 0;
  slimes = []; px = 1 * TILE + 6; py = 1 * TILE + 6; face = "down";
  swing = 0; invuln = 0; chestOpen = false; heartTaken = false; won = false;
  spawnSlimes("over", 2);
}
function resetGame() {
  startTime = performance.now(); elapsed = 0;
  loadLevel(0);

function startWave(n) {

// the gauntlet region: the clearing's side of the gate. When a wave is
// running, slimes on the far side of the gate stay frozen (the gate
// grounds them) instead of trekking across the map or piling up.
function gauntletRegion() {
  const [gc, gr] = (() => { const m = curMap("over"); for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (m[r][c] === "G") return [c, r]; return null; })();

  ctx.fillStyle = "rgba(255,255,255,.45)"; ctx.beginPath(); ctx.ellipse(cx - 6, s.y + 12 + offY - sq, 5, 3.4, -0.5, 0, Math.PI * 2); ctx.fill(); // shine
  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(cx - 6, s.y + 17 + offY - sq * 0.5, 4.6, 0, Math.PI * 2); ctx.arc(cx + 7, s.y + 17 + offY - sq * 0.5, 4.6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#14210f"; ctx.beginPath(); ctx.arc(cx - 6, s.y + 18 + offY - sq * 0.5, 2.4, 0, Math.PI * 2); ctx.arc(cx + 7, s.y + 18 + offY - sq * 0.5, 2.4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#14210f"; ctx.fillRect(cx - 2, s.y + 25 + offY - sq * 0.4, 6, 2.2); // mouth
}
function draw() {
  const th = THEMES[level];
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = "#14251a"; ctx.fillRect(0, 0, W, H);
  ctx.setTransform(scale, 0, 0, scale, ox, oy);
  const m = curMap(area);
  const offY = 44;
  if (state === "menu") {
    ctx.fillStyle = th.floor[0]; ctx.fillRect(0, 0, VW, VH);
    ctx.fillStyle = "rgba(20,40,24,.88)"; ctx.fillRect(0, 90, VW, 400);
    drawKnightFig(VW / 2 - 78, 428, 1.5, "down", null);
    drawPrincessFig(VW / 2 + 78, 424, 1.5);
    ctx.fillStyle = "#fff"; ctx.textAlign = "center";
    ctx.font = "bold 42px system-ui"; ctx.fillText("🗡️ Tiny Quest", VW / 2, 150);
    ctx.font = "20px system-ui";
    ctx.fillText("The Princess is trapped beyond", VW / 2, 205);
    ctx.fillText("the twelfth gate! You are the Knight —", VW / 2, 235);
    ctx.fillText("find each key, open each gate,", VW / 2, 265);
    ctx.fillText("and survive every gauntlet.", VW / 2, 295);
    ctx.font = "18px system-ui"; ctx.fillText("Best full run: " + (best ? best + "s" : "—"), VW / 2, 340);
    ctx.fillText("D-pad to move • ⚔️ to swing • Arrows / Space", VW / 2, 378);
    ctx.font = "bold 22px system-ui"; ctx.fillText("Tap to start", VW / 2, 470);
    return;
  }
  drawTiles(th, m, offY);
  for (const s of slimes) drawSlimeFig(s, th, offY);

  // player knight (blink while invulnerable)
  if (!(invuln > 0 && Math.floor(invuln * 10) % 2 === 0)) {
    drawKnightFig(px + 18, offY + py + 18, 1, face, swing > 0 ? 1 - swing / 0.28 : null);
  }
  ctx.fillStyle = "rgba(10,30,15,.7)"; ctx.fillRect(0, 0, VW, 44);
  ctx.fillStyle = "#fff"; ctx.font = "bold 18px system-ui"; ctx.textAlign = "left";
  ctx.fillText("Lv" + (level + 1) + " " + LEVELS[level].name + (area === "over" ? " 🌿" : " 🕳️"), 12, 28);
  ctx.textAlign = "center";
  ctx.fillText("❤️".repeat(hearts) + "  " + (hasKey ? "🔑" : "") + (wave > 0 ? "  Wave " + wave + "/" + LEVELS[level].waves : ""), VW / 2, 28);
  ctx.textAlign = "right"; ctx.fillText(Math.floor(elapsed) + "s", VW - 12, 28);
  if (state === "clear" || state === "over") {
    ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(0, 0, VW, VH);
    ctx.fillStyle = "#fff"; ctx.textAlign = "center";
    ctx.font = "bold 36px system-ui";
    if (state === "clear") {
      ctx.fillText("⭐ Level " + (level + 1) + " complete!", VW / 2, VH / 2 - 30);
      ctx.font = "20px system-ui";
      ctx.fillText("Next: Level " + (level + 2) + " — " + LEVELS[level + 1].name, VW / 2, VH / 2 + 10);
      ctx.fillText("Tap to continue", VW / 2, VH / 2 + 50);
    } else {
      ctx.fillText("You fell…", VW / 2, VH / 2 - 20);
      ctx.font = "20px system-ui";
      ctx.fillText("The Princess still waits. Tap to try again", VW / 2, VH / 2 + 20);
    }
  }
  if (state === "win") {
    // ——— Congratulations: the Knight rescues the Princess ———
    ctx.fillStyle = "#274b73"; ctx.fillRect(0, 0, VW, VH);
    ctx.fillStyle = "#fff"; ctx.textAlign = "center";
    ctx.font = "bold 40px system-ui"; ctx.fillText("🏰", VW / 2, 84);
    ctx.font = "bold 34px system-ui"; ctx.fillText("🎉 Congratulations! 🎉", VW / 2, 140);
    ctx.font = "21px system-ui";
    ctx.fillText("You are the brave Knight who fought", VW / 2, 196);
    ctx.fillText("through all 12 levels, defeated the", VW / 2, 226);
    ctx.fillText("slime gauntlets, and rescued", VW / 2, 256);
    ctx.font = "bold 24px system-ui"; ctx.fillText("the Princess! 👸", VW / 2, 296);
    drawKnightFig(VW / 2 - 52, 382, 1.6, "down", null);
    drawPrincessFig(VW / 2 + 52, 378, 1.6);
    ctx.font = "30px system-ui"; ctx.fillText("❤️", VW / 2, 356 + Math.sin(performance.now() / 300) * 5);
    ctx.font = "20px system-ui";
    ctx.fillText("Time: " + Math.floor(elapsed) + "s  •  Best: " + best + "s", VW / 2, 500);
    ctx.font = "18px system-ui"; ctx.fillText("Tap to return to menu", VW / 2, 545);
  }
}
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
loadLevel(0); state = "menu";
requestAnimationFrame(loop);

// ---------- QA hooks ----------
window.__qa = {
  state: () => state,
  area: () => area,
  level: () => level + 1,
  levels: () => LEVELS.length,
  levelName: () => LEVELS[level].name,
  wavesTotal: () => LEVELS[level].waves,
  hasKey: () => hasKey,
  gateOpen: () => gateOpen,
  wave: () => wave,
  hearts: () => hearts,
  slimes: () => slimes.length,
  slimePos: () => slimes.map(s => ({ x: s.x, y: s.y })),
  levelData: () => LEVELS[level],
  pos: () => ({ x: px, y: py, c: Math.floor((px + 18) / TILE), r: Math.floor((py + 18) / TILE) }),
  startLevel: (n) => { startTime = performance.now(); elapsed = 0; loadLevel(n - 1); state = "play"; },
  setPos: (c, r) => { px = c * TILE + 6; py = r * TILE + 6; slimes = []; },
  tp: (c, r) => { px = c * TILE + 6; py = r * TILE + 6; },
  tpPx: (x, y) => { px = x; py = y; }
};
</script>
</body>
