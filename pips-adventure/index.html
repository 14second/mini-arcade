<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#79b5e0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pip's Adventure</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden;
    background: radial-gradient(120% 90% at 50% 0%, #9fd0f2 0%, rgba(159,208,242,0) 55%), linear-gradient(180deg, #6db1e2 0%, #4d90c8 60%, #35689c 100%);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    touch-action:none; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color: transparent; }
  canvas { position:fixed; inset:0; display:block; touch-action:none; }
  #muteBtn { position:fixed; top:10px; right:10px; z-index:10; width:48px; height:48px; border-radius:14px;
    border:1.5px solid rgba(255,255,255,.55); background:linear-gradient(180deg, rgba(38,66,105,.62), rgba(16,32,56,.62)); color:#fff; font-size:22px;
    box-shadow:0 8px 22px rgba(8,20,40,.35), inset 0 1px 0 rgba(255,255,255,.35);
    line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; }
  .ctl { position:fixed; bottom:18px; z-index:10; width:64px; height:64px; border-radius:50%;
    border:1.5px solid rgba(255,255,255,.6); background:linear-gradient(180deg, rgba(52,84,128,.55), rgba(18,36,62,.55)); color:#fff; font-size:26px;
    box-shadow:0 10px 24px rgba(8,20,40,.35), inset 0 1px 0 rgba(255,255,255,.35);
    display:flex; align-items:center; justify-content:center; }
  #btnL { left:16px; } #btnR { left:92px; } #btnJ { right:20px; width:76px; height:76px; background:linear-gradient(180deg, rgba(240,120,50,.72), rgba(178,64,18,.72)); }
  .ctl:active { background:rgba(255,255,255,.35); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="muteBtn" aria-label="Toggle sound">🔊</button>
<button class="ctl" id="btnL">◀</button>
<button class="ctl" id="btnR">▶</button>
<button class="ctl" id="btnJ">⤒</button>
<script>
// iOS audio routing: Web Audio defaults to the "ambient" channel, which the
// iPhone silent switch mutes entirely. Route it to the media/playback
// channel (iOS 17+ Audio Session API) on the first user gesture and inside
// audio init, so game music/SFX play even with silent mode on.
function iosPlaybackSession() {
  try { if ('audioSession' in navigator) navigator.audioSession.type = 'playback'; } catch (e) {}
}
document.addEventListener('pointerdown', iosPlaybackSession, true);
// Sleep in the background (2026-11-09): the wrapper's pauseTimers stops
// JS timers, but the Web Audio graph is a separate engine — suspend the
// audio context whenever the page is hidden so nothing keeps the CPU
// (or the sound) running while the app is in the background.
document.addEventListener("visibilitychange", function () {
  try {
    var c = window.__maCtx;
    if (document.hidden) {
      window.__maHidden = true;
      if (c) {
        if (c.close) { try { var p = c.close(); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
        if (c.suspend && c.state === "running") { try { c.suspend(); } catch (e) {} }
        window.__maCtx = null;
      }
    } else {
      window.__maHidden = false;
      var ac = c || (window.__maActx && window.__maActx());
      if (ac && ac.state === "suspended" && ac.resume) { try { ac.resume(); } catch (e) {} }
    }
  } catch (e) {}
});

document.addEventListener('touchstart', iosPlaybackSession, true);
"use strict";
/* PIP'S ADVENTURE — original side-scrolling platformer. Pip the fox runs,
   jumps, stomps beetles, bumps crates and gathers stars across 8 levels.
   Physics (px/s): gravity 2600, jump -980, run 260 (no accel ramp, so jump
   distance is deterministic). Max jump height = 980^2/(2*2600) = 184px =
   4.6 tiles; max jump distance = 260 * (2*980/2600) = 196px = 4.9 tiles.
   Levels are verified to keep pits <=3 tiles and rises <=3 tiles. */
const VW = 420, VH = 720, TILE = 40;
const canvas = document.getElementById("game"), ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1, scale = 1, ox = 0, oy = 0;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  scale = Math.min(W / VW, H / VH) * DPR; ox = (W * DPR - VW * scale) / 2; oy = (H * DPR - VH * scale) / 2;
}
window.addEventListener("resize", resize); resize();
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

// ---------- Audio (synthesized, >=130 Hz fundamentals, triangle/square) ----------
function storeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function storeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
let actx = null, muted = storeGet("pipsMuted") === "1", musicTimer = null, musicStep = 0;
const muteBtn = document.getElementById("muteBtn");
function setMute(m) { muted = m; storeSet("pipsMuted", m ? "1" : "0"); muteBtn.textContent = m ? "🔇" : "🔊"; }
muteBtn.textContent = muted ? "🔇" : "🔊";
muteBtn.addEventListener("click", () => setMute(!muted));
function initAudio() {
  iosPlaybackSession();
  if (!actx || actx.state === "closed") { try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); window.__maCtx = actx; window.__maActx = function () { return actx; };; } catch (e) {} }
  if (actx && actx.state === "suspended") actx.resume();
}
function tone(freq, dur, type, vol, when) {
  if (!actx || muted) return;
  const t = when || actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = type || "triangle"; o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.15, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
}
function sfx(name) {
  if (!actx || muted) return;
  if (name === "jump") tone(392, 0.18, "square", 0.12);
  else if (name === "stomp") { tone(220, 0.12, "square", 0.16); tone(165, 0.14, "triangle", 0.14); }
  else if (name === "star") { tone(880, 0.1, "triangle", 0.14); tone(1318, 0.18, "triangle", 0.12, actx.currentTime + 0.08); }
  else if (name === "bump") tone(196, 0.1, "square", 0.14);
  else if (name === "hurt") tone(233, 0.3, "square", 0.15);
  else if (name === "win") { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.22, "triangle", 0.14, actx.currentTime + i * 0.12)); }
}
const MELODY = [523, 659, 784, 659, 523, 587, 659, 784, 880, 784, 659, 587];
function startMusic() {
  if (musicTimer) return;
  musicTimer = setInterval(() => {
    if (!actx || muted) return;
    tone(MELODY[musicStep % MELODY.length], 0.22, "triangle", 0.07);
    if (musicStep % 4 === 0) tone(196, 0.3, "triangle", 0.06);
    musicStep++;
  }, 240);
}

// ---------- Levels: '#'=solid, 'B'=crate, 'S'=star, 'E'=beetle, 'X'=spiky, 'F'=finish, '.'=empty ----------
// Row 0 is the top. Ground is row 17. Pits <=3 wide, rises <=3 tall (verified).
const LEVELS = [
 [
  "....................",
  "....................",
  "....................",
  "....................",
  "....................",
  "....................",
  "....................",
  "....................",
  "....................",
  "....................",
  ".........S..........",
  "........###.........",
  "....................",
  "......S......S......",
  ".....###....###.....",
  "....................",
  "..S.....E....E......",
  "####################"
 ],
 [
  "...............................",
  "...............................",
  "...............................",
  "...............................",
  "...............................",
  "...............................",
  "...............................",
  "...............................",
  "...............................",
  "...............................",
  "................S..............",
  "...............###.............",
  "...............................",
  "..........S........S...........",
  ".........###......###..........",
  "...............................",
  "..S....E.......E......X....S...",
  "##########...#########...######"
 ],
 [
  "......................................",
  "......................................",
  "......................................",
  "......................................",
  "......................................",
  "......................................",
  "......................................",
  "......................................",
  "......................................",
  "......................S...............",
  ".....................###..............",
  "......................................",
  "............S.........................",
  "...........###........B...............",
  "..............................S.......",
  ".....................###.....###......",
  "..S....E.......B.......E......X.......",
  "########...########...########...#####"
 ],
 [
  "..............................................",
  "..............................................",
  "..............................................",
  "..............................................",
  "..............................................",
  "..............................................",
  "..............................................",
  "..............................................",
  "..............................................",
  "..........S...................................",
  ".........###..................................",
  "..............................................",
  "..........S........................S..........",
  ".........###......................###.........",
  "..............................................",
  "..............................................",
  "..S....E.......X.......E.......B.......E......",
  "######...########...########...#####...#######"
 ],
 [
  "..............................................",
  "..............................................",
  "..............................................",
  "..............................................",
  "..............................................",
  "..............................................",
  "..............................................",
  "..............................................",
  "..............................................",
  "..............................................",
  "..........S...................................",
  ".........###..................................",
  "..............................................",
  "..........S........................S..........",
  ".........###......................###.........",
  "..............................................",
  "..S....E.......X.......E.......B.......E......",
  "######...########...########...#####...#######"
 ],
 [
  ".......................................................",
  ".......................................................",
  ".......................................................",
  ".......................................................",
  ".......................................................",
  ".......................................................",
  ".......................................................",
  ".......................................................",
  ".......................................................",
  "............S..........................................",
  "...........###.........................................",
  ".......................................................",
  "............S...........................S..............",
  "...........###.........................###.............",
  "..............................................B........",
  ".......................................................",
  "..S....E.......X.......B.......E.......X.......E.......",
  "########...########...########...######...#####...#####"
 ],
 [
  "................................................................",
  "................................................................",
  "................................................................",
  "................................................................",
  "................................................................",
  "................................................................",
  "................................................................",
  "................................................................",
  "................................................................",
  "..............S.................................................",
  ".............###................................................",
  "................................................................",
  "..............S.............................S...................",
  ".............###...........................###..................",
  "..............................................B.................",
  "................................................................",
  "..S....E.......X.......B.......E.......X.......B.......E........",
  "########...########...########...######...#####...######...#####"
 ],
 [
  "........................................................................",
  "........................................................................",
  "........................................................................",
  "........................................................................",
  "........................................................................",
  "........................................................................",
  "........................................................................",
  "........................................................................",
  "........................................................................",
  "................S.......................................................",
  "...............###......................................................",
  "........................................................................",
  "................S...............................S.......................",
  "...............###.............................###......................",
  "..................................................B.....................",
  "........................................................................",
  "..S....E.......X.......B.......E.......X.......B.......E.......X........",
  "########...########...########...######...#####...######...#####...#####"
 ]
];
const FINISH = [17, 26, 35, 43, 43, 51, 59, 67];

// ---------- Game state ----------
let state = "menu";
let levelIdx = 0, lives = 3, score = 0, stars = 0, timeLeft = 120, levelTime = 0;
let unlocked = parseInt(storeGet("pipsUnlocked") || "1", 10);
let best = parseInt(storeGet("pipsBest") || "0", 10);
let player, enemies, camX, levelW, solids, starTiles, finishX;

function buildLevel(idx) {
  const rows = LEVELS[idx];
  levelW = rows[0].length * TILE;
  solids = []; starTiles = []; enemies = [];
  for (let r = 0; r < rows.length; r++) {
    for (let c = 0; c < rows[r].length; c++) {
      const ch = rows[r][c], x = c * TILE, y = r * TILE;
      if (ch === "#" || ch === "B") solids.push({ x, y, crate: ch === "B" });
      else if (ch === "S") starTiles.push({ x: x + 8, y: y + 8, taken: false });
      else if (ch === "E" || ch === "X") enemies.push({ x: x + 4, y: y + 4, w: 32, h: 32, spiky: ch === "X", dir: -1, alive: true });
    }
  }
  finishX = FINISH[idx] * TILE;
  player = { x: 2 * TILE, y: 15 * TILE, w: 26, h: 36, vx: 0, vy: 0, grounded: false, face: 1, invuln: 0 };
  camX = 0; timeLeft = 120; levelTime = 0;
}
function tileSolidAt(px, py) {
  const c = Math.floor(px / TILE), r = Math.floor(py / TILE);
  if (c < 0 || r < 0 || r >= 18) return false;
  for (const s of solids) if (s.x === c * TILE && s.y === r * TILE) return s;
  return null;
}
function solidAtRect(x, y, w, h) {
  const c0 = Math.floor(x / TILE), c1 = Math.floor((x + w - 1) / TILE);
  const r0 = Math.floor(y / TILE), r1 = Math.floor((y + h - 1) / TILE);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    if (tileSolidAt(c * TILE + 1, r * TILE + 1)) return true;
  }
  return false;
}
function bumpCrate(px, py) {
  const s = tileSolidAt(px, py);
  if (s && s.crate) {
    solids.splice(solids.indexOf(s), 1);
    score += 50; stars++; sfx("bump"); sfx("star");
    return true;
  }
  return false;
}
function loseLife() {
  lives--; sfx("hurt");
  if (lives <= 0) { state = "over"; if (score > best) { best = score; storeSet("pipsBest", String(best)); } }
  else { const keep = score; buildLevel(levelIdx); score = keep; player.invuln = 2; }
}
function update(dt) {
  if (state !== "play") return;
  levelTime += dt; timeLeft -= dt;
  if (timeLeft <= 0) { loseLife(); return; }
  const p = player;
  let move = 0;
  if (keys.left || touch.left) move -= 1;
  if (keys.right || touch.right) move += 1;
  p.vx = move * 260;
  if (move !== 0) p.face = move;
  if ((keys.jump || touch.jump) && p.grounded && !p.jumpHeld) { p.vy = -980; p.grounded = false; p.jumpHeld = true; sfx("jump"); }
  if (!(keys.jump || touch.jump)) p.jumpHeld = false;
  if (!keys.jump && !touch.jump && p.vy < -300) p.vy = -300;
  p.vy += 2600 * dt;
  p.x += p.vx * dt;
  if (p.vx > 0 && solidAtRect(p.x + p.w, p.y + 4, 1, p.h - 8)) { p.x = Math.floor((p.x + p.w) / TILE) * TILE - p.w - 0.1; }
  if (p.vx < 0 && solidAtRect(p.x - 1, p.y + 4, 1, p.h - 8)) { p.x = (Math.floor(p.x / TILE) + 1) * TILE + 0.1; }
  p.x = clamp(p.x, 0, levelW - p.w);
  const oldBottom = p.y + p.h;
  p.y += p.vy * dt;
  p.grounded = false;
  if (p.vy >= 0 && solidAtRect(p.x + 3, p.y + p.h, p.w - 6, 1)) {
    p.y = Math.floor((p.y + p.h) / TILE) * TILE - p.h - 0.1; p.vy = 0; p.grounded = true;
  } else if (p.vy < 0 && solidAtRect(p.x + 3, p.y - 1, p.w - 6, 1)) {
    const cy = Math.floor(p.y / TILE);
    bumpCrate(p.x + p.w / 2, p.y - 2);
    p.y = (cy + 1) * TILE + 0.1; p.vy = 0;
  }
  if (p.y > VH + 200) { loseLife(); return; }
  for (const s of starTiles) {
    if (!s.taken && p.x < s.x + 24 && p.x + p.w > s.x && p.y < s.y + 24 && p.y + p.h > s.y) {
      s.taken = true; score += 50; stars++; sfx("star");
    }
  }
  for (const e of enemies) {
    if (!e.alive) continue;
    e.x += e.dir * 40 * dt;
    const aheadX = e.dir < 0 ? e.x - 1 : e.x + e.w + 1;
    // turn at a wall, or at a ledge (no solid 4px below the front foot)
    if (solidAtRect(aheadX, e.y + 4, 1, e.h - 8) || !solidAtRect(e.x + (e.dir < 0 ? 2 : e.w - 2), e.y + e.h + 4, 1, 1)) e.dir *= -1;
    e.x = clamp(e.x, 0, levelW - e.w);
    if (p.invuln <= 0 && p.x < e.x + e.w && p.x + p.w > e.x && p.y < e.y + e.h && p.y + p.h > e.y) {
      if (p.vy > 0 && oldBottom <= e.y + 14 && !e.spiky) {
        e.alive = false; score += 100; p.vy = -520; sfx("stomp");
      } else { loseLife(); return; }
    }
  }
  if (p.invuln > 0) p.invuln -= dt;
  if (p.x + p.w >= finishX) {
    score += 500 + Math.max(0, Math.floor(timeLeft)) * 10;
    sfx("win");
    if (levelIdx >= 7) {
      state = "win";
      if (score > best) { best = score; storeSet("pipsBest", String(best)); }
    } else {
      levelIdx++;
      if (levelIdx + 1 > unlocked) { unlocked = levelIdx + 1; storeSet("pipsUnlocked", String(unlocked)); }
      buildLevel(levelIdx);
    }
  }
  camX = clamp(p.x + p.w / 2 - VW / 2, 0, Math.max(0, levelW - VW));
}

// ---------- Input ----------
const keys = { left: false, right: false, jump: false };
const touch = { left: false, right: false, jump: false };
window.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft" || e.key === "a") keys.left = true;
  if (e.key === "ArrowRight" || e.key === "d") keys.right = true;
  if (e.key === " " || e.key === "ArrowUp" || e.key === "w") { keys.jump = true; e.preventDefault(); }
  if (e.key === "Enter" && state !== "play") startFromMenu();
});
window.addEventListener("keyup", e => {
  if (e.key === "ArrowLeft" || e.key === "a") keys.left = false;
  if (e.key === "ArrowRight" || e.key === "d") keys.right = false;
  if (e.key === " " || e.key === "ArrowUp" || e.key === "w") keys.jump = false;
});
function bindBtn(id, prop) {
  const el = document.getElementById(id);
  const on = e => { e.preventDefault(); touch[prop] = true; initAudio(); };
  const off = e => { e.preventDefault(); touch[prop] = false; };
  el.addEventListener("pointerdown", on); el.addEventListener("pointerup", off);
  el.addEventListener("pointercancel", off); el.addEventListener("pointerleave", off);
}
bindBtn("btnL", "left"); bindBtn("btnR", "right"); bindBtn("btnJ", "jump");

function startFromMenu() {
  initAudio(); startMusic();
  levelIdx = 0; lives = 3; score = 0; stars = 0;
  buildLevel(0); state = "play";
}
canvas.addEventListener("pointerdown", e => {
  initAudio();
  if (state === "menu") {
    const mx = (e.clientX * DPR - ox) / scale, my = (e.clientY * DPR - oy) / scale;
    for (let i = 0; i < 8; i++) {
      const bx = 40 + (i % 4) * 95, by = 330 + Math.floor(i / 4) * 90;
      if (mx >= bx && mx <= bx + 80 && my >= by && my <= by + 70 && i + 1 <= unlocked) {
        startMusic(); levelIdx = i; lives = 3; score = 0; stars = 0; buildLevel(i); state = "play"; return;
      }
    }
    startFromMenu();
  } else if (state === "over" || state === "win") { state = "menu"; }
});

// ---------- Draw ----------
function gradL(x0, y0, x1, y1) {
  const g = ctx["createLinearGradient"](x0, y0, x1, y1);
  if (g && typeof g.addColorStop !== "function") { try { g.addColorStop = function () {}; } catch (e) { return "#888888"; } }
  return g;
}
function gradR(x0, y0, r0, x1, y1, r1) {
  const g = ctx["createRadialGradient"](x0, y0, r0, x1, y1, r1);
  if (g && typeof g.addColorStop !== "function") { try { g.addColorStop = function () {}; } catch (e) { return "#888888"; } }
  return g;
}
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function glassPanel(x, y, w, h, r) {
  ctx.save();
  ctx.shadowColor = "rgba(8,18,34,.45)"; ctx.shadowBlur = 30; ctx.shadowOffsetY = 10;
  const g = gradL(0, y, 0, y + h);
  g.addColorStop(0, "rgba(26,38,58,.86)"); g.addColorStop(1, "rgba(13,20,33,.88)");
  ctx.fillStyle = g; rr(x, y, w, h, r); ctx.fill();
  ctx.restore();
  ctx.lineWidth = 1.5; ctx.strokeStyle = "rgba(255,255,255,.18)"; rr(x, y, w, h, r); ctx.stroke();
}
function starPath(cx, cy, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const rad = i % 2 ? r * 0.48 : r, a = -Math.PI / 2 + i * Math.PI / 5;
    const x = cx + Math.cos(a) * rad, y = cy + Math.sin(a) * rad;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
}
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = "#79b5e0"; ctx.fillRect(0, 0, W, H);
  ctx.setTransform(scale, 0, 0, scale, ox, oy);
  const cave = levelIdx >= 4;
  const sky = gradL(0, 0, 0, VH);
  if (cave) { sky.addColorStop(0, "#0d1220"); sky.addColorStop(0.55, "#1c2438"); sky.addColorStop(1, "#2c3a58"); }
  else { sky.addColorStop(0, "#5aa7e6"); sky.addColorStop(0.45, "#8ec9f2"); sky.addColorStop(0.8, "#cfeef7"); sky.addColorStop(1, "#a8d8f0"); }
  ctx.fillStyle = sky; ctx.fillRect(0, 0, VW, VH);
  if (state === "menu") {
    // soft distant hills behind the menu card (depth, visual only)
    ctx.fillStyle = "rgba(70,140,90,.35)";
    ctx.beginPath(); ctx.ellipse(60, VH, 260, 150, 0, Math.PI, 0); ctx.fill();
    ctx.beginPath(); ctx.ellipse(380, VH, 300, 190, 0, Math.PI, 0); ctx.fill();
    glassPanel(16, 60, VW - 32, 540, 22);
    ctx.textAlign = "center";
    const tg = gradL(0, 70, 0, 118);
    tg.addColorStop(0, "#ffffff"); tg.addColorStop(0.55, "#ffe1ad"); tg.addColorStop(1, "#ffb84d");
    ctx.fillStyle = tg;
    ctx.font = "bold 44px system-ui"; ctx.fillText("🦊 Pip's Adventure", VW / 2, 110);
    ctx.fillStyle = "#e8f1fb"; ctx.font = "20px system-ui"; ctx.fillText("Run, jump, stomp beetles,", VW / 2, 160);
    ctx.fillText("bump crates, grab stars!", VW / 2, 188);
    ctx.font = "18px system-ui"; ctx.fillText("Best: " + best + "  •  Tap a level to play", VW / 2, 240);
    ctx.font = "16px system-ui"; ctx.fillStyle = "#a9bdd4"; ctx.fillText("◀ ▶ move  •  ⤒ jump  •  Arrows / Space", VW / 2, 280);
    for (let i = 0; i < 8; i++) {
      const bx = 40 + (i % 4) * 95, by = 330 + Math.floor(i / 4) * 90;
      const locked = i + 1 > unlocked;
      ctx.save();
      ctx.shadowColor = "rgba(0,0,0,.35)"; ctx.shadowBlur = 10; ctx.shadowOffsetY = 4;
      const bg = gradL(0, by, 0, by + 70);
      if (locked) { bg.addColorStop(0, "#6d7f99"); bg.addColorStop(1, "#47566c"); }
      else if (i < 4) { bg.addColorStop(0, "#55c46e"); bg.addColorStop(1, "#2c7f3e"); }
      else { bg.addColorStop(0, "#9a7fe8"); bg.addColorStop(1, "#6448b8"); }
      ctx.fillStyle = bg; rr(bx, by, 80, 70, 14); ctx.fill();
      ctx.restore();
      ctx.lineWidth = 1.5; ctx.strokeStyle = "rgba(255,255,255,.35)"; rr(bx, by, 80, 70, 14); ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,.22)"; rr(bx + 5, by + 5, 70, 20, 9); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.font = "bold 20px system-ui";
      ctx.fillText(locked ? "🔒" : (i < 4 ? "🌿" : "🕳️"), bx + 40, by + 30);
      ctx.font = "bold 18px system-ui"; ctx.fillText((i < 4 ? "M" : "C") + (i % 4 + 1), bx + 40, by + 56);
    }
    ctx.font = "16px system-ui"; ctx.fillStyle = "#eaf4ff";
    ctx.fillText("Tap anywhere else to start at Level 1", VW / 2, 560);
    return;
  }
  // parallax backdrop layers drift slower than the world (visual only)
  ctx.save(); ctx.translate(-camX * 0.3, 0);
  if (cave) {
    ctx.fillStyle = "rgba(120,100,200,.16)";
    for (let i = 0; i < 40; i++) { const x = i * 160; ctx.beginPath(); ctx.ellipse(x + 40, 90 + (i % 3) * 46, 52, 20 + (i % 2) * 8, 0, 0, 7); ctx.fill(); }
  } else {
    ctx.fillStyle = "rgba(255,255,255,.75)";
    for (let i = 0; i < 40; i++) { const x = i * 160, y = 60 + (i % 3) * 30;
      ctx.beginPath(); ctx.arc(x + 14, y + 9, 13, 0, 7); ctx.arc(x + 34, y + 3, 17, 0, 7); ctx.arc(x + 52, y + 9, 12, 0, 7); ctx.fill(); }
  }
  ctx.restore();
  ctx.save(); ctx.translate(-camX * 0.55, 0);
  ctx.fillStyle = cave ? "rgba(70,60,110,.35)" : "rgba(96,168,128,.40)";
  for (let i = 0; i < 40; i++) { const x = i * 300; ctx.beginPath(); ctx.ellipse(x + 150, 17 * TILE + 46, 190, 74, 0, Math.PI, 0); ctx.fill(); }
  ctx.restore();
  ctx.save(); ctx.translate(-camX, 0);
  for (const s of solids) {
    const tg2 = gradL(0, s.y, 0, s.y + TILE);
    if (s.crate) { tg2.addColorStop(0, "#eebd55"); tg2.addColorStop(0.5, "#c98f2e"); tg2.addColorStop(1, "#a06e1c"); }
    else if (cave) { tg2.addColorStop(0, "#6e5a44"); tg2.addColorStop(0.5, "#4a4038"); tg2.addColorStop(1, "#33291f"); }
    else { tg2.addColorStop(0, "#a9743f"); tg2.addColorStop(0.45, "#7a5230"); tg2.addColorStop(1, "#5f3d22"); }
    ctx.fillStyle = tg2; ctx.fillRect(s.x, s.y, TILE, TILE);
    ctx.fillStyle = s.crate ? "rgba(255,236,170,.75)" : (cave ? "rgba(200,180,150,.30)" : "rgba(140,220,110,.85)");
    ctx.fillRect(s.x, s.y, TILE, 5);
    ctx.fillStyle = "rgba(0,0,0,.20)"; ctx.fillRect(s.x, s.y + TILE - 5, TILE, 5);
    ctx.fillStyle = "rgba(255,255,255,.10)"; ctx.fillRect(s.x + 4, s.y + 4, TILE - 8, 10);
    if (s.crate) {
      ctx.strokeStyle = "rgba(122,85,16,.8)"; ctx.lineWidth = 2.5; ctx.strokeRect(s.x + 4, s.y + 4, TILE - 8, TILE - 8);
      ctx.beginPath(); ctx.moveTo(s.x + 4, s.y + 4); ctx.lineTo(s.x + TILE - 4, s.y + TILE - 4); ctx.moveTo(s.x + TILE - 4, s.y + 4); ctx.lineTo(s.x + 4, s.y + TILE - 4); ctx.stroke();
      ctx.fillStyle = "#7a5510"; ctx.font = "bold 22px system-ui"; ctx.textAlign = "center"; ctx.fillText("?", s.x + 20, s.y + 28);
    }
  }
  for (const s of starTiles) if (!s.taken) {
    const pulse = 1 + Math.sin(performance.now() / 260 + (s.x + s.y) / 60) * 0.10;
    const glow = gradR(s.x + 12, s.y + 12, 2, s.x + 12, s.y + 12, 22);
    glow.addColorStop(0, "rgba(255,224,110,.55)"); glow.addColorStop(1, "rgba(255,224,110,0)");
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(s.x + 12, s.y + 12, 22, 0, 7); ctx.fill();
    const sg = gradL(0, s.y, 0, s.y + 24);
    sg.addColorStop(0, "#fff3a0"); sg.addColorStop(0.55, "#ffd93b"); sg.addColorStop(1, "#f0a51e");
    ctx.fillStyle = sg; starPath(s.x + 12, s.y + 12, 12.5 * pulse); ctx.fill();
    ctx.strokeStyle = "rgba(160,100,10,.65)"; ctx.lineWidth = 1.4; starPath(s.x + 12, s.y + 12, 12.5 * pulse); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,.9)"; ctx.beginPath(); ctx.arc(s.x + 8.5, s.y + 8, 2.2, 0, 7); ctx.fill();
  }
  const pg = gradL(finishX, 0, finishX + 6, 0);
  pg.addColorStop(0, "#f4f6f8"); pg.addColorStop(1, "#9aa7b5");
  ctx.fillStyle = pg; ctx.fillRect(finishX, 13 * TILE, 6, 4 * TILE);
  ctx.fillStyle = "#ffd94d"; ctx.beginPath(); ctx.arc(finishX + 3, 13 * TILE - 2, 4.5, 0, 7); ctx.fill();
  const waveOff = Math.sin(performance.now() / 200) * 3;
  const fg = gradL(finishX, 13 * TILE, finishX + 50, 13 * TILE + 34);
  fg.addColorStop(0, "#ff6b5e"); fg.addColorStop(1, "#d92c2c");
  ctx.fillStyle = fg; ctx.beginPath();
  ctx.moveTo(finishX + 6, 13 * TILE); ctx.quadraticCurveTo(finishX + 30, 13 * TILE + 4 + waveOff, finishX + 50, 13 * TILE + 10 + waveOff);
  ctx.quadraticCurveTo(finishX + 30, 13 * TILE + 20 + waveOff, finishX + 6, 13 * TILE + 32); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.font = "bold 13px system-ui"; ctx.textAlign = "center"; ctx.fillText("GOAL", finishX + 27, 13 * TILE + 22 + waveOff * 0.5);
  for (const e of enemies) if (e.alive) {
    ctx.fillStyle = "rgba(0,0,0,.22)"; ctx.beginPath(); ctx.ellipse(e.x + e.w / 2, e.y + e.h + 3, e.w / 2, 4.5, 0, 0, 7); ctx.fill();
    const eg = gradR(e.x + 10, e.y + 8, 4, e.x + 16, e.y + 16, 30);
    if (e.spiky) { eg.addColorStop(0, "#d06fe0"); eg.addColorStop(0.6, "#8b1fa2"); eg.addColorStop(1, "#5e106e"); }
    else { eg.addColorStop(0, "#5cc465"); eg.addColorStop(0.6, "#2e7d32"); eg.addColorStop(1, "#1b4d1f"); }
    ctx.fillStyle = eg; rr(e.x, e.y + 3, e.w, e.h - 3, 10); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.35)"; ctx.beginPath(); ctx.ellipse(e.x + 11, e.y + 10, 7, 4, -0.4, 0, 7); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(e.x + 10, e.y + 13, 4.6, 0, 7); ctx.arc(e.x + 23, e.y + 13, 4.6, 0, 7); ctx.fill();
    ctx.fillStyle = "#14210f"; ctx.beginPath(); ctx.arc(e.x + 10 + e.dir * 1.6, e.y + 13.5, 2.4, 0, 7); ctx.arc(e.x + 23 + e.dir * 1.6, e.y + 13.5, 2.4, 0, 7); ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fillRect(e.x + 5, e.y + e.h - 6, 6, 4); ctx.fillRect(e.x + e.w - 11, e.y + e.h - 6, 6, 4);
    if (e.spiky) { ctx.fillStyle = "#e1bee7"; for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.moveTo(e.x + 4 + k * 11, e.y + 4); ctx.lineTo(e.x + 8.5 + k * 11, e.y - 7); ctx.lineTo(e.x + 13 + k * 11, e.y + 4); ctx.closePath(); ctx.fill(); } }
  }
  const p = player;
  ctx.fillStyle = "rgba(20,40,20,.25)"; ctx.beginPath(); ctx.ellipse(p.x + p.w / 2, p.y + p.h + 4, p.w / 2, 4, 0, 0, 7); ctx.fill();
  if (!(p.invuln > 0 && Math.floor(p.invuln * 10) % 2 === 0)) {
    const wag = Math.sin(performance.now() / 160) * 2.5;
    ctx.strokeStyle = "#d96a1e"; ctx.lineWidth = 8; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(p.x + (p.face > 0 ? 1 : p.w - 1), p.y + 24);
    ctx.quadraticCurveTo(p.x + (p.face > 0 ? -12 : p.w + 12), p.y + 18 + wag, p.x + (p.face > 0 ? -15 : p.w + 15), p.y + 8 + wag); ctx.stroke();
    ctx.strokeStyle = "#fff3e2"; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(p.x + (p.face > 0 ? -13 : p.w + 13), p.y + 11 + wag); ctx.lineTo(p.x + (p.face > 0 ? -15 : p.w + 15), p.y + 8 + wag); ctx.stroke();
    const bg2 = gradL(0, p.y, 0, p.y + p.h);
    bg2.addColorStop(0, "#f79a4b"); bg2.addColorStop(0.6, "#e8722a"); bg2.addColorStop(1, "#c85a18");
    ctx.fillStyle = bg2; rr(p.x, p.y, p.w, p.h, 9); ctx.fill();
    ctx.fillStyle = "#ffe8c9"; ctx.beginPath(); ctx.ellipse(p.x + p.w / 2 + p.face * 3, p.y + p.h - 10, 8, 9, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "#f79a4b"; ctx.beginPath();
    ctx.moveTo(p.x + 3, p.y + 3); ctx.lineTo(p.x + 9, p.y - 9); ctx.lineTo(p.x + 14, p.y + 2); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(p.x + p.w - 3, p.y + 3); ctx.lineTo(p.x + p.w - 9, p.y - 9); ctx.lineTo(p.x + p.w - 14, p.y + 2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#8a3c10"; ctx.beginPath();
    ctx.moveTo(p.x + 5.5, p.y + 1); ctx.lineTo(p.x + 9, p.y - 6); ctx.lineTo(p.x + 11.5, p.y + 1); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(p.x + p.w - 5.5, p.y + 1); ctx.lineTo(p.x + p.w - 9, p.y - 6); ctx.lineTo(p.x + p.w - 11.5, p.y + 1); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(p.x + (p.face > 0 ? 18 : 8), p.y + 11, 4.8, 0, 7); ctx.fill();
    ctx.fillStyle = "#1d1408"; ctx.beginPath(); ctx.arc(p.x + (p.face > 0 ? 19.8 : 6.2), p.y + 11.5, 2.5, 0, 7); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.95)"; ctx.beginPath(); ctx.arc(p.x + (p.face > 0 ? 18.8 : 7.2), p.y + 9.6, 1.1, 0, 7); ctx.fill();
    ctx.fillStyle = "#7a3410"; ctx.beginPath(); ctx.arc(p.x + (p.face > 0 ? p.w - 2 : 2), p.y + 19, 2.4, 0, 7); ctx.fill();
    ctx.fillStyle = "#c85a18"; rr(p.x + 4, p.y + p.h - 5, 7, 5, 2); ctx.fill(); rr(p.x + p.w - 11, p.y + p.h - 5, 7, 5, 2); ctx.fill();
  }
  ctx.restore();
  const vg = gradR(VW / 2, VH / 2, VH * 0.42, VW / 2, VH / 2, VH * 0.92);
  vg.addColorStop(0, "rgba(10,25,45,0)"); vg.addColorStop(1, "rgba(10,25,45,.16)");
  ctx.fillStyle = vg; ctx.fillRect(0, 0, VW, VH);
  ctx.save();
  ctx.shadowColor = "rgba(10,30,50,.28)"; ctx.shadowBlur = 12; ctx.shadowOffsetY = 3;
  ctx.fillStyle = "rgba(16,30,48,.48)"; rr(6, 6, VW - 12, 40, 14); ctx.fill();
  ctx.restore();
  ctx.lineWidth = 1; ctx.strokeStyle = "rgba(255,255,255,.30)"; rr(6, 6, VW - 12, 40, 14); ctx.stroke();
  ctx.fillStyle = "#fff"; ctx.font = "bold 18px system-ui"; ctx.textAlign = "left";
  ctx.fillText((levelIdx < 4 ? "Meadow " : "Cave ") + (levelIdx % 4 + 1), 12, 28);
  ctx.textAlign = "center";
  ctx.fillText("⭐ " + stars + "   ❤️ " + lives + "   ⏱ " + Math.max(0, Math.ceil(timeLeft)), VW / 2, 28);
  ctx.textAlign = "right"; ctx.fillText(score + " pts", VW - 12, 28);
  if (state === "over" || state === "win") {
    ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(0, 0, VW, VH);
    glassPanel(30, VH / 2 - 105, VW - 60, 190, 22);
    ctx.fillStyle = "#fff"; ctx.textAlign = "center";
    ctx.font = "bold 40px system-ui";
    ctx.fillText(state === "win" ? "🏆 You did it, Pip!" : "Game Over", VW / 2, VH / 2 - 20);
    ctx.font = "20px system-ui";
    ctx.fillText("Score: " + score + "  •  Best: " + best, VW / 2, VH / 2 + 20);
    ctx.fillStyle = "#a9bdd4"; ctx.font = "600 17px system-ui";
    ctx.fillText("Tap to return to menu", VW / 2, VH / 2 + 60);
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
buildLevel(0);
requestAnimationFrame(loop);
</script>
</body>
</html>
