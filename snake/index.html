<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#0d2812">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Snake</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:#0d2812;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    touch-action:none; user-select:none; -webkit-user-select:none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { position:fixed; inset:0; display:block; touch-action:none; }
  #muteBtn {
    position:fixed; top:10px; right:10px; z-index:10;
    width:48px; height:48px; border-radius:12px;
    border:2px solid rgba(140,255,160,.55); background:rgba(6,26,10,.62);
    color:#fff; font-size:22px; line-height:1; cursor:pointer;
    touch-action:none; user-select:none; -webkit-user-select:none;
    display:flex; align-items:center; justify-content:center; padding:0;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="muteBtn" aria-label="Toggle sound">🔊</button>
<script>
// iOS audio routing: Web Audio defaults to the "ambient" channel, which the
// iPhone silent switch mutes entirely. Route it to the media/playback
// channel (iOS 17+ Audio Session API) on the first user gesture and inside
// audio init, so game music/SFX play even with silent mode on.
function iosPlaybackSession() {
  try { if ('audioSession' in navigator) navigator.audioSession.type = 'playback'; } catch (e) {}
}
document.addEventListener('pointerdown', iosPlaybackSession, true);
// Sleep in the background (2026-11-09): the wrapper's pauseTimers stops
// JS timers, but the Web Audio graph is a separate engine — suspend the
// audio context whenever the page is hidden so nothing keeps the CPU
// (or the sound) running while the app is in the background.
document.addEventListener("visibilitychange", function () {
  try {
    var c = window.__maCtx;
    if (document.hidden) {
      window.__maHidden = true;
      if (c) {
        if (c.close) { try { var p = c.close(); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
        if (c.suspend && c.state === "running") { try { c.suspend(); } catch (e) {} }
        window.__maCtx = null;
      }
    } else {
      window.__maHidden = false;
      var ac = c || (window.__maActx && window.__maActx());
      if (ac && ac.state === "suspended" && ac.resume) { try { ac.resume(); } catch (e) {} }
    }
  } catch (e) {}
});

document.addEventListener('touchstart', iosPlaybackSession, true);

"use strict";
/* ============================================================
   SNAKE — the classic. Swipe, D-pad, or arrow keys / WASD.
   Eat apples, grow long, speed creeps up. Walls are deadly.
   ============================================================ */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1, u = 4;

const HUD_H = 62;
let boardX = 0, boardY = 0, cell = 20, ctrlY = 0, showPad = false;
const N = 17; // grid is N x N
let dpad = { up:null, down:null, left:null, right:null };

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  u = Math.min(W, H) / 100;
  showPad = H > W; // portrait: on-screen d-pad under the board
  const ctrlH = showPad ? Math.min(168, H * 0.24) : 8;
  const availH = H - HUD_H - ctrlH;
  const side = Math.min(W - 12, availH);
  cell = Math.max(12, Math.floor(side / N));
  boardX = Math.round((W - cell * N) / 2);
  boardY = Math.round(HUD_H + (availH - cell * N) / 2);
  ctrlY = boardY + cell * N + 10;
  // D-pad: cross layout centred in the control strip
  const bw = Math.min(58, cell * 2.6), bh = bw;
  const cxm = W / 2, cym = ctrlY + ctrlH / 2 - 4;
  dpad.up    = { x: cxm - bw/2,     y: cym - bh*1.06, w: bw, h: bh };
  dpad.down  = { x: cxm - bw/2,     y: cym + bh*0.06, w: bw, h: bh };
  dpad.left  = { x: cxm - bw*1.56,  y: cym - bh*0.5,  w: bw, h: bh };
  dpad.right = { x: cxm + bw*0.56,  y: cym - bh*0.5,  w: bw, h: bh };
}
window.addEventListener("resize", resize);

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

// ---------- Audio ----------
let actx = null, muted = false;
const muteBtn = document.getElementById("muteBtn");

function initAudio() {
  iosPlaybackSession();
  if (!actx) {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) actx = new AC(); window.__maCtx = actx; window.__maActx = function () { return actx; };;
    } catch (e) { actx = null; }
    if (actx) startMusicScheduler();
  }
  if (actx && actx.state === "suspended") actx.resume();
}

function beep(freq, dur, type, vol, slide) {
  if (!actx || muted) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || "square";
  o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t + dur);
  g.gain.setValueAtTime(vol || 0.08, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function sfxEat()  { beep(660, 0.09, "square", 0.06, 990); }
function sfxDie()  { beep(300, 0.4, "sawtooth", 0.09, 55); }
function sfxTurn() { beep(190, 0.03, "square", 0.015); }

// Cheerful C-major loop, BPM 132. Bass roots >= MIDI 48 (phone speakers).
const BPM = 132, STEP_DUR = 60 / BPM / 2;
const BASS = [
  48,0,55,0, 48,0,55,0,  53,0,60,0, 53,0,60,0,
  50,0,57,0, 50,0,57,0,  55,0,50,0, 55,0, 0,0
];
const LEAD = [
  72,0,76,0, 79,0,76,0,  81,0,79,0, 76,0, 0,0,
  74,0,77,0, 81,0,77,0,  79,0,74,0, 71,0, 0,0
];
const PADS = [ [60,64,67], [65,69,72], [62,66,69], [55,62,67] ];
let musicStep = 0, nextNoteTime = 0, musicTimer = null;
function midiFreq(m) { return 440 * Math.pow(2, (m - 69) / 12); }
function toneAt(midi, when, dur, type, vol) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(midiFreq(midi), when);
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(vol, when + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(when); o.stop(when + dur + 0.03);
}
function scheduleStep(step, when) {
  if (muted) return;
  const b = BASS[step % 32]; if (b) toneAt(b, when, STEP_DUR * 0.92, "triangle", 0.055);
  const l = LEAD[step % 32]; if (l) toneAt(l, when, STEP_DUR * 0.8, "square", 0.026);
  if (step % 8 === 0) {
    const chord = PADS[Math.floor(step / 8) % PADS.length];
    for (let i = 0; i < chord.length; i++) toneAt(chord[i], when, STEP_DUR * 7.6, "triangle", 0.013);
  }
}
function startMusicScheduler() {
  if (musicTimer !== null || !actx) return;
  musicStep = 0; nextNoteTime = actx.currentTime + 0.06;
  musicTimer = setInterval(function () {
    if (!actx) return;
    if (nextNoteTime < actx.currentTime) nextNoteTime = actx.currentTime + 0.05;
    while (nextNoteTime < actx.currentTime + 0.12) {
      scheduleStep(musicStep, nextNoteTime);
      nextNoteTime += STEP_DUR; musicStep = (musicStep + 1) % 32;
    }
  }, 25);
}
function setMuted(m) { muted = m; muteBtn.textContent = muted ? "🔇" : "🔊"; }
muteBtn.addEventListener("pointerdown", function (e) {
  e.stopPropagation(); e.preventDefault(); initAudio(); setMuted(!muted);
});
muteBtn.addEventListener("click", function (e) { e.stopPropagation(); e.preventDefault(); });

// ---------- Game state ----------
let state = "menu"; // menu | play | over
let hi = 0;
try { hi = parseInt(localStorage.getItem("snake_hi") || "0", 10) || 0; } catch (e) { hi = 0; }
let snake, dir, dirQueue, food, score, eaten, stepMs, acc, dead;

function reset() {
  const c = Math.floor(N / 2);
  snake = [ {x:c,y:c}, {x:c-1,y:c}, {x:c-2,y:c} ];
  dir = { x: 1, y: 0 }; dirQueue = [];
  score = 0; eaten = 0; stepMs = 175; acc = 0; dead = false;
  placeFood();
}
function placeFood() {
  while (true) {
    const f = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) };
    if (!snake.some(s => s.x === f.x && s.y === f.y)) { food = f; return; }
  }
}
function setDir(x, y) {
  const last = dirQueue.length ? dirQueue[dirQueue.length - 1] : dir;
  if (last.x === -x && last.y === -y) return;   // no 180 turns
  if (last.x === x && last.y === y) return;
  if (dirQueue.length < 3) { dirQueue.push({ x, y }); sfxTurn(); }
}
function step() {
  if (dirQueue.length) dir = dirQueue.shift();
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N ||
      snake.some(s => s.x === head.x && s.y === head.y)) {
    state = "over"; sfxDie();
    if (score > hi) { hi = score; try { localStorage.setItem("snake_hi", String(hi)); } catch (e) {} }
    return;
  }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    eaten++; score += 10; sfxEat();
    stepMs = Math.max(88, 175 - eaten * 3);
    placeFood();
  } else {
    snake.pop();
  }
}
function startGame() { initAudio(); reset(); state = "play"; }

// ---------- Input ----------
let swipeStart = null;
function inRect(x, y, r) { return r && x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h; }
canvas.addEventListener("pointerdown", function (e) {
  initAudio();
  const x = e.clientX, y = e.clientY;
  if (state !== "play") { startGame(); return; }
  if (showPad) {
    if (inRect(x, y, dpad.up))    { setDir(0, -1); return; }
    if (inRect(x, y, dpad.down))  { setDir(0, 1);  return; }
    if (inRect(x, y, dpad.left))  { setDir(-1, 0); return; }
    if (inRect(x, y, dpad.right)) { setDir(1, 0);  return; }
  }
  swipeStart = { x, y };
});
canvas.addEventListener("pointerup", function (e) {
  if (!swipeStart || state !== "play") { swipeStart = null; return; }
  const dx = e.clientX - swipeStart.x, dy = e.clientY - swipeStart.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) > 22) {
    if (Math.abs(dx) > Math.abs(dy)) setDir(Math.sign(dx), 0);
    else setDir(0, Math.sign(dy));
  }
  swipeStart = null;
});
window.addEventListener("keydown", function (e) {
  const k = e.key;
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(k)) e.preventDefault();
  initAudio();
  if (state !== "play") { if (k === " " || k === "Enter") startGame(); return; }
  if (k === "ArrowUp" || k === "w" || k === "W") setDir(0, -1);
  else if (k === "ArrowDown" || k === "s" || k === "S") setDir(0, 1);
  else if (k === "ArrowLeft" || k === "a" || k === "A") setDir(-1, 0);
  else if (k === "ArrowRight" || k === "d" || k === "D") setDir(1, 0);
  else if (k === "m" || k === "M") setMuted(!muted);
});

// ---------- Draw ----------
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function draw() {
  ctx.fillStyle = "#0d2812"; ctx.fillRect(0, 0, W, H);
  // HUD
  ctx.fillStyle = "#eaffea"; ctx.font = "bold " + Math.round(u * 5.2) + "px system-ui, sans-serif";
  ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.fillText("Score " + score, 14, HUD_H / 2);
  ctx.textAlign = "right";
  ctx.fillStyle = "#9fd8a8";
  ctx.fillText("Best " + Math.max(hi, score), W - 66, HUD_H / 2);
  // Board
  ctx.fillStyle = "#123a1a"; rr(boardX - 4, boardY - 4, cell * N + 8, cell * N + 8, 10); ctx.fill();
  for (let gy = 0; gy < N; gy++) for (let gx = 0; gx < N; gx++) {
    if ((gx + gy) % 2 === 0) { ctx.fillStyle = "rgba(255,255,255,0.03)"; ctx.fillRect(boardX + gx * cell, boardY + gy * cell, cell, cell); }
  }
  // Food (apple)
  const fx = boardX + food.x * cell + cell / 2, fy = boardY + food.y * cell + cell / 2;
  ctx.fillStyle = "#e8402f";
  ctx.beginPath(); ctx.arc(fx, fy + cell * 0.05, cell * 0.34, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#7a4a21"; ctx.lineWidth = Math.max(2, cell * 0.07);
  ctx.beginPath(); ctx.moveTo(fx, fy - cell * 0.22); ctx.quadraticCurveTo(fx + cell * 0.08, fy - cell * 0.42, fx + cell * 0.2, fy - cell * 0.44); ctx.stroke();
  ctx.fillStyle = "#57b84a";
  ctx.beginPath(); ctx.ellipse(fx + cell * 0.16, fy - cell * 0.3, cell * 0.16, cell * 0.08, -0.5, 0, Math.PI * 2); ctx.fill();
  // Snake
  for (let i = snake.length - 1; i >= 0; i--) {
    const s = snake[i];
    const t = snake.length <= 1 ? 1 : 1 - i / snake.length;
    ctx.fillStyle = i === 0 ? "#8be04e" : "rgb(" + Math.round(52 + 40 * t) + "," + Math.round(160 + 40 * t) + ",52)";
    rr(boardX + s.x * cell + 1.5, boardY + s.y * cell + 1.5, cell - 3, cell - 3, cell * 0.28); ctx.fill();
    if (i === 0) {
      ctx.fillStyle = "#0d2812";
      const ex = cell * 0.2, ey = cell * 0.2;
      const hx = boardX + s.x * cell + cell / 2, hy = boardY + s.y * cell + cell / 2;
      const px = dir.y !== 0 ? ex : 0, py = dir.x !== 0 ? ey : 0;
      ctx.beginPath();
      ctx.arc(hx - px + dir.x * 2, hy - py + dir.y * 2, Math.max(1.6, cell * 0.07), 0, Math.PI * 2);
      ctx.arc(hx + px + dir.x * 2, hy + py + dir.y * 2, Math.max(1.6, cell * 0.07), 0, Math.PI * 2);
      ctx.fill();
    }
  }
  // D-pad
  if (showPad && state === "play") {
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const drawBtn = (r, glyph) => {
      if (!r) return;
      ctx.fillStyle = "rgba(140,255,160,0.13)"; rr(r.x, r.y, r.w, r.h, 12); ctx.fill();
      ctx.strokeStyle = "rgba(140,255,160,0.4)"; ctx.lineWidth = 1.5; rr(r.x, r.y, r.w, r.h, 12); ctx.stroke();
      ctx.fillStyle = "#c9f5cf"; ctx.font = "bold " + Math.round(r.h * 0.42) + "px system-ui, sans-serif";
      ctx.fillText(glyph, r.x + r.w / 2, r.y + r.h / 2 + 1);
    };
    drawBtn(dpad.up, "▲"); drawBtn(dpad.down, "▼"); drawBtn(dpad.left, "◀"); drawBtn(dpad.right, "▶");
  }
  // Overlays
  if (state !== "play") {
    ctx.fillStyle = "rgba(4,16,7,0.78)"; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#8be04e";
    ctx.font = "bold " + Math.round(u * 11) + "px system-ui, sans-serif";
    ctx.fillText("SNAKE", W / 2, H * 0.30);
    ctx.fillStyle = "#eaffea";
    ctx.font = Math.round(u * 4.4) + "px system-ui, sans-serif";
    if (state === "menu") {
      ctx.fillText("Eat apples. Grow long. Don't crash.", W / 2, H * 0.42);
      ctx.fillStyle = "#ffb3a7";
      ctx.fillText("⚠ The walls are deadly — so is your own tail.", W / 2, H * 0.475);
      ctx.fillStyle = "#9fd8a8";
      ctx.fillText("Swipe, tap the arrows, or use arrow keys / WASD.", W / 2, H * 0.53);
      ctx.fillText("You speed up a little with every apple.", W / 2, H * 0.585);
    } else {
      ctx.fillText("Game over — score " + score, W / 2, H * 0.42);
      ctx.fillStyle = "#9fd8a8";
      ctx.fillText(score >= hi && score > 0 ? "New best!" : "Best " + hi, W / 2, H * 0.475);
    }
    ctx.fillStyle = "#8be04e";
    ctx.font = "bold " + Math.round(u * 5) + "px system-ui, sans-serif";
    ctx.fillText(state === "menu" ? "TAP TO START" : "TAP TO PLAY AGAIN", W / 2, H * 0.66);
  }
}

// ---------- Loop ----------
let lastT = 0;
function frame(t) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (t - lastT) / 1000 || 0); lastT = t;
  if (state === "play") {
    acc += dt * 1000;
    while (acc >= stepMs && state === "play") { acc -= stepMs; step(); }
  }
  draw();
}
resize();
reset();
requestAnimationFrame(frame);
</script>
</body>
</html>
