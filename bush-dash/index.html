<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Bush Dash — a tiny cat jumper</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background:
      radial-gradient(120% 90% at 50% 0%, #2b3f63 0%, rgba(43,63,99,0) 55%),
      linear-gradient(180deg, #131c2e 0%, #0b101c 60%, #070b13 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:"Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
    color:#eef3fa; overflow:hidden;
    -webkit-user-select:none; user-select:none;
    touch-action:manipulation;
  }
  h1 {
    font-size:clamp(22px,4.4vw,38px); letter-spacing:3px; margin-bottom:4px; font-weight:800;
    background:linear-gradient(180deg, #ffffff 20%, #bcd7f5 90%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 2px 10px rgba(80,140,220,.35));
  }
  h1 .accent {
    background:linear-gradient(180deg, #ffe3ae 10%, #ffb84d 55%, #f28c28 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  p.sub { color:#9fb0c6; font-size:clamp(12px,2vw,15px); margin-bottom:14px; letter-spacing:.4px; }
  #wrap { position:relative; width:min(96vw, 1060px); }
  canvas {
    width:100%; height:auto; display:block; border-radius:18px;
    box-shadow:0 24px 70px rgba(0,0,0,.6), 0 4px 18px rgba(0,0,0,.45),
               0 0 0 1px rgba(255,255,255,.09), inset 0 0 0 1px rgba(255,255,255,.05);
    background:#aee3f7; cursor:pointer;
  }
  #hint { margin-top:12px; color:#93a5bd; font-size:13px; text-align:center; }
  kbd { background:linear-gradient(180deg, #26334a, #1a2436); border:1px solid #3a4a66; border-bottom-width:3px; border-radius:6px;
        padding:1px 8px; font-family:inherit; font-size:12px; color:#e2ebf7;
        box-shadow:0 1px 3px rgba(0,0,0,.4); }
</style>
</head>
<body>
  <h1>BUSH <span class="accent">DASH</span></h1>
  <p class="sub">a tiny cat jumper &mdash; how far can you get?</p>
  <div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>
  <p id="hint"><kbd>Space</kbd> / <kbd>&uarr;</kbd> / tap to jump &nbsp;&middot;&nbsp; hold for higher &nbsp;&middot;&nbsp; <kbd>M</kbd> mute &nbsp;&middot;&nbsp; <kbd>R</kbd> restart</p>
<script>
"use strict";
/* ============================================================
   BUSH DASH — a tiny endless jumper.
   A cat dashes through the meadow and leaps over bushes.
   No dependencies. Tweak the CONFIG block to change the feel.
   ============================================================ */
const CONFIG = {
  gravity: 2900,        // px/s^2 pulling the cat down
  jumpV: 1000,          // initial jump velocity
  maxHold: 0.18,        // seconds of reduced gravity while holding for higher jumps
  holdGravity: 0.45,    // gravity multiplier while holding (lower = floatier)
  jumpCut: -520,        // upward velocity cap when released early (gentle cut)
  coyote: 0.09,         // grace time to still jump after leaving ground
  buffer: 0.12,         // jump presses remembered this long before landing
  startSpeed: 380,      // px/s at the start of a run
  // Progressive speed ramp (2026-11-15): world speed is a smooth function
  // of run time — mult(t) = 1 + rampA*t - rampB*t^2, hard-capped at
  // rampCap. 1.00x at 0s, ~1.25x at 20s, ~1.50x at 45s, 1.75x cap
  // (665 px/s) from ~84s on, flat after that. Identical for every runner.
  rampCap: 1.75,        // top speed multiplier
  rampA: 0.01361,       // linear term (per second)
  rampB: 0.0000556,     // quadratic term (per second^2) — eases the ramp off
  groundY: 452,
};

const cv = document.getElementById("game");
const ctx = cv.getContext("2d");
const W = cv.width, H = cv.height;
const demo = new URLSearchParams(location.search).has("demo");

// ---------- iOS audio routing ----------
// Web Audio defaults to the "ambient" channel, which the iPhone silent
// switch mutes entirely. Route it to the media/playback channel (iOS 17+
// Audio Session API) on the first user gesture and inside the synth.
function iosPlaybackSession() {
  try { if ('audioSession' in navigator) navigator.audioSession.type = 'playback'; } catch (e) {}
}
document.addEventListener('pointerdown', iosPlaybackSession, true);
// Sleep in the background (2026-11-09): the wrapper's pauseTimers stops
// JS timers, but the Web Audio graph is a separate engine — suspend the
// audio context whenever the page is hidden so nothing keeps the CPU
// (or the sound) running while the app is in the background.
document.addEventListener("visibilitychange", function () {
  try {
    var c = window.__maCtx;
    if (document.hidden) {
      window.__maHidden = true;
      if (c) {
        if (c.close) { try { var p = c.close(); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
        if (c.suspend && c.state === "running") { try { c.suspend(); } catch (e) {} }
        window.__maCtx = null;
      }
    } else {
      window.__maHidden = false;
      var ac = c || (window.__maActx && window.__maActx());
      if (ac && ac.state === "suspended" && ac.resume) { try { ac.resume(); } catch (e) {} }
    }
  } catch (e) {}
});

document.addEventListener('touchstart', iosPlaybackSession, true);

// ---------- tiny synth ----------
let AC = null, muted = false;
function beep(freq, dur, type, vol, slide) {
  if (muted) return;
  try {
    iosPlaybackSession();
    if (AC && AC.state === "closed") AC = null; AC = AC || new (window.AudioContext || window.webkitAudioContext)(); window.__maCtx = AC; window.__maActx = function () { return AC; };
    if (AC.state === "suspended") AC.resume();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || "sine"; o.frequency.setValueAtTime(freq, AC.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, AC.currentTime + dur);
    g.gain.setValueAtTime(vol || 0.12, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + dur);
  } catch (e) {}
}
const sfx = {
  jump:  () => beep(420, 0.14, "square", 0.06, 760),
  ding:  () => { beep(880, 0.09, "sine", 0.08); setTimeout(() => beep(1320, 0.12, "sine", 0.08), 90); },
  thud:  () => beep(160, 0.25, "sawtooth", 0.10, 60),
  start: () => beep(520, 0.10, "triangle", 0.08, 780),
  pick:  () => beep(660, 0.07, "triangle", 0.07, 920),
};

// ---------- guarded storage ----------
// Storage can be denied (preview panes, private-mode webviews) and a
// throwing read at startup would kill the whole script — every access
// goes through these helpers.
function storeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function storeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

// ---------- state ----------
let state = "menu";           // menu | play | dead
let t = 0, speed = CONFIG.startSpeed, dist = 0, score = 0;
let hi = +(storeGet("bushdash_hi") || 0);

// ---------- player character ----------
// Cat, dog, or squirrel: identical size, physics, and difficulty —
// only the sprite (and its picker name) differs.
const CHARACTERS = [
  { id: "cat", name: "Cat" },
  { id: "dog", name: "Dog" },
  { id: "squirrel", name: "Squirrel" },
];
let character = storeGet("bushdash_char") || "cat";
if (!CHARACTERS.some(c => c.id === character)) character = "cat";
function syncSub() {
  const sub = document.querySelector("p.sub");
  if (sub) sub.textContent = "a tiny " + character + " jumper — how far can you get?";
}
function selectChar(id) {
  if (!CHARACTERS.some(c => c.id === id)) return;
  character = id;
  storeSet("bushdash_char", id);
  syncSub();
  sfx.pick();
}
syncSub();
let lastMilestone = 0, flash = 0, shake = 0;
let deadT = 0;

const cat = {
  x: 150, y: CONFIG.groundY, vy: 0,
  w: 74, h: 58,
  onGround: true, coyote: 0, buffer: 0, holdT: 0,
  runPhase: 0, blink: 0, blinkT: 2 + Math.random() * 3,
  dead: false,
};

let bushes = [];      // {x, w, h, seed}
let clouds = [];
let tufts = [];       // grass tufts {x, s}
let puffs = [];       // landing dust {x,y,vx,vy,life}
let nextBushAt = 0;
// visual-only parallax scroll offsets (px) for the backdrop layers
let farOff = 0, midOff = 0, dustAcc = 0;

function reset() {
  state = "play"; t = 0; speed = CONFIG.startSpeed; dist = 0; score = 0;
  lastMilestone = 0; flash = 0; shake = 0; deadT = 0;
  Object.assign(cat, { y: CONFIG.groundY, vy: 0, onGround: true, coyote: 0, buffer: 0, holdT: 0, dead: false });
  bushes = []; puffs = [];
  nextBushAt = 700;
  initScenery();
  sfx.start();
}

function initScenery() {
  clouds = [];
  for (let i = 0; i < 6; i++) clouds.push({ x: Math.random() * W, y: 40 + Math.random() * 150, s: 0.6 + Math.random() * 0.9, v: 8 + Math.random() * 14 });
  tufts = [];
  for (let i = 0; i < 26; i++) tufts.push({ x: Math.random() * (W + 200) - 100, s: 0.7 + Math.random() * 0.7 });
}

// ---------- input ----------
let holding = false;
function pressJump() {
  if (state === "menu" || state === "dead") { if (state !== "menu" || true) reset(); return; }
  cat.buffer = CONFIG.buffer;
  holding = true;
}
function releaseJump() { holding = false; }

addEventListener("keydown", e => {
  if (e.repeat) return;
  if (state === "menu") {
    // character picker: arrows cycle, 1/2/3 pick directly
    const idx = CHARACTERS.findIndex(c => c.id === character);
    if (e.code === "ArrowLeft") { selectChar(CHARACTERS[(idx + CHARACTERS.length - 1) % CHARACTERS.length].id); return; }
    if (e.code === "ArrowRight") { selectChar(CHARACTERS[(idx + 1) % CHARACTERS.length].id); return; }
    if (e.code === "Digit1" || e.code === "Digit2" || e.code === "Digit3") { selectChar(CHARACTERS[+e.code.slice(-1) - 1].id); return; }
  }
  if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") { e.preventDefault(); pressJump(); }
  if (e.code === "KeyR" && state !== "menu") reset();
  if (e.code === "KeyM") muted = !muted;
  if (e.code === "Enter" && state !== "play") reset();
});
addEventListener("keyup", e => {
  if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") releaseJump();
});
// ---------- character picker (menu) ----------
// Canvas tap zones shared by the menu drawing and the hit test.
// Pointer coords are CSS pixels; convert through the canvas rect
// (rect-ratio conversion — correct at any device pixel ratio).
function toGame(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
}
const PICK = { w: 136, h: 120, gap: 16, y: 218 };
function pickBox(i) {
  const total = CHARACTERS.length * PICK.w + (CHARACTERS.length - 1) * PICK.gap;
  return { x: W / 2 - total / 2 + i * (PICK.w + PICK.gap), y: PICK.y, w: PICK.w, h: PICK.h };
}
function pickAt(x, y) {
  for (let i = 0; i < CHARACTERS.length; i++) {
    const b = pickBox(i);
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return CHARACTERS[i].id;
  }
  return null;
}

cv.addEventListener("pointerdown", e => {
  e.preventDefault();
  if (state === "menu") {
    const p = toGame(e);
    const id = pickAt(p.x, p.y);
    if (id) { selectChar(id); return; }  // choosing a runner doesn't start the run
  }
  pressJump();
});
addEventListener("pointerup", releaseJump);
addEventListener("blur", () => { holding = false; });

// ---------- spawning ----------
function spawnBush(x) {
  const r = Math.random();
  let w, h;
  if (r < 0.45)      { w = 34 + Math.random() * 22; h = 48 + Math.random() * 22; }  // small
  else if (r < 0.8)  { w = 52 + Math.random() * 26; h = 62 + Math.random() * 26; }  // medium
  else               { w = 76 + Math.random() * 30; h = 78 + Math.random() * 26; }  // big cluster
  // keep jumps fair at high speed: cap height
  h = Math.min(h, 96);
  bushes.push({ x, w, h, seed: Math.random() * 100 });
}

// World speed for a run that has lasted tt seconds: starts at
// CONFIG.startSpeed and climbs smoothly to startSpeed * rampCap.
// The quadratic peaks at rampA/(2*rampB) (~122s) and would turn back
// down after that, so freeze the input there: the multiplier must never
// decrease on a long run, or the game would get easier after ~2:40.
function speedAtTime(tt) {
  const tPeak = CONFIG.rampA / (2 * CONFIG.rampB);
  const te = Math.min(tt, tPeak);
  const m = 1 + CONFIG.rampA * te - CONFIG.rampB * te * te;
  return CONFIG.startSpeed * Math.min(CONFIG.rampCap, Math.max(1, m));
}

// ---------- update ----------
function update(dt) {
  t += dt;
  if (state !== "play") { updateScenery(dt, state === "menu" ? 120 : 0); return; }

  speed = speedAtTime(t);
  dist += speed * dt;
  score = Math.floor(dist / 12);

  if (score - lastMilestone >= 100) { lastMilestone = score - (score % 100); flash = 0.6; sfx.ding(); }

  // spawn bushes ahead
  nextBushAt -= speed * dt;
  if (nextBushAt <= 0) {
    spawnBush(W + 40);
    const gap = 260 + Math.random() * 320 + speed * 0.55;
    nextBushAt = gap;
  }
  for (const b of bushes) b.x -= speed * dt;
  bushes = bushes.filter(b => b.x + b.w > -60);

  // --- demo autopilot: jump when a bush is in range (direct, no input buffer) ---
  if (demo && state === "play" && cat.onGround) {
    for (const b of bushes) {
      const d = b.x - (cat.x + cat.w / 2);
      if (d > 0 && d / speed < 0.38) {
        cat.vy = -CONFIG.jumpV; cat.onGround = false; cat.holdT = 0;
        holding = true; sfx.jump();
        setTimeout(() => { holding = false; }, 400); // hold through the rise
        break;
      }
    }
  }
  if (demo && state === "dead" && deadT > 1.2) reset();

  // --- cat physics ---
  cat.coyote -= dt; cat.buffer -= dt; cat.blinkT -= dt;
  if (cat.blinkT <= 0) { cat.blink = 0.12; cat.blinkT = 2 + Math.random() * 4; }
  cat.blink -= dt;

  if (cat.onGround) {
    cat.coyote = CONFIG.coyote;
    if (cat.buffer > 0) {
      cat.vy = -CONFIG.jumpV; cat.onGround = false; cat.buffer = 0; cat.holdT = 0;
      sfx.jump();
      for (let i = 0; i < 6; i++) puffs.push({ x: cat.x + 10, y: CONFIG.groundY + 4, vx: -60 - Math.random() * 120, vy: -40 - Math.random() * 90, life: 0.5 });
    }
  } else {
    // variable jump height: holding gives reduced gravity (floatier rise);
    // releasing early applies a gentle cut for snappy short hops
    const boosted = holding && cat.holdT < CONFIG.maxHold && cat.vy < 0;
    if (holding && cat.vy < 0) cat.holdT += dt;
    if (!holding && cat.vy < CONFIG.jumpCut) cat.vy = CONFIG.jumpCut;
    cat.vy += (boosted ? CONFIG.gravity * CONFIG.holdGravity : CONFIG.gravity) * dt;
    cat.y += cat.vy * dt;
    if (cat.y >= CONFIG.groundY) {
      cat.y = CONFIG.groundY; cat.vy = 0; cat.onGround = true;
      for (let i = 0; i < 5; i++) puffs.push({ x: cat.x + 20, y: CONFIG.groundY + 4, vx: -40 - Math.random() * 100, vy: -30 - Math.random() * 70, life: 0.4 });
    }
  }
  if (cat.onGround) cat.runPhase += dt * (6 + speed / 90);

  // --- collisions (forgiving hitbox) ---
  const hx = cat.x + 12, hw = cat.w - 26, hy = cat.y - cat.h + 10, hh = cat.h - 14;
  for (const b of bushes) {
    const bx = b.x + 8, bw = b.w - 16, by = CONFIG.groundY - b.h + 12, bh = b.h - 12;
    if (hx < bx + bw && hx + hw > bx && hy < by + bh && hy + hh > by) {
      state = "dead"; deadT = 0; cat.dead = true; shake = 0.45; sfx.thud();
      if (score > hi) { hi = score; storeSet("bushdash_hi", hi); }
      for (let i = 0; i < 14; i++) puffs.push({ x: cat.x + 40, y: cat.y - 20, vx: -120 + Math.random() * 260, vy: -160 - Math.random() * 120, life: 0.7 });
      break;
    }
  }

  updateScenery(dt, speed);
  for (const p of puffs) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; p.life -= dt; }
  puffs = puffs.filter(p => p.life > 0);
  flash -= dt; shake -= dt;
}

function updateScenery(dt, spd) {
  for (const c of clouds) { c.x -= (c.v * 0.4 + spd * 0.06) * dt; if (c.x < -140) { c.x = W + 120; c.y = 40 + Math.random() * 150; } }
  for (const g of tufts) { g.x -= spd * dt; if (g.x < -30) { g.x = W + 20 + Math.random() * 80; g.s = 0.7 + Math.random() * 0.7; } }
  // parallax backdrop layers drift slower than the world (visual only)
  farOff = (farOff + spd * 0.10 * dt) % 520;
  midOff = (midOff + spd * 0.28 * dt) % 300;
  // a little dust kicked up while running on the ground (visual only)
  if (state === "play" && cat.onGround) {
    dustAcc += dt;
    if (dustAcc > 0.09) {
      dustAcc = 0;
      puffs.push({ x: cat.x + 6 + Math.random() * 14, y: CONFIG.groundY + 5, vx: -50 - Math.random() * 70, vy: -18 - Math.random() * 42, life: 0.38 });
    }
  } else dustAcc = 0;
}

// ---------- drawing ----------
function skyGradient() {
  // gentle day cycle as score climbs
  const p = (score % 1200) / 1200;
  const d = Math.sin(p * Math.PI * 2) * 0.5 + 0.5; // 0..1
  const mix = (a, b, k) => Math.round(a + (b - a) * k);
  // deep blue zenith -> soft mid blue -> warm bright horizon
  const top = [86, 156, 224], mid = [148, 205, 243], hor = [228, 246, 236];
  const warm = [250, 198, 132]; // horizon warms toward golden at cycle peak
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, `rgb(${mix(top[0], 122, d * 0.25)},${mix(top[1], 168, d * 0.25)},${mix(top[2], 226, d * 0.25)})`);
  g.addColorStop(0.45, `rgb(${mix(mid[0], 196, d * 0.2)},${mix(mid[1], 216, d * 0.2)},${mix(mid[2], 214, d * 0.2)})`);
  g.addColorStop(0.82, `rgb(${mix(hor[0], warm[0], d * 0.45)},${mix(hor[1], warm[1], d * 0.45)},${mix(hor[2], warm[2], d * 0.45)})`);
  g.addColorStop(0.821, "#8fce6e");
  g.addColorStop(1, "#79bd58");
  return g;
}

// soft sun with a halo, high in the sky; drifts a touch with the day cycle
function drawSun() {
  const p = (score % 1200) / 1200;
  const sx = W - 170, sy = 92 + Math.sin(p * Math.PI * 2) * 14;
  const halo = ctx.createRadialGradient(sx, sy, 8, sx, sy, 120);
  halo.addColorStop(0, "rgba(255,244,200,.85)");
  halo.addColorStop(0.35, "rgba(255,238,180,.35)");
  halo.addColorStop(1, "rgba(255,238,180,0)");
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(sx, sy, 120, 0, 7); ctx.fill();
  const core = ctx.createRadialGradient(sx - 8, sy - 8, 4, sx, sy, 40);
  core.addColorStop(0, "#fffbe8"); core.addColorStop(1, "#ffe9a8");
  ctx.fillStyle = core;
  ctx.beginPath(); ctx.arc(sx, sy, 38, 0, 7); ctx.fill();
}

// far rolling hills — slowest parallax layer, soft blue-green silhouettes
function drawFarHills() {
  ctx.fillStyle = "rgba(96,168,128,.50)";
  for (let x = -farOff - 520; x < W + 520; x += 520) {
    ctx.beginPath(); ctx.ellipse(x + 260, CONFIG.groundY + 26, 330, 118, 0, Math.PI, 0); ctx.fill();
  }
  ctx.fillStyle = "rgba(84,158,116,.55)";
  for (let x = -farOff * 1.0 - 260; x < W + 520; x += 520) {
    ctx.beginPath(); ctx.ellipse(x + 420, CONFIG.groundY + 22, 240, 78, 0, Math.PI, 0); ctx.fill();
  }
}

// mid-ground tree line — rounded canopies on the horizon, mid parallax
function drawTreeLine() {
  const base = CONFIG.groundY + 12;
  for (let x = -midOff - 300; x < W + 300; x += 300) {
    for (const tr of [[40, 46, 30], [118, 34, 22], [212, 52, 36], [268, 28, 18]]) {
      const tx = x + tr[0], th = tr[1], cr = tr[2];
      ctx.fillStyle = "#6d9c52";
      ctx.fillRect(tx - 3.5, base - th * 0.45, 7, th * 0.45);
      const grd = ctx.createRadialGradient(tx - cr * 0.3, base - th - cr * 0.3, cr * 0.25, tx, base - th, cr * 1.3);
      grd.addColorStop(0, "#79b264"); grd.addColorStop(1, "#4e8a44");
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(tx, base - th, cr, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(tx - cr * 0.75, base - th + cr * 0.35, cr * 0.62, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(tx + cr * 0.75, base - th + cr * 0.35, cr * 0.62, 0, 7); ctx.fill();
    }
  }
}

// vertical grass gradient with a soft contact shadow under the play line
function drawGround() {
  const g = ctx.createLinearGradient(0, CONFIG.groundY, 0, H);
  g.addColorStop(0, "#97d977");
  g.addColorStop(0.18, "#84c862");
  g.addColorStop(1, "#5da344");
  ctx.fillStyle = g;
  ctx.fillRect(0, CONFIG.groundY, W, H - CONFIG.groundY);
  // sunlit lip along the top edge, then a gentle shade beneath it
  ctx.fillStyle = "rgba(255,255,220,.35)";
  ctx.fillRect(0, CONFIG.groundY, W, 2.5);
  const shade = ctx.createLinearGradient(0, CONFIG.groundY, 0, CONFIG.groundY + 26);
  shade.addColorStop(0, "rgba(30,70,25,.20)"); shade.addColorStop(1, "rgba(30,70,25,0)");
  ctx.fillStyle = shade;
  ctx.fillRect(0, CONFIG.groundY, W, 26);
  // subtle mow stripes scrolling with the world for a sense of speed
  ctx.fillStyle = "rgba(255,255,255,.05)";
  const stripeW = 130, off = (dist * 1) % (stripeW * 2);
  for (let x = -off; x < W; x += stripeW * 2) ctx.fillRect(x, CONFIG.groundY, stripeW, H - CONFIG.groundY);
}

// small shared helpers for sprite shading
function shadeGrad(y0, y1, light, base, dark) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, light); g.addColorStop(0.55, base); g.addColorStop(1, dark);
  return g;
}
function headGrad(hx, hy, r, light, base) {
  const g = ctx.createRadialGradient(hx - r * 0.35, hy - r * 0.4, r * 0.2, hx, hy, r * 1.25);
  g.addColorStop(0, light); g.addColorStop(0.65, base); g.addColorStop(1, base);
  return g;
}

function drawCloud(c) {
  ctx.save(); ctx.translate(c.x, c.y); ctx.scale(c.s, c.s);
  const puffs = [[0, 0, 22], [24, -8, 26], [52, 0, 20], [26, 10, 24]];
  // soft shadowed underside
  ctx.fillStyle = "rgba(168,198,228,.55)";
  ctx.beginPath();
  for (const p of puffs) ctx.arc(p[0], p[1] + 7, p[2], 0, 7);
  ctx.fill();
  // bright body with a gentle top-light gradient
  const g = ctx.createLinearGradient(0, -36, 0, 22);
  g.addColorStop(0, "rgba(255,255,255,.98)"); g.addColorStop(1, "rgba(226,240,252,.92)");
  ctx.fillStyle = g;
  ctx.beginPath();
  for (const p of puffs) ctx.arc(p[0], p[1], p[2], 0, 7);
  ctx.fill(); ctx.restore();
}

function drawTuft(g) {
  const y = CONFIG.groundY + 26;
  ctx.lineWidth = 2.5; ctx.lineCap = "round";
  // darker back blades
  ctx.strokeStyle = "#4c8a3e";
  ctx.beginPath();
  ctx.moveTo(g.x, y); ctx.quadraticCurveTo(g.x - 6 * g.s, y - 14 * g.s, g.x - 9 * g.s, y - 18 * g.s);
  ctx.moveTo(g.x, y); ctx.quadraticCurveTo(g.x + 7 * g.s, y - 13 * g.s, g.x + 10 * g.s, y - 16 * g.s);
  ctx.stroke();
  // lit front blade
  ctx.strokeStyle = "#79c25e";
  ctx.beginPath();
  ctx.moveTo(g.x, y); ctx.quadraticCurveTo(g.x + 1 * g.s, y - 16 * g.s, g.x + 2 * g.s, y - 22 * g.s);
  ctx.stroke();
  // the occasional tiny wildflower (deterministic from the tuft's scale)
  if (g.s > 1.32) {
    ctx.fillStyle = "#ffd166";
    ctx.beginPath(); ctx.arc(g.x + 2 * g.s, y - 23 * g.s, 2.4, 0, 7); ctx.fill();
    ctx.fillStyle = "#fff3f8";
    ctx.beginPath(); ctx.arc(g.x + 2 * g.s, y - 23 * g.s, 1.1, 0, 7); ctx.fill();
  }
}

function drawBush(b) {
  const base = CONFIG.groundY + 4;
  ctx.save(); ctx.translate(b.x, base);
  // shadow
  ctx.fillStyle = "rgba(0,0,0,.10)";
  ctx.beginPath(); ctx.ellipse(b.w / 2, 4, b.w / 2, 7, 0, 0, 7); ctx.fill();
  // foliage blobs
  const n = Math.max(3, Math.round(b.w / 22));
  const blob = i => {
    const fx = (i + 0.5) * (b.w / n);
    const fh = b.h * (0.62 + 0.38 * Math.abs(Math.sin(b.seed + i * 2.1)));
    const fr = b.w / n * 0.72;
    return { fx, fh, fr };
  };
  // dark depth layer, peeking out below/behind the lit foliage
  ctx.fillStyle = "#22703a";
  for (let i = 0; i < n; i++) {
    const { fx, fh, fr } = blob(i);
    ctx.beginPath(); ctx.arc(fx, -fh + fr * 0.55 + fr * 0.34, fr * 1.06, 0, 7); ctx.fill();
  }
  for (let i = 0; i < n; i++) {
    const { fx, fh, fr } = blob(i);
    const grd = ctx.createRadialGradient(fx - fr * 0.3, -fh + fr * 0.3, fr * 0.2, fx, -fh + fr, fr * 1.25);
    grd.addColorStop(0, "#6cc47a"); grd.addColorStop(0.6, "#3fa457"); grd.addColorStop(1, "#2c8443");
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(fx, -fh + fr * 0.55, fr, 0, 7); ctx.fill();
    // sunlit leaf speckles on the upper-left of each blob
    ctx.fillStyle = "rgba(214,245,190,.5)";
    ctx.beginPath(); ctx.arc(fx - fr * 0.34, -fh + fr * 0.28, fr * 0.16, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(fx - fr * 0.05, -fh + fr * 0.05, fr * 0.10, 0, 7); ctx.fill();
  }
  // little berries/flowers
  ctx.fillStyle = "#ff8fa3";
  for (let i = 0; i < Math.round(b.w / 30); i++) {
    const fx = 10 + ((b.seed * 37 + i * 53) % (b.w - 16));
    const fy = -20 - ((b.seed * 91 + i * 29) % (b.h - 30));
    ctx.beginPath(); ctx.arc(fx, fy, 3.2, 0, 7); ctx.fill();
  }
  ctx.restore();
}

function drawCat() {
  ctx.save();
  ctx.translate(cat.x, cat.y);
  if (shake > 0) ctx.translate((Math.random() - 0.5) * 8 * shake, (Math.random() - 0.5) * 8 * shake);

  const ORANGE = "#f2a14e", DARK = "#d17f2e", CREAM = "#ffe8c9", LIGHT = "#ffc987";
  const running = cat.onGround && state === "play";
  const legSwing = running ? Math.sin(cat.runPhase * Math.PI * 2) * 9 : 0;
  const airTilt = !cat.onGround ? -0.10 : 0;
  ctx.rotate(cat.dead ? 0.35 : airTilt);

  // tail (wags)
  const wag = Math.sin(t * 7) * 8;
  ctx.strokeStyle = ORANGE; ctx.lineWidth = 11; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(-30, -38);
  ctx.quadraticCurveTo(-52, -52 + wag * 0.4, -58, -72 + wag);
  ctx.stroke();
  ctx.strokeStyle = DARK; ctx.lineWidth = 11;
  ctx.beginPath(); ctx.moveTo(-56, -66 + wag * 0.8); ctx.lineTo(-58, -72 + wag); ctx.stroke();

  // back legs / front legs
  ctx.fillStyle = ORANGE;
  const legH = cat.onGround ? 20 : 12;
  const tuck = cat.onGround ? 0 : 8;
  // far legs (darker)
  ctx.fillStyle = DARK;
  rrect(-24 + legSwing * 0.6, -legH, 13, legH - tuck, 6); ctx.fill();
  rrect(8 - legSwing * 0.6, -legH, 13, legH - tuck, 6); ctx.fill();
  // near legs
  ctx.fillStyle = ORANGE;
  rrect(-16 - legSwing * 0.6, -legH, 13, legH - tuck, 6); ctx.fill();
  rrect(16 + legSwing * 0.6, -legH, 13, legH - tuck, 6); ctx.fill();

  // body
  ctx.fillStyle = shadeGrad(-60, -16, LIGHT, ORANGE, DARK);
  ctx.beginPath(); ctx.ellipse(2, -38, 34, 21, 0, 0, 7); ctx.fill();
  // soft sheen along the back
  ctx.fillStyle = "rgba(255,255,255,.20)";
  ctx.beginPath(); ctx.ellipse(-2, -50, 22, 7, -0.15, 0, 7); ctx.fill();
  // stripes
  ctx.strokeStyle = DARK; ctx.lineWidth = 4; ctx.lineCap = "round";
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath(); ctx.moveTo(-6 + i * 14, -56); ctx.quadraticCurveTo(-4 + i * 14, -48, -6 + i * 14, -40); ctx.stroke();
  }
  // belly
  ctx.fillStyle = CREAM;
  ctx.beginPath(); ctx.ellipse(6, -28, 20, 9, 0, 0, 7); ctx.fill();

  // head
  const hx = 34, hy = -52;
  ctx.fillStyle = headGrad(hx, hy, 21, LIGHT, ORANGE);
  ctx.beginPath(); ctx.arc(hx, hy, 21, 0, 7); ctx.fill();
  ctx.fillStyle = ORANGE;
  // ears
  ctx.beginPath(); ctx.moveTo(hx - 16, hy - 12); ctx.lineTo(hx - 12, hy - 32); ctx.lineTo(hx - 2, hy - 16); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(hx + 6, hy - 16); ctx.lineTo(hx + 14, hy - 31); ctx.lineTo(hx + 18, hy - 11); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#f7c9d4";
  ctx.beginPath(); ctx.moveTo(hx - 13, hy - 16); ctx.lineTo(hx - 11, hy - 26); ctx.lineTo(hx - 5, hy - 17); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(hx + 9, hy - 18); ctx.lineTo(hx + 13, hy - 26); ctx.lineTo(hx + 15, hy - 15); ctx.closePath(); ctx.fill();
  // head stripes
  ctx.strokeStyle = DARK; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(hx - 4, hy - 21); ctx.lineTo(hx - 4, hy - 12); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(hx + 3, hy - 21); ctx.lineTo(hx + 3, hy - 12); ctx.stroke();
  // muzzle
  ctx.fillStyle = CREAM;
  ctx.beginPath(); ctx.ellipse(hx + 8, hy + 8, 11, 8, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "#e07a7a";
  ctx.beginPath(); ctx.moveTo(hx + 4, hy + 5); ctx.lineTo(hx + 12, hy + 5); ctx.lineTo(hx + 8, hy + 10); ctx.closePath(); ctx.fill();
  // eye
  if (cat.dead) {
    ctx.strokeStyle = "#3a2c1c"; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(hx + 2, hy - 6); ctx.lineTo(hx + 10, hy + 2); ctx.moveTo(hx + 10, hy - 6); ctx.lineTo(hx + 2, hy + 2); ctx.stroke();
  } else if (cat.blink > 0) {
    ctx.strokeStyle = "#3a2c1c"; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(hx + 1, hy - 2); ctx.lineTo(hx + 11, hy - 2); ctx.stroke();
  } else {
    ctx.fillStyle = "#2fbf71";
    ctx.beginPath(); ctx.arc(hx + 6, hy - 2, 5.5, 0, 7); ctx.fill();
    ctx.fillStyle = "#1d1d1d";
    ctx.beginPath(); ctx.ellipse(hx + 6, hy - 2, 2, 4.4, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.9)";
    ctx.beginPath(); ctx.arc(hx + 4.4, hy - 3.6, 1.6, 0, 7); ctx.fill();
  }
  // whiskers
  ctx.strokeStyle = "rgba(60,40,20,.55)"; ctx.lineWidth = 1.4;
  for (const s of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(hx + 12, hy + 6 + s * 3); ctx.lineTo(hx + 30, hy + 2 + s * 6); ctx.stroke();
  }
  ctx.restore();
}

function drawDog() {
  ctx.save();
  ctx.translate(cat.x, cat.y);
  if (shake > 0) ctx.translate((Math.random() - 0.5) * 8 * shake, (Math.random() - 0.5) * 8 * shake);

  const BODY = "#c98a4b", DARK = "#9c662f", CREAM = "#ffe9c9", LIGHT = "#e5b678";
  const running = cat.onGround && state === "play";
  const legSwing = running ? Math.sin(cat.runPhase * Math.PI * 2) * 9 : 0;
  const airTilt = !cat.onGround ? -0.10 : 0;
  ctx.rotate(cat.dead ? 0.35 : airTilt);

  // tail (short, curves up, wags fast)
  const wag = Math.sin(t * 11) * 7;
  ctx.strokeStyle = BODY; ctx.lineWidth = 10; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(-30, -42);
  ctx.quadraticCurveTo(-48, -50, -50, -66 + wag);
  ctx.stroke();

  // legs (same pattern and sizes as the cat)
  const legH = cat.onGround ? 20 : 12;
  const tuck = cat.onGround ? 0 : 8;
  ctx.fillStyle = DARK;
  rrect(-24 + legSwing * 0.6, -legH, 13, legH - tuck, 6); ctx.fill();
  rrect(8 - legSwing * 0.6, -legH, 13, legH - tuck, 6); ctx.fill();
  ctx.fillStyle = BODY;
  rrect(-16 - legSwing * 0.6, -legH, 13, legH - tuck, 6); ctx.fill();
  rrect(16 + legSwing * 0.6, -legH, 13, legH - tuck, 6); ctx.fill();

  // body
  ctx.fillStyle = shadeGrad(-60, -16, LIGHT, BODY, DARK);
  ctx.beginPath(); ctx.ellipse(2, -38, 34, 21, 0, 0, 7); ctx.fill();
  // soft sheen along the back
  ctx.fillStyle = "rgba(255,255,255,.18)";
  ctx.beginPath(); ctx.ellipse(-2, -50, 22, 7, -0.15, 0, 7); ctx.fill();
  // spot
  ctx.fillStyle = DARK;
  ctx.beginPath(); ctx.ellipse(-10, -44, 12, 9, -0.4, 0, 7); ctx.fill();
  // belly
  ctx.fillStyle = CREAM;
  ctx.beginPath(); ctx.ellipse(6, -28, 20, 9, 0, 0, 7); ctx.fill();

  // head
  const hx = 34, hy = -52;
  ctx.fillStyle = headGrad(hx, hy, 21, LIGHT, BODY);
  ctx.beginPath(); ctx.arc(hx, hy, 21, 0, 7); ctx.fill();
  // floppy ear (dark, hangs down the back of the head)
  ctx.fillStyle = DARK;
  ctx.save(); ctx.translate(hx - 10, hy - 8); ctx.rotate(0.25);
  ctx.beginPath(); ctx.ellipse(0, 8, 8, 17, 0, 0, 7); ctx.fill();
  ctx.restore();
  // muzzle
  ctx.fillStyle = CREAM;
  ctx.beginPath(); ctx.ellipse(hx + 11, hy + 7, 14, 9, 0, 0, 7); ctx.fill();
  // nose
  ctx.fillStyle = "#4a3220";
  ctx.beginPath(); ctx.ellipse(hx + 23, hy + 3, 5.5, 4.5, 0, 0, 7); ctx.fill();
  // tongue (panting happily; hidden when dead)
  if (!cat.dead) {
    ctx.fillStyle = "#f28ba8";
    rrect(hx + 13, hy + 11, 7, 9, 3.5); ctx.fill();
  }
  // eye
  if (cat.dead) {
    ctx.strokeStyle = "#3a2c1c"; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(hx + 1, hy - 8); ctx.lineTo(hx + 9, hy); ctx.moveTo(hx + 9, hy - 8); ctx.lineTo(hx + 1, hy); ctx.stroke();
  } else if (cat.blink > 0) {
    ctx.strokeStyle = "#3a2c1c"; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(hx, hy - 4); ctx.lineTo(hx + 10, hy - 4); ctx.stroke();
  } else {
    ctx.fillStyle = "#3a2c1c";
    ctx.beginPath(); ctx.arc(hx + 5, hy - 3, 5, 0, 7); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.9)";
    ctx.beginPath(); ctx.arc(hx + 3.4, hy - 4.6, 1.6, 0, 7); ctx.fill();
  }
  ctx.restore();
}

function drawSquirrel() {
  ctx.save();
  ctx.translate(cat.x, cat.y);
  if (shake > 0) ctx.translate((Math.random() - 0.5) * 8 * shake, (Math.random() - 0.5) * 8 * shake);

  const BODY = "#a3a8ad", DARK = "#7e858c", CREAM = "#f4efe6", LIGHT = "#ccd1d6";
  const running = cat.onGround && state === "play";
  const legSwing = running ? Math.sin(cat.runPhase * Math.PI * 2) * 9 : 0;
  const airTilt = !cat.onGround ? -0.10 : 0;
  ctx.rotate(cat.dead ? 0.35 : airTilt);

  // big bushy tail (layered strokes rising behind the body)
  const sway = Math.sin(t * 5) * 4;
  ctx.lineCap = "round";
  ctx.strokeStyle = DARK; ctx.lineWidth = 21;
  ctx.beginPath(); ctx.moveTo(-24, -24);
  ctx.bezierCurveTo(-46, -40, -54, -62, -40 + sway, -92);
  ctx.stroke();
  ctx.strokeStyle = BODY; ctx.lineWidth = 13;
  ctx.beginPath(); ctx.moveTo(-24, -24);
  ctx.bezierCurveTo(-44, -40, -50, -60, -38 + sway, -88);
  ctx.stroke();

  // legs (same pattern and sizes as the cat)
  const legH = cat.onGround ? 20 : 12;
  const tuck = cat.onGround ? 0 : 8;
  ctx.fillStyle = DARK;
  rrect(-24 + legSwing * 0.6, -legH, 13, legH - tuck, 6); ctx.fill();
  rrect(8 - legSwing * 0.6, -legH, 13, legH - tuck, 6); ctx.fill();
  ctx.fillStyle = BODY;
  rrect(-16 - legSwing * 0.6, -legH, 13, legH - tuck, 6); ctx.fill();
  rrect(16 + legSwing * 0.6, -legH, 13, legH - tuck, 6); ctx.fill();

  // body
  ctx.fillStyle = shadeGrad(-58, -16, LIGHT, BODY, DARK);
  ctx.beginPath(); ctx.ellipse(2, -37, 32, 20, 0, 0, 7); ctx.fill();
  // soft sheen along the back
  ctx.fillStyle = "rgba(255,255,255,.22)";
  ctx.beginPath(); ctx.ellipse(-2, -49, 20, 6.5, -0.15, 0, 7); ctx.fill();
  // belly
  ctx.fillStyle = CREAM;
  ctx.beginPath(); ctx.ellipse(6, -27, 19, 9, 0, 0, 7); ctx.fill();

  // head
  const hx = 34, hy = -50;
  ctx.fillStyle = headGrad(hx, hy, 20, LIGHT, BODY);
  ctx.beginPath(); ctx.arc(hx, hy, 20, 0, 7); ctx.fill();
  ctx.fillStyle = BODY;
  // small rounded ears
  ctx.beginPath(); ctx.moveTo(hx - 14, hy - 12); ctx.lineTo(hx - 10, hy - 27); ctx.lineTo(hx - 2, hy - 15); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(hx + 4, hy - 16); ctx.lineTo(hx + 11, hy - 28); ctx.lineTo(hx + 15, hy - 13); ctx.closePath(); ctx.fill();
  // cheek / muzzle
  ctx.fillStyle = CREAM;
  ctx.beginPath(); ctx.ellipse(hx + 8, hy + 7, 11, 8, 0, 0, 7); ctx.fill();
  // nose
  ctx.fillStyle = "#4a3a30";
  ctx.beginPath(); ctx.ellipse(hx + 17, hy + 3, 4, 3.2, 0, 0, 7); ctx.fill();
  // front tooth
  if (!cat.dead) {
    ctx.fillStyle = "#ffffff";
    rrect(hx + 11, hy + 10, 5, 6, 1.5); ctx.fill();
  }
  // eye (big and dark)
  if (cat.dead) {
    ctx.strokeStyle = "#3a3630"; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(hx + 1, hy - 9); ctx.lineTo(hx + 11, hy + 1); ctx.moveTo(hx + 11, hy - 9); ctx.lineTo(hx + 1, hy + 1); ctx.stroke();
  } else if (cat.blink > 0) {
    ctx.strokeStyle = "#3a3630"; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(hx, hy - 4); ctx.lineTo(hx + 12, hy - 4); ctx.stroke();
  } else {
    ctx.fillStyle = "#26221e";
    ctx.beginPath(); ctx.arc(hx + 6, hy - 3, 6, 0, 7); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.95)";
    ctx.beginPath(); ctx.arc(hx + 3.8, hy - 5.2, 2.2, 0, 7); ctx.fill();
  }
  ctx.restore();
}

// draw the currently selected character (in-game sprite)
function drawPlayer() {
  if (character === "dog") drawDog();
  else if (character === "squirrel") drawSquirrel();
  else drawCat();
}

// draw a character portrait for the menu picker, standing at (cx, feetY)
function drawPortrait(id, cx, feetY, s) {
  const savedChar = character, sx = cat.x, sy = cat.y, sd = cat.dead, sb = cat.blink;
  character = id; cat.x = 0; cat.y = 0; cat.dead = false; cat.blink = 0;
  ctx.save(); ctx.translate(cx, feetY); ctx.scale(s, s);
  drawPlayer();
  ctx.restore();
  character = savedChar; cat.x = sx; cat.y = sy; cat.dead = sd; cat.blink = sb;
}

// shared glass-panel look for the menu and game-over cards
function glassPanel(x, y, w, h, r) {
  ctx.save();
  ctx.shadowColor = "rgba(8,18,34,.45)"; ctx.shadowBlur = 34; ctx.shadowOffsetY = 12;
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, "rgba(26,38,58,.86)"); g.addColorStop(1, "rgba(13,20,33,.88)");
  ctx.fillStyle = g;
  rrect(x, y, w, h, r); ctx.fill();
  ctx.restore();
  ctx.lineWidth = 1.5; ctx.strokeStyle = "rgba(255,255,255,.16)";
  rrect(x, y, w, h, r); ctx.stroke();
  // top gloss line
  ctx.strokeStyle = "rgba(255,255,255,.10)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x + r, y + 1); ctx.lineTo(x + w - r, y + 1); ctx.stroke();
}

function drawMenu() {
  ctx.textAlign = "center";
  glassPanel(W / 2 - 300, 74, 600, 338, 22);
  const titleGrad = ctx.createLinearGradient(0, 92, 0, 142);
  titleGrad.addColorStop(0, "#ffffff"); titleGrad.addColorStop(0.55, "#ffe1ad"); titleGrad.addColorStop(1, "#ffb84d");
  ctx.fillStyle = titleGrad;
  ctx.font = "800 54px 'Avenir Next', 'Segoe UI', system-ui, sans-serif";
  ctx.fillText("BUSH DASH", W / 2, 138);
  ctx.font = "400 19px 'Avenir Next', 'Segoe UI', system-ui, sans-serif";
  ctx.fillStyle = "#cdd8e6";
  ctx.fillText("a tiny " + character + " jumper", W / 2, 170);
  ctx.font = "600 13px 'Avenir Next', 'Segoe UI', system-ui, sans-serif";
  ctx.fillStyle = "#8fa1b8";
  ctx.fillText("P I C K   Y O U R   R U N N E R", W / 2, 204);
  for (let i = 0; i < CHARACTERS.length; i++) {
    const b = pickBox(i), sel = CHARACTERS[i].id === character;
    ctx.save();
    if (sel) { ctx.shadowColor = "rgba(255,184,77,.55)"; ctx.shadowBlur = 18; }
    const bg = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
    if (sel) { bg.addColorStop(0, "rgba(255,196,96,.34)"); bg.addColorStop(1, "rgba(255,160,60,.16)"); }
    else { bg.addColorStop(0, "rgba(255,255,255,.11)"); bg.addColorStop(1, "rgba(255,255,255,.045)"); }
    ctx.fillStyle = bg;
    rrect(b.x, b.y, b.w, b.h, 16); ctx.fill();
    ctx.restore();
    ctx.lineWidth = sel ? 3 : 1.5;
    ctx.strokeStyle = sel ? "#ffb84d" : "rgba(255,255,255,.26)";
    rrect(b.x, b.y, b.w, b.h, 16); ctx.stroke();
    drawPortrait(CHARACTERS[i].id, b.x + b.w / 2, b.y + b.h - 30, 0.8);
    ctx.fillStyle = sel ? "#ffd9a0" : "#cdd8e6";
    ctx.font = (sel ? "700 " : "600 ") + "17px 'Avenir Next', 'Segoe UI', system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(CHARACTERS[i].name, b.x + b.w / 2, b.y + b.h - 7);
  }
  ctx.font = "600 16px 'Avenir Next', 'Segoe UI', system-ui, sans-serif";
  ctx.fillStyle = "#8fa1b8";
  ctx.fillText("tap a runner to choose · SPACE / tap to start", W / 2, 382);
}

function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawPuffs() {
  for (const p of puffs) {
    ctx.fillStyle = `rgba(243,234,214,${Math.max(0, p.life * 1.3)})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, 3 + (0.7 - p.life) * 10, 0, 7); ctx.fill();
  }
}

// soft contact shadow under the runner; shrinks and fades with jump height
function drawPlayerShadow() {
  const h = Math.max(0, CONFIG.groundY - cat.y);
  const k = Math.max(0.42, 1 - h / 620);
  ctx.fillStyle = `rgba(23,52,20,${0.26 * k})`;
  ctx.beginPath();
  ctx.ellipse(cat.x + 4, CONFIG.groundY + 9, 40 * k, 7.5 * k, 0, 0, 7);
  ctx.fill();
}

function drawHUD() {
  // frosted score pill, top-right
  ctx.save();
  ctx.shadowColor = "rgba(10,30,50,.28)"; ctx.shadowBlur = 12; ctx.shadowOffsetY = 3;
  ctx.fillStyle = "rgba(16,30,48,.42)";
  rrect(W - 178, 14, 156, 62, 16); ctx.fill();
  ctx.restore();
  ctx.lineWidth = 1; ctx.strokeStyle = "rgba(255,255,255,.35)";
  rrect(W - 178, 14, 156, 62, 16); ctx.stroke();
  ctx.fillStyle = "#ffffff"; ctx.textAlign = "right";
  ctx.font = "700 26px 'Avenir Next', 'Segoe UI', system-ui, sans-serif";
  ctx.fillText(String(score).padStart(5, "0"), W - 36, 46);
  ctx.font = "600 13px 'Avenir Next', 'Segoe UI', system-ui, sans-serif";
  ctx.fillStyle = "rgba(255,255,255,.75)";
  ctx.fillText("HI " + String(Math.max(hi, score)).padStart(5, "0"), W - 36, 67);
  if (muted) {
    ctx.fillStyle = "rgba(16,30,48,.42)";
    rrect(22, 14, 118, 34, 12); ctx.fill();
    ctx.fillStyle = "#ffffff"; ctx.textAlign = "left";
    ctx.font = "600 14px 'Avenir Next', 'Segoe UI', system-ui, sans-serif";
    ctx.fillText("muted (M)", 36, 37);
  }
  if (flash > 0) {
    ctx.fillStyle = `rgba(255,255,255,${flash})`;
    ctx.fillRect(0, 0, W, H);
  }
}

function centerText(main, sub, mainSize) {
  ctx.textAlign = "center";
  const w = 460, h = sub ? 190 : 110;
  glassPanel(W / 2 - w / 2, H / 2 - h / 2 - 30, w, h, 22);
  const titleGrad = ctx.createLinearGradient(0, H / 2 - 62, 0, H / 2 - 6);
  titleGrad.addColorStop(0, "#ffffff"); titleGrad.addColorStop(1, "#ffc9c9");
  ctx.fillStyle = titleGrad;
  ctx.font = `800 ${mainSize || 44}px 'Avenir Next', 'Segoe UI', system-ui, sans-serif`;
  ctx.fillText(main, W / 2, H / 2 - (sub ? 18 : 2));
  if (sub) {
    ctx.font = "400 19px 'Avenir Next', 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = "#e6edf6";
    ctx.fillText(sub, W / 2, H / 2 + 28);
    ctx.font = "600 16px 'Avenir Next', 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = "#8fa1b8";
    ctx.fillText("SPACE / tap to start", W / 2, H / 2 + 58);
  }
}

function draw() {
  ctx.save();
  ctx.fillStyle = skyGradient();
  ctx.fillRect(0, 0, W, H);
  drawSun();
  drawFarHills();
  for (const c of clouds) drawCloud(c);
  drawGround();
  drawTreeLine();
  for (const g of tufts) drawTuft(g);
  // bushes
  const sorted = [...bushes].sort((a, b) => a.x - b.x);
  for (const b of sorted) drawBush(b);
  drawPlayerShadow();
  drawPuffs();
  drawPlayer();
  // gentle vignette for depth (scene only, under the UI)
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, H * 0.95);
  vg.addColorStop(0, "rgba(10,25,45,0)"); vg.addColorStop(1, "rgba(10,25,45,.14)");
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
  drawHUD();
  if (state === "menu") {
    drawMenu();
  } else if (state === "dead") {
    deadT += 1 / 60;
    if (deadT > 0.5) {
      const isHi = score >= hi && score > 0;
      centerText("GAME OVER", `score ${score}` + (isHi ? "  ·  new best!" : `  ·  best ${hi}`), 44);
    }
  }
  ctx.restore();
}

// ---------- main loop (fixed timestep) ----------
let last = performance.now(), acc = 0;
const STEP = 1 / 120;
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.25) dt = 0.25;
  acc += dt;
  while (acc >= STEP) { update(STEP); acc -= STEP; }
  draw();
  requestAnimationFrame(frame);
}
initScenery();
if (demo) { state = "menu"; setTimeout(() => { if (state === "menu") reset(); }, 600); }
// hook for automated capture / debugging
window.__bushdash = {
  get state() { return state; }, get score() { return score; },
  get speed() { return speed; }, get t() { return t; },
  cat, get bushes() { return bushes; },
  get character() { return character; },
  characters: CHARACTERS.map(c => c.id),
  pickBox: i => pickBox(i),
  size: { W, H },
};
requestAnimationFrame(frame);
</script>
</body>
</html>
