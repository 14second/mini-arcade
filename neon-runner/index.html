<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#12002b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Neon Runner</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:#12002b;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    touch-action:none; user-select:none; -webkit-user-select:none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas {
    position:fixed; inset:0; display:block;
    touch-action:none; user-select:none; -webkit-user-select:none;
  }
  #muteBtn {
    position:fixed; top:10px; right:10px; z-index:10;
    width:48px; height:48px; border-radius:12px;
    border:2px solid rgba(0,255,255,.55); background:rgba(10,0,30,.62);
    color:#fff; font-size:22px; line-height:1; cursor:pointer;
    touch-action:none; user-select:none; -webkit-user-select:none;
    display:flex; align-items:center; justify-content:center; padding:0;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="muteBtn" aria-label="Toggle sound">🔊</button>
<script>
// iOS audio routing: Web Audio defaults to the "ambient" channel, which the
// iPhone silent switch mutes entirely. Route it to the media/playback
// channel (iOS 17+ Audio Session API) on the first user gesture and inside
// audio init, so game music/SFX play even with silent mode on.
function iosPlaybackSession() {
  try { if ('audioSession' in navigator) navigator.audioSession.type = 'playback'; } catch (e) {}
}
document.addEventListener('pointerdown', iosPlaybackSession, true);
// Sleep in the background (2026-11-09): the wrapper's pauseTimers stops
// JS timers, but the Web Audio graph is a separate engine — suspend the
// audio context whenever the page is hidden so nothing keeps the CPU
// (or the sound) running while the app is in the background.
document.addEventListener("visibilitychange", function () {
  try {
    if (document.hidden) { if (window.__maCtx && window.__maCtx.suspend) window.__maCtx.suspend(); }
    else if (window.__maCtx && window.__maCtx.state === "suspended" && window.__maCtx.resume) window.__maCtx.resume();
  } catch (e) {}
});

document.addEventListener('touchstart', iosPlaybackSession, true);

"use strict";
/* ============================================================
   NEON RUNNER — a cyberpunk endless runner (single file, no deps)
   Rider on a glowing one-wheel cycle. Jump bots, duck drones,
   clear gaps, blast anything in your way.
   ============================================================ */

// ---------- Canvas / sizing ----------
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1;
let u = 4;              // scale unit = min(W,H)/100
let groundY = 0;        // y of the road surface (CSS px)

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  u = Math.min(W, H) / 100;
  // Ground at ~78% of H in portrait. In short landscape screens that
  // would leave too little sky, so clamp it sensibly there too.
  groundY = Math.round(H * 0.78);
  layoutButtons();
}
window.addEventListener("resize", resize);

// ---------- Helpers ----------
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function rand(a, b) { return a + Math.random() * (b - a); }
function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function shrinkBox(b, f) { // f = total shrink fraction (0.2 = 20%)
  const dx = b.w * f / 2, dy = b.h * f / 2;
  return { x: b.x + dx, y: b.y + dy, w: b.w - dx * 2, h: b.h - dy * 2 };
}
function aabb(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function hit(a, b) { return aabb(shrinkBox(a, 0.2), shrinkBox(b, 0.2)); }

// ---------- Audio (Web Audio synth only, no files) ----------
let actx = null;
let muted = false;
const muteBtn = document.getElementById("muteBtn");

function initAudio() {
  iosPlaybackSession();
  if (!actx) {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) actx = new AC(); window.__maCtx = actx;;
    } catch (e) { actx = null; }
    if (actx) startMusicScheduler();
  }
  if (actx && actx.state === "suspended") actx.resume();
}

function beep(freq, dur, type, vol, slide) {
  if (!actx || muted) return;
  const t = actx.currentTime;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type || "square";
  o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t + dur);
  g.gain.setValueAtTime(vol || 0.08, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
// Noise-ish burst (short buffer of white noise through a falling gain).
function noiseBurst(dur, vol) {
  if (!actx || muted) return;
  const t = actx.currentTime;
  const len = Math.max(1, Math.floor(actx.sampleRate * dur));
  const buf = actx.createBuffer(1, len, actx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = actx.createBufferSource(); src.buffer = buf;
  const g = actx.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  const f = actx.createBiquadFilter(); f.type = "lowpass";
  f.frequency.setValueAtTime(3200, t);
  f.frequency.exponentialRampToValueAtTime(180, t + dur);
  src.connect(f); f.connect(g); g.connect(actx.destination);
  src.start(t);
}

function sfxJump()      { beep(280, 0.18, "square",   0.055, 720); }
function sfxShoot()     { beep(1150, 0.13, "sawtooth", 0.05, 180); }
function sfxDuck()      { beep(520, 0.11, "triangle", 0.05, 190); }
function sfxExplosion() { beep(220, 0.28, "sawtooth", 0.07, 42); noiseBurst(0.22, 0.06); }
function sfxCrash()     { beep(160, 0.5, "sawtooth", 0.10, 30); noiseBurst(0.45, 0.11); beep(70, 0.55, "square", 0.08, 26); }

// ---------- Music: synthwave lookahead step-sequencer ----------
// BPM ~112, A minor. 8th-note steps, 32 steps = 4 bars.
const BPM = 112;
const STEP_DUR = 60 / BPM / 2; // one 8th note
// MIDI: A1=33 A2=45 C3=48 D3=50 E2=40 F2=41 G2=43 ...
const BASS = [
  33, 0,33, 0, 45, 0,33, 0,   // Am
  41, 0,41, 0, 45, 0,41, 0,   // F
  36, 0,36, 0, 48, 0,36, 0,   // C (C2=36)
  43, 0,43, 0, 50, 0,43, 0    // G
];
const LEAD = [
  69, 0, 0,72, 0,76, 0, 0,    // A4 C5 E5
   0, 0,69, 0, 0, 0,65, 0,    // A4 F4
  64, 0, 0,67, 0,72, 0, 0,    // E4 G4 C5
   0,74, 0, 0,71, 0, 0, 0     // D5 B4
];
// Pad chords (MIDI triads), one per bar: Am, F, C, G
const PADS = [
  [57, 60, 64],
  [53, 57, 60],
  [48, 52, 55],
  [55, 59, 62]
];
let musicStep = 0;
let nextNoteTime = 0;
let musicTimer = null;

function midiFreq(m) { return 440 * Math.pow(2, (m - 69) / 12); }

function toneAt(midi, when, dur, type, vol) {
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(midiFreq(midi), when);
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(vol, when + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(when); o.stop(when + dur + 0.03);
}

function scheduleStep(step, when) {
  if (muted) return;
  const b = BASS[step % BASS.length];
  if (b) toneAt(b, when, STEP_DUR * 0.92, "sawtooth", 0.05);       // bass 0.05
  const l = LEAD[step % LEAD.length];
  if (l) toneAt(l, when, STEP_DUR * 0.85, "square", 0.035);        // lead 0.035
  if (step % 8 === 0) { // soft pad, one long chord per bar
    const chord = PADS[Math.floor(step / 8) % PADS.length];
    for (let i = 0; i < chord.length; i++) {
      toneAt(chord[i], when, STEP_DUR * 8 * 0.98, "triangle", 0.016);
    }
  }
}

function startMusicScheduler() {
  if (musicTimer !== null || !actx) return;
  musicStep = 0;
  nextNoteTime = actx.currentTime + 0.06;
  musicTimer = setInterval(function () {
    if (!actx) return;
    if (nextNoteTime < actx.currentTime) { // resync after a stall / unmute
      nextNoteTime = actx.currentTime + 0.05;
    }
    while (nextNoteTime < actx.currentTime + 0.12) { // schedule ~0.12s ahead
      scheduleStep(musicStep, nextNoteTime);
      nextNoteTime += STEP_DUR;
      musicStep = (musicStep + 1) % 32;
    }
  }, 25);
}

function setMuted(m) {
  muted = m;
  muteBtn.textContent = muted ? "🔇" : "🔊";
}
// The mute button must NOT start the game: stop the event reaching the canvas.
muteBtn.addEventListener("pointerdown", function (e) {
  e.stopPropagation();
  e.preventDefault();
  initAudio(); // allowed: toggling sound is itself a user gesture
  setMuted(!muted);
});
muteBtn.addEventListener("click", function (e) { e.stopPropagation(); e.preventDefault(); });

// ---------- Game state ----------
let state = "menu"; // "menu" | "play" | "over"
let hi = 0;
try { hi = parseInt(localStorage.getItem("neonrunner_hi") || "0", 10) || 0; } catch (e) { hi = 0; }
let newBest = false;

let distancePx = 0;   // scrolled distance
let bonus = 0;        // points from destroyed enemies
let speed = 0;        // current world speed px/s
let scroll = 0;       // total scroll for parallax
let shake = 0;
let elapsed = 0;
let shootCd = 0;
let spawnTimer = 0;

// Player
const player = {
  x: 0,          // fixed-ish: ~22% of W (set each frame)
  py: 0,         // bottom of wheel (feet), rests on groundY
  vy: 0,
  grounded: true,
  coyote: 0,
  duckHeld: false,
  duckTimer: 0,
  wheelSpin: 0
};
function scaleF() { return u / 3.9; } // ~1 on a 390px-wide phone
function standH() { return u * 16; }
function duckH()  { return u * 9.5; }
function playerH() { return (player.duckHeld || player.duckTimer > 0) && player.grounded ? duckH() : standH(); }
function playerBox() {
  const w = u * 7.5, h = playerH();
  return { x: player.x - w / 2, y: player.py - h, w: w, h: h };
}

let obstacles = []; // {type:'bot'|'drone'|'gap', x, w, ...}
let bullets = [];   // {x, y}
let particles = []; // {x,y,vx,vy,life,max,color,size}

function getScore() { return Math.floor(distancePx / 50) + bonus; }

function resetWorld() {
  distancePx = 0; bonus = 0; elapsed = 0;
  speed = 300 * clamp(W / 390, 0.7, 1.6);
  scroll = 0; shake = 0; shootCd = 0;
  obstacles = []; bullets = []; particles = [];
  spawnTimer = 1.1; // first hazard arrives with a little breathing room
  player.py = groundY; player.vy = 0; player.grounded = true;
  player.coyote = 0; player.duckHeld = false; player.duckTimer = 0;
  newBest = false;
}

function startGame() {
  resetWorld();
  state = "play";
}
function gameOver() {
  state = "over";
  shake = 14;
  sfxCrash();
  const s = getScore();
  if (s > hi) {
    hi = s; newBest = true;
    try { localStorage.setItem("neonrunner_hi", String(hi)); } catch (e) {}
  }
}

// ---------- Actions ----------
function doJump() {
  if (state !== "play") return;
  if (player.grounded || player.coyote > 0) {
    player.vy = -1020 * scaleF();
    player.grounded = false;
    player.coyote = 0;
    player.duckTimer = 0;
    sfxJump();
  }
}
function doDuck(timed) {
  if (state !== "play") return;
  if (!player.grounded) { // slam down fast when ducking mid-air
    player.vy = Math.max(player.vy, 900 * scaleF());
    return;
  }
  if (timed) {
    if (player.duckTimer <= 0) sfxDuck();
    player.duckTimer = 0.45;
  }
}
function doShoot() {
  if (state !== "play" || shootCd > 0) return;
  shootCd = 0.22;
  const h = playerH();
  bullets.push({ x: player.x + u * 5, y: player.py - h * 0.58 });
  sfxShoot();
}
function explode(x, y, color) {
  for (let i = 0; i < 16; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = rand(40, 260) * scaleF();
    particles.push({
      x: x, y: y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60 * scaleF(),
      life: 0, max: rand(0.3, 0.65),
      color: color, size: rand(1.5, 3.6) * scaleF()
    });
  }
}

// ---------- Spawning ----------
function spawnObstacle() {
  const r = Math.random();
  const x = W + u * 8;
  if (r < 0.45) {
    obstacles.push({ type: "bot", x: x, w: u * 8, h: u * 10, hp: 1 });
  } else if (r < 0.80) {
    // Drone: occupies groundY-15u .. groundY-11u — over a ducking rider,
    // straight through a standing one.
    obstacles.push({ type: "drone", x: x, w: u * 9.5, h: u * 4.2, hp: 1, bob: Math.random() * Math.PI * 2 });
  } else {
    // Ground gap: must be jumped. Wide enough to matter, clearable at speed.
    obstacles.push({ type: "gap", x: x, w: u * rand(20, 26) });
  }
}
function overGap() {
  for (let i = 0; i < obstacles.length; i++) {
    const o = obstacles[i];
    if (o.type === "gap" && player.x > o.x + 3 && player.x < o.x + o.w - 3) return true;
  }
  return false;
}

// ---------- Update ----------
function update(dt) {
  // Particles always drift (menu sparkle / game-over debris).
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life += dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 700 * scaleF() * dt;
    if (p.life >= p.max) particles.splice(i, 1);
  }
  if (shake > 0) shake = Math.max(0, shake - dt * 30);

  if (state !== "play") return;

  elapsed += dt;
  // Speed ramp: +6 px/s per second, capped ~640 (scaled to screen width).
  const maxSpeed = 640 * clamp(W / 390, 0.7, 1.6);
  speed = Math.min(maxSpeed, speed + 6 * dt);
  distancePx += speed * dt;
  scroll += speed * dt;
  if (shootCd > 0) shootCd -= dt;
  player.wheelSpin += (speed * dt) / Math.max(1, u * 4.2);

  // --- Spawning: interval shrinks as speed ramps ---
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnObstacle();
    const base = clamp(1.55 - (speed - 300) / 340 * 0.65, 0.85, 1.55); // 1.55s -> 0.85s
    spawnTimer = base * rand(0.85, 1.3) * (390 / clamp(W, 300, 620));
    // The gap itself needs travel time too; give a touch more room after a gap.
    const last = obstacles[obstacles.length - 1];
    if (last && last.type === "gap") spawnTimer += last.w / speed * 0.35;
  }

  // --- Player physics ---
  if (player.duckTimer > 0) player.duckTimer -= dt;
  if (player.grounded) {
    player.coyote = 0.08;
    if (overGap()) player.grounded = false; // rode off the edge
  } else {
    if (player.coyote > 0) player.coyote -= dt;
    player.vy += 2600 * scaleF() * dt;
    player.py += player.vy * dt;
    if (player.vy >= 0 && player.py >= groundY) {
      if (overGap()) {
        // Still over the pit — keep falling.
        if (player.py > groundY + u * 24) { gameOver(); return; }
      } else {
        player.py = groundY; player.vy = 0; player.grounded = true;
      }
    }
    if (player.py > H + u * 10) { gameOver(); return; } // fell into a gap
  }

  // --- Move world ---
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    o.x -= speed * dt;
    if (o.type === "drone") o.bob += dt * 6;
    if (o.x + (o.w || 0) < -u * 6) obstacles.splice(i, 1);
  }
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += 950 * scaleF() * dt;
    if (b.x > W + 30) bullets.splice(i, 1);
  }

  // --- Bullets vs enemies ---
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    const bb = { x: b.x - 3, y: b.y - 3, w: 6, h: 6 };
    let consumed = false;
    for (let j = obstacles.length - 1; j >= 0; j--) {
      const o = obstacles[j];
      if (o.type === "gap") continue;
      if (aabb(bb, obstacleBox(o))) {
        o.hp -= 1;
        consumed = true;
        if (o.hp <= 0) {
          const ob = obstacleBox(o);
          explode(ob.x + ob.w / 2, ob.y + ob.h / 2, o.type === "bot" ? "#ff9f1c" : "#ff2e88");
          sfxExplosion();
          bonus += 25;
          obstacles.splice(j, 1);
        }
        break;
      }
    }
    if (consumed) bullets.splice(i, 1);
  }

  // --- Player vs hazards ---
  const pb = playerBox();
  for (let i = 0; i < obstacles.length; i++) {
    const o = obstacles[i];
    if (o.type === "gap") continue; // gaps kill by falling, handled above
    if (hit(pb, obstacleBox(o))) { gameOver(); return; }
  }
}

function obstacleBox(o) {
  if (o.type === "bot")   return { x: o.x, y: groundY - o.h, w: o.w, h: o.h };
  if (o.type === "drone") return { x: o.x, y: groundY - u * 15 + Math.sin(o.bob) * u * 0.35, w: o.w, h: o.h };
  return { x: o.x, y: groundY, w: o.w, h: 0 };
}

// ---------- Touch buttons (canvas-drawn, play state only) ----------
const btnDuck = { x: 0, y: 0, w: 0, h: 0, label: "▼ DUCK" };
const btnJump = { x: 0, y: 0, w: 0, h: 0, label: "▲ JUMP" };
const btnFire = { x: 0, y: 0, w: 0, h: 0, label: "● FIRE" };
const allBtns = [btnDuck, btnJump, btnFire];
function layoutButtons() {
  const bw = clamp(W * 0.27, 74, 132);
  const bh = clamp(H * 0.075, 46, 64);
  const y = H - bh - Math.max(8, H * 0.015);
  const gap = (W - bw * 3) / 4;
  btnDuck.x = gap;             btnDuck.y = y; btnDuck.w = bw; btnDuck.h = bh;
  btnJump.x = gap * 2 + bw;    btnJump.y = y; btnJump.w = bw; btnJump.h = bh;
  btnFire.x = gap * 3 + bw * 2; btnFire.y = y; btnFire.w = bw; btnFire.h = bh;
}
function btnAt(x, y) {
  for (let i = 0; i < allBtns.length; i++) {
    const b = allBtns[i];
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b;
  }
  return null;
}

// ---------- Input ----------
let duckPointerId = null;

canvas.addEventListener("pointerdown", function (e) {
  e.preventDefault();
  initAudio();
  const x = e.clientX, y = e.clientY;
  if (state !== "play") { startGame(); return; }
  const b = btnAt(x, y);
  if (b === btnJump) { doJump(); return; }
  if (b === btnFire) { doShoot(); return; }
  if (b === btnDuck) {
    player.duckHeld = true; duckPointerId = e.pointerId; doDuck(false); sfxDuck(); return;
  }
  // Free-area taps: upper = jump, lower = duck-slide.
  if (y < H * 0.55) doJump();
  else doDuck(true);
});
function releasePointer(e) {
  if (e.pointerId === duckPointerId) { player.duckHeld = false; duckPointerId = null; }
}
canvas.addEventListener("pointerup", releasePointer);
canvas.addEventListener("pointercancel", releasePointer);
canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });

window.addEventListener("keydown", function (e) {
  const code = e.code;
  if (code === "Space" || code === "ArrowUp" || code === "ArrowDown") e.preventDefault();
  initAudio();
  if (code === "KeyM") { setMuted(!muted); return; }
  if (state !== "play") {
    if (code === "Space" || code === "Enter" || code === "KeyR" || code === "ArrowUp" || code === "KeyW") {
      startGame();
    }
    return;
  }
  if (code === "Space" || code === "ArrowUp" || code === "KeyW") doJump();
  else if (code === "ArrowDown" || code === "KeyS") {
    if (!player.duckHeld && player.grounded) sfxDuck();
    player.duckHeld = true;
    if (!player.grounded) doDuck(false);
  }
  else if (code === "KeyF" || code === "KeyJ" || code === "KeyX") doShoot();
  else if (code === "KeyR") startGame();
});
window.addEventListener("keyup", function (e) {
  if (e.code === "ArrowDown" || e.code === "KeyS") player.duckHeld = false;
});

// ---------- Drawing ----------
let stars = [];
function buildStars() {
  stars = [];
  for (let i = 0; i < 90; i++) {
    stars.push({ x: Math.random(), y: Math.random() * 0.6, r: rand(0.6, 1.8), tw: rand(0, 6.28) });
  }
}
buildStars();

function drawBackground(t) {
  // Sky: deep purple -> magenta horizon
  const sky = ctx.createLinearGradient(0, 0, 0, groundY);
  sky.addColorStop(0, "#0b0033");
  sky.addColorStop(0.45, "#2b0650");
  sky.addColorStop(0.8, "#6d1160");
  sky.addColorStop(1, "#c2185b");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, groundY + 2);

  // Stars
  ctx.fillStyle = "#ffffff";
  for (let i = 0; i < stars.length; i++) {
    const s = stars[i];
    ctx.globalAlpha = 0.35 + 0.35 * (0.5 + 0.5 * Math.sin(t * 1.7 + s.tw));
    ctx.fillRect(s.x * W, s.y * groundY, s.r, s.r);
  }
  ctx.globalAlpha = 1;

  // Sun: striped synthwave disc on the horizon
  const sunR = u * 13;
  const sunX = W * 0.72, sunY = groundY - sunR * 0.55;
  ctx.save();
  ctx.beginPath(); ctx.arc(sunX, sunY, sunR, 0, Math.PI * 2); ctx.clip();
  const sg = ctx.createLinearGradient(0, sunY - sunR, 0, sunY + sunR);
  sg.addColorStop(0, "#ffd319"); sg.addColorStop(0.55, "#ff2975"); sg.addColorStop(1, "#ff2e88");
  ctx.fillStyle = sg; ctx.fillRect(sunX - sunR, sunY - sunR, sunR * 2, sunR * 2);
  ctx.fillStyle = "rgba(11,0,51,0.85)";
  for (let i = 0; i < 5; i++) {
    const yy = sunY + sunR * (0.08 + i * 0.19);
    ctx.fillRect(sunX - sunR, yy, sunR * 2, Math.max(1.5, sunR * 0.055 * (i + 1)));
  }
  ctx.restore();

  // Parallax skyline: two silhouette layers
  drawSkyline(scroll * 0.18, groundY, u * 15, "#1a0533", 61);
  drawSkyline(scroll * 0.42, groundY, u * 10, "#0d0221", 137);
}
function drawSkyline(off, baseY, maxH, color, seed) {
  const bw = u * 7;
  const startIdx = Math.floor(off / bw);
  ctx.fillStyle = color;
  for (let i = -1; i < W / bw + 2; i++) {
    const idx = startIdx + i;
    const hgt = maxH * (0.3 + 0.7 * hash(idx * 1.3 + seed));
    const x = idx * bw - off;
    ctx.fillRect(x, baseY - hgt, bw - 2, hgt);
    // Antenna
    if (hash(idx * 3.7 + seed) > 0.6) ctx.fillRect(x + bw * 0.42, baseY - hgt - u * 2.2, 2, u * 2.2);
    // Windows
    ctx.fillStyle = "rgba(0,255,255,0.5)";
    const rows = Math.floor(hgt / (u * 2.4));
    for (let r = 0; r < rows; r++) {
      if (hash(idx * 91 + r * 17 + seed) > 0.55) {
        ctx.fillRect(x + bw * (0.15 + 0.6 * hash(idx * 31 + r * 7)), baseY - hgt + u * 1 + r * u * 2.4, u * 0.8, u * 0.9);
      }
    }
    ctx.fillStyle = color;
  }
}

function drawGround() {
  // Road bed
  ctx.fillStyle = "#0a0118";
  ctx.fillRect(0, groundY, W, H - groundY);
  // Glowing grid: horizontal lines receding below the road line
  ctx.strokeStyle = "rgba(255,46,136,0.28)";
  ctx.lineWidth = 1;
  const rows = 4;
  for (let i = 1; i <= rows; i++) {
    const yy = groundY + (H - groundY) * Math.pow(i / rows, 1.6);
    ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(W, yy); ctx.stroke();
  }
  // Vertical grid lines scrolling with the world
  ctx.strokeStyle = "rgba(0,229,255,0.20)";
  const spacing = u * 11;
  const off = scroll % spacing;
  ctx.beginPath();
  for (let x = -off; x < W + spacing; x += spacing) {
    ctx.moveTo(x, groundY); ctx.lineTo(x - u * 2, H);
  }
  ctx.stroke();

  // Neon road line, with gaps where the ground is missing
  ctx.save();
  ctx.shadowColor = "#00e5ff"; ctx.shadowBlur = 12;
  ctx.strokeStyle = "#00e5ff"; ctx.lineWidth = Math.max(2, u * 0.7);
  let segments = [[0, W]];
  for (let i = 0; i < obstacles.length; i++) {
    const o = obstacles[i];
    if (o.type !== "gap") continue;
    const next = [];
    for (let s = 0; s < segments.length; s++) {
      const a = segments[s][0], b = segments[s][1];
      if (o.x >= b || o.x + o.w <= a) { next.push(segments[s]); continue; }
      if (o.x > a) next.push([a, o.x]);
      if (o.x + o.w < b) next.push([o.x + o.w, b]);
    }
    segments = next;
  }
  ctx.beginPath();
  for (let s = 0; s < segments.length; s++) { ctx.moveTo(segments[s][0], groundY); ctx.lineTo(segments[s][1], groundY); }
  ctx.stroke();
  ctx.restore();

  // Pit shading inside gaps
  for (let i = 0; i < obstacles.length; i++) {
    const o = obstacles[i];
    if (o.type !== "gap") continue;
    const grd = ctx.createLinearGradient(0, groundY, 0, H);
    grd.addColorStop(0, "rgba(255,46,136,0.25)"); grd.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = grd;
    ctx.fillRect(o.x, groundY + 2, o.w, H - groundY);
    ctx.fillStyle = "#ff2e88";
    ctx.fillRect(o.x, groundY, 2, u * 3); ctx.fillRect(o.x + o.w - 2, groundY, 2, u * 3);
  }
}

function drawPlayer() {
  const ducking = (player.duckHeld || player.duckTimer > 0);
  const h = playerH();
  const wheelR = u * 4.2;
  const wheelX = player.x, wheelY = player.py - wheelR;
  const hipY = player.py - h * 0.62;
  const lean = player.grounded ? 0.16 : (player.vy < 0 ? 0.05 : 0.30);

  ctx.save();
  // Wheel glow + tyre
  ctx.shadowColor = "#00e5ff"; ctx.shadowBlur = 16;
  ctx.strokeStyle = "#00e5ff"; ctx.lineWidth = Math.max(2, u * 0.8);
  ctx.beginPath(); ctx.arc(wheelX, wheelY, wheelR, 0, Math.PI * 2); ctx.stroke();
  ctx.shadowBlur = 0;
  // Spokes
  ctx.strokeStyle = "rgba(255,255,255,0.85)"; ctx.lineWidth = Math.max(1, u * 0.4);
  for (let i = 0; i < 3; i++) {
    const a = player.wheelSpin + i * Math.PI * 2 / 3;
    ctx.beginPath();
    ctx.moveTo(wheelX, wheelY);
    ctx.lineTo(wheelX + Math.cos(a) * wheelR, wheelY + Math.sin(a) * wheelR);
    ctx.stroke();
  }
  ctx.fillStyle = "#ff2e88";
  ctx.beginPath(); ctx.arc(wheelX, wheelY, u * 1.1, 0, Math.PI * 2); ctx.fill();
  // Fork up to the rider
  ctx.strokeStyle = "#b388ff"; ctx.lineWidth = Math.max(2, u * 0.6);
  ctx.beginPath(); ctx.moveTo(wheelX, wheelY); ctx.lineTo(wheelX + u * 0.6, hipY); ctx.stroke();

  // Rider silhouette (simple, original): torso, head w/ visor, arms, legs
  const torsoTopX = wheelX + u * (ducking ? 3.4 : 1.6) + lean * u * 4;
  const torsoTopY = player.py - h * (ducking ? 0.92 : 0.97);
  ctx.strokeStyle = "#0b0033";
  ctx.lineCap = "round";
  // Legs: hip to pegs by the wheel
  ctx.lineWidth = Math.max(2.5, u * 1.1);
  ctx.beginPath();
  ctx.moveTo(wheelX + u * 0.6, hipY);
  ctx.lineTo(wheelX - u * 1.4, player.py - h * 0.28);
  ctx.moveTo(wheelX + u * 0.6, hipY);
  ctx.lineTo(wheelX + u * 2.0, player.py - h * 0.22);
  ctx.stroke();
  // Torso
  ctx.strokeStyle = "#1a0533"; ctx.lineWidth = Math.max(3.5, u * 1.7);
  ctx.beginPath(); ctx.moveTo(wheelX + u * 0.6, hipY); ctx.lineTo(torsoTopX, torsoTopY + u * 2); ctx.stroke();
  // Neon jacket stripe
  ctx.strokeStyle = "#ff2e88"; ctx.lineWidth = Math.max(1.5, u * 0.55);
  ctx.beginPath(); ctx.moveTo(wheelX + u * 0.6, hipY - u * 0.5); ctx.lineTo(torsoTopX, torsoTopY + u * 1.6); ctx.stroke();
  // Arm to handlebar
  ctx.strokeStyle = "#1a0533"; ctx.lineWidth = Math.max(2, u * 0.9);
  ctx.beginPath(); ctx.moveTo(torsoTopX, torsoTopY + u * 2.4); ctx.lineTo(wheelX + u * 4.4, hipY + u * 0.6); ctx.stroke();
  // Head + glowing visor
  ctx.fillStyle = "#1a0533";
  ctx.beginPath(); ctx.arc(torsoTopX + u * 0.7, torsoTopY, u * 1.9, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#00e5ff";
  ctx.fillRect(torsoTopX + u * 0.9, torsoTopY - u * 0.6, u * 1.9, u * 0.8);
  ctx.restore();
}

function drawObstacles() {
  for (let i = 0; i < obstacles.length; i++) {
    const o = obstacles[i];
    if (o.type === "bot") {
      const b = obstacleBox(o);
      ctx.save();
      // Body
      ctx.fillStyle = "#241040";
      ctx.strokeStyle = "#ff9f1c"; ctx.lineWidth = Math.max(1.5, u * 0.5);
      ctx.shadowColor = "#ff9f1c"; ctx.shadowBlur = 10;
      ctx.fillRect(b.x, b.y + b.h * 0.25, b.w, b.h * 0.6);
      ctx.strokeRect(b.x, b.y + b.h * 0.25, b.w, b.h * 0.6);
      // Head / eye
      ctx.fillRect(b.x + b.w * 0.18, b.y, b.w * 0.64, b.h * 0.28);
      ctx.strokeRect(b.x + b.w * 0.18, b.y, b.w * 0.64, b.h * 0.28);
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#ff3131";
      const blink = 0.5 + 0.5 * Math.sin(performance.now() / 160 + o.x);
      ctx.globalAlpha = 0.5 + 0.5 * blink;
      ctx.beginPath(); ctx.arc(b.x + b.w * 0.5, b.y + b.h * 0.14, u * 0.95, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
      // Treads
      ctx.fillStyle = "#12002b";
      ctx.fillRect(b.x - 1, b.y + b.h * 0.85, b.w + 2, b.h * 0.15);
      ctx.fillStyle = "#ff9f1c";
      for (let k = 0; k < 4; k++) ctx.fillRect(b.x + 2 + k * b.w / 4, b.y + b.h * 0.88, 2, b.h * 0.09);
      ctx.restore();
    } else if (o.type === "drone") {
      const b = obstacleBox(o);
      const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
      ctx.save();
      ctx.shadowColor = "#ff2e88"; ctx.shadowBlur = 12;
      ctx.fillStyle = "#2b0650";
      ctx.strokeStyle = "#ff2e88"; ctx.lineWidth = Math.max(1.5, u * 0.5);
      // Body
      ctx.beginPath();
      ctx.ellipse(cx, cy, b.w * 0.34, b.h * 0.42, 0, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
      ctx.shadowBlur = 0;
      // Rotor arms + spinning rotors
      ctx.strokeStyle = "#ff2e88";
      ctx.beginPath();
      ctx.moveTo(cx - b.w * 0.34, cy); ctx.lineTo(cx - b.w * 0.5, cy - b.h * 0.3);
      ctx.moveTo(cx + b.w * 0.34, cy); ctx.lineTo(cx + b.w * 0.5, cy - b.h * 0.3);
      ctx.stroke();
      const rw = b.w * 0.20 * (0.6 + 0.4 * Math.abs(Math.sin(o.bob * 3)));
      ctx.strokeStyle = "rgba(0,229,255,0.9)";
      ctx.beginPath();
      ctx.moveTo(cx - b.w * 0.5 - rw, cy - b.h * 0.34); ctx.lineTo(cx - b.w * 0.5 + rw, cy - b.h * 0.34);
      ctx.moveTo(cx + b.w * 0.5 - rw, cy - b.h * 0.34); ctx.lineTo(cx + b.w * 0.5 + rw, cy - b.h * 0.34);
      ctx.stroke();
      // Eye
      ctx.fillStyle = "#ffe600";
      ctx.beginPath(); ctx.arc(cx - b.w * 0.08, cy, u * 0.85, 0, Math.PI * 2); ctx.fill();
      // Under-light
      ctx.fillStyle = "rgba(255,46,136,0.5)";
      ctx.beginPath(); ctx.moveTo(cx - u * 1, cy + b.h * 0.4); ctx.lineTo(cx + u * 1, cy + b.h * 0.4); ctx.lineTo(cx, cy + b.h * 0.95); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }
}

function drawBullets() {
  ctx.save();
  ctx.shadowColor = "#ffe600"; ctx.shadowBlur = 10;
  ctx.fillStyle = "#ffe600";
  for (let i = 0; i < bullets.length; i++) {
    const b = bullets[i];
    ctx.fillRect(b.x - u * 1.8, b.y - u * 0.45, u * 3.6, u * 0.9);
  }
  ctx.restore();
}
function drawParticles() {
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    ctx.globalAlpha = 1 - p.life / p.max;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

function drawHUD() {
  ctx.save();
  ctx.textAlign = "left"; ctx.textBaseline = "top";
  ctx.font = "700 " + Math.round(u * 5.2) + "px system-ui, sans-serif";
  ctx.fillStyle = "#00e5ff";
  ctx.shadowColor = "#00e5ff"; ctx.shadowBlur = 8;
  ctx.fillText("SCORE " + getScore(), 14, 12);
  ctx.shadowBlur = 0;
  ctx.font = "600 " + Math.round(u * 3.6) + "px system-ui, sans-serif";
  ctx.fillStyle = "rgba(255,255,255,0.75)";
  ctx.fillText("BEST " + hi, 14, 14 + u * 6);
  ctx.restore();
}

function drawButtons() {
  const defs = [
    { b: btnDuck, c: "#00e5ff" },
    { b: btnJump, c: "#7CFC00" },
    { b: btnFire, c: "#ff2e88" }
  ];
  ctx.save();
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "700 " + Math.round(clamp(u * 3.6, 12, 17)) + "px system-ui, sans-serif";
  for (let i = 0; i < defs.length; i++) {
    const b = defs[i].b, c = defs[i].c;
    ctx.fillStyle = "rgba(10,0,30,0.55)";
    ctx.strokeStyle = c; ctx.lineWidth = 1.5;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(b.x, b.y, b.w, b.h, 10); else ctx.rect(b.x, b.y, b.w, b.h);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = c;
    ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + 1);
  }
  ctx.restore();
}

function panel(title, titleColor, lines) {
  ctx.save();
  ctx.fillStyle = "rgba(8,0,26,0.72)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  // Title
  ctx.font = "900 " + Math.round(clamp(u * 11, 30, 64)) + "px system-ui, sans-serif";
  ctx.shadowColor = titleColor; ctx.shadowBlur = 22;
  ctx.fillStyle = titleColor;
  ctx.fillText(title, W / 2, H * 0.30);
  ctx.shadowBlur = 0;
  ctx.font = "600 " + Math.round(clamp(u * 4.2, 14, 22)) + "px system-ui, sans-serif";
  ctx.fillStyle = "#f5f0ff";
  for (let i = 0; i < lines.length; i++) {
    ctx.fillText(lines[i], W / 2, H * 0.30 + u * 9 + i * u * 6.4);
  }
  ctx.restore();
}

function draw(t) {
  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5);
  player.x = W * 0.22;
  drawBackground(t);
  drawGround();
  drawObstacles();
  drawPlayer();
  drawBullets();
  drawParticles();
  ctx.restore();

  if (state === "play") { drawHUD(); drawButtons(); }
  else if (state === "menu") {
    panel("NEON RUNNER", "#00e5ff", [
      "Ride the grid. Dodge the city.",
      "",
      "▲ JUMP — leap bots & gaps",
      "▼ DUCK — slide under drones",
      "● FIRE — blast bots & drones (+25)",
      "",
      "Tap, click, or press Space to ride",
      "BEST " + hi
    ]);
  } else if (state === "over") {
    const lines = [
      "SCORE " + getScore(),
      newBest ? "★ NEW BEST! ★" : "BEST " + hi,
      "",
      "Tap or press R to ride again"
    ];
    panel("WRECKED!", "#ff2e88", lines);
    drawHUD();
  }
}

// ---------- Main loop ----------
let lastTs = 0;
function frame(ts) {
  const t = ts / 1000;
  let dt = lastTs ? (t - lastTs) : 0.016;
  lastTs = t;
  dt = Math.min(dt, 0.05); // clamp dt to 0.05
  if (state === "play") update(dt);
  else { // keep particles/shake alive outside play, world sits still
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i]; p.life += dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 700 * scaleF() * dt;
      if (p.life >= p.max) particles.splice(i, 1);
    }
    if (shake > 0) shake = Math.max(0, shake - dt * 30);
  }
  // Rider idles on the road in menu / game-over
  if (state !== "play") { player.py = groundY; player.grounded = true; }
  draw(t);
  requestAnimationFrame(frame);
}

// ---------- Boot ----------
resize();
resetWorld();
state = "menu";
requestAnimationFrame(frame);

// QA hook
window.__game = {
  get state() { return state; },
  get score() { return getScore(); },
  start() { initAudio(); startGame(); }
};
</script>
</body>
