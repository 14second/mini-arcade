<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#101828">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Breakout</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:
      radial-gradient(120% 80% at 50% 0%, #2a3d5f 0%, rgba(42,61,95,0) 55%),
      linear-gradient(180deg, #16233c 0%, #101828 60%, #0a101d 100%);
    font-family:"Avenir Next", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    touch-action:none; user-select:none; -webkit-user-select:none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { position:fixed; inset:0; display:block; touch-action:none; }
  #muteBtn {
    position:fixed; top:10px; right:10px; z-index:10;
    width:48px; height:48px; border-radius:14px;
    border:1.5px solid rgba(170,215,255,.55);
    background:linear-gradient(180deg, rgba(50,75,115,.72), rgba(10,16,30,.72));
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    box-shadow:0 8px 22px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.25);
    color:#fff; font-size:22px; line-height:1; cursor:pointer;
    touch-action:none; user-select:none; -webkit-user-select:none;
    display:flex; align-items:center; justify-content:center; padding:0;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="muteBtn" aria-label="Toggle sound">🔊</button>
<script>
// iOS audio routing: route Web Audio to the media/playback channel (iOS 17+
// Audio Session API) on the first gesture and inside audio init, so sound
// plays even with the silent switch on.
function iosPlaybackSession() {
  try { if ('audioSession' in navigator) navigator.audioSession.type = 'playback'; } catch (e) {}
}
document.addEventListener('pointerdown', iosPlaybackSession, true);
// Sleep in the background (2026-11-09): the wrapper's pauseTimers stops
// JS timers, but the Web Audio graph is a separate engine — suspend the
// audio context whenever the page is hidden so nothing keeps the CPU
// (or the sound) running while the app is in the background.
document.addEventListener("visibilitychange", function () {
  try {
    var c = window.__maCtx;
    if (document.hidden) {
      window.__maHidden = true;
      if (c) {
        if (c.close) { try { var p = c.close(); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
        if (c.suspend && c.state === "running") { try { c.suspend(); } catch (e) {} }
        window.__maCtx = null;
      }
    } else {
      window.__maHidden = false;
      var ac = c || (window.__maActx && window.__maActx());
      if (ac && ac.state === "suspended" && ac.resume) { try { ac.resume(); } catch (e) {} }
    }
  } catch (e) {}
});

document.addEventListener('touchstart', iosPlaybackSession, true);

"use strict";
/* ============================================================
   BREAKOUT — smash every brick. Drag or arrow keys.
   Fairness rule: after every bounce the ball keeps a healthy
   vertical component, so it can never settle into a flat,
   endless side-to-side drift.
   ============================================================ */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1, u = 4;
let padW = 84, padH = 12, padY = 0, ballR = 7;
let brickX = 0, brickY = 0, brickW = 0, brickH = 0, brickGap = 4;
const COLS = 8;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  u = Math.min(W, H) / 100;
  padW = Math.max(64, Math.min(124, W * 0.23));
  padH = Math.max(10, u * 2.6);
  ballR = Math.max(6, u * 1.8);
  padY = H - Math.max(52, H * 0.085);
  brickGap = Math.max(3, u * 0.9);
  brickW = (W - 20 - brickGap * (COLS - 1)) / COLS;
  brickH = Math.max(14, u * 4.4);
  brickX = 10;
  brickY = Math.max(64, H * 0.11);
  paddle.x = clamp(paddle.x || W / 2, padW / 2, W - padW / 2);
}
window.addEventListener("resize", resize);

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

// ---------- Audio ----------
let actx = null, muted = false;
const muteBtn = document.getElementById("muteBtn");
function initAudio() {
  iosPlaybackSession();
  if (!actx || actx.state === "closed") {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) actx = new AC(); window.__maCtx = actx; window.__maActx = function () { return actx; };;
    } catch (e) { actx = null; }
    if (actx) startMusicScheduler();
  }
  if (actx && actx.state === "suspended") actx.resume();
}
function beep(freq, dur, type, vol, slide) {
  if (!actx || muted) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || "square";
  o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t + dur);
  g.gain.setValueAtTime(vol || 0.08, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function sfxPaddle() { beep(300, 0.06, "square", 0.06); }
function sfxWall()   { beep(220, 0.05, "square", 0.045); }
function sfxBrick(r) { beep(420 + r * 60, 0.06, "square", 0.06); }
function sfxLose()   { beep(320, 0.3, "sawtooth", 0.07, 70); }
function sfxLevel()  { [523,659,784].forEach((f,i)=>setTimeout(()=>beep(f,0.1,"square",0.06), i*90)); }

// Driving loop, BPM 120. Bass >= MIDI 48.
const BPM = 120, STEP_DUR = 60 / BPM / 2;
const BASS = [
  48,0,48,0, 0,48,0,48, 46,0,46,0, 0,46,0,46,
  41,0,41,0, 0,41,0,41, 43,0,43,0, 0,43,0,0
];
const LEAD = [
  72,0,0,74, 76,0,0,0, 74,0,0,72, 0,0,0,0,
  69,0,0,71, 72,0,0,0, 71,0,0,0, 0,0,0,0
];
const PADS = [ [48,52,55], [46,50,53], [41,45,48], [43,47,50] ];
let musicStep = 0, nextNoteTime = 0, musicTimer = null;
function midiFreq(m) { return 440 * Math.pow(2, (m - 69) / 12); }
function toneAt(midi, when, dur, type, vol) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(midiFreq(midi), when);
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(vol, when + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(when); o.stop(when + dur + 0.03);
}
function scheduleStep(step, when) {
  if (muted) return;
  const b = BASS[step % 32]; if (b) toneAt(b, when, STEP_DUR * 0.9, "sawtooth", 0.038);
  const l = LEAD[step % 32]; if (l) toneAt(l, when, STEP_DUR * 0.85, "square", 0.024);
  if (step % 8 === 0) {
    const chord = PADS[Math.floor(step / 8) % PADS.length];
    for (let i = 0; i < chord.length; i++) toneAt(chord[i], when, STEP_DUR * 7.6, "triangle", 0.011);
  }
}
function startMusicScheduler() {
  if (musicTimer !== null || !actx) return;
  musicStep = 0; nextNoteTime = actx.currentTime + 0.06;
  musicTimer = setInterval(function () {
    if (!actx) return;
    if (nextNoteTime < actx.currentTime) nextNoteTime = actx.currentTime + 0.05;
    while (nextNoteTime < actx.currentTime + 0.12) {
      scheduleStep(musicStep, nextNoteTime);
      nextNoteTime += STEP_DUR; musicStep = (musicStep + 1) % 32;
    }
  }, 25);
}
function setMuted(m) { muted = m; muteBtn.textContent = muted ? "🔇" : "🔊"; }
muteBtn.addEventListener("pointerdown", function (e) {
  e.stopPropagation(); e.preventDefault(); initAudio(); setMuted(!muted);
});
muteBtn.addEventListener("click", function (e) { e.stopPropagation(); e.preventDefault(); });

// ---------- Game state ----------
let state = "menu"; // menu | play | over
let hi = 0;
try { hi = parseInt(localStorage.getItem("breakout_hi") || "0", 10) || 0; } catch (e) { hi = 0; }
const ROW_COLORS = ["#ff5d5d","#ff9f43","#ffd93d","#6fe07a","#54c8ff","#b78bff","#ff7ad9","#5ce8c0"];
const paddle = { x: 0 };
const ball = { x: 0, y: 0, vx: 0, vy: 0, speed: 380, stuck: true };
let bricks = [], rows = 6, score = 0, lives = 3, level = 1, keys = {};
let dragging = false;

function buildLevel() {
  rows = Math.min(5 + level, 9);
  bricks = [];
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < COLS; c++)
      bricks.push({ c, r, alive: true });
}
function resetBall() {
  ball.stuck = true;
  ball.x = paddle.x; ball.y = padY - ballR - 1;
  ball.speed = 360 + level * 35;
  ball.vx = 0; ball.vy = 0;
}
function launch() {
  if (!ball.stuck) return;
  ball.stuck = false;
  const ang = (Math.random() * 0.6 - 0.3); // radians from vertical
  ball.vx = Math.sin(ang) * ball.speed;
  ball.vy = -Math.cos(ang) * ball.speed;
  enforceMinVertical();
}
// Fairness: never let the ball go near-horizontal.
function enforceMinVertical() {
  const minVy = ball.speed * 0.38;
  if (Math.abs(ball.vy) < minVy) {
    const vySign = ball.vy === 0 ? (Math.random() < 0.5 ? -1 : 1) : Math.sign(ball.vy);
    const vxSign = ball.vx === 0 ? (Math.random() < 0.5 ? -1 : 1) : Math.sign(ball.vx);
    ball.vy = vySign * minVy;
    ball.vx = vxSign * Math.sqrt(ball.speed * ball.speed - ball.vy * ball.vy);
  }
}
function reset() {
  score = 0; lives = 3; level = 1;
  paddle.x = W / 2;
  buildLevel(); resetBall();
}
function startGame() { initAudio(); reset(); state = "play"; }

// ---------- Input ----------
canvas.addEventListener("pointerdown", function (e) {
  initAudio();
  if (state !== "play") { startGame(); return; }
  dragging = true;
  paddle.x = clamp(e.clientX, padW / 2, W - padW / 2);
  if (ball.stuck) launch();
});
canvas.addEventListener("pointermove", function (e) {
  if (dragging && state === "play") paddle.x = clamp(e.clientX, padW / 2, W - padW / 2);
});
window.addEventListener("pointerup", function () { dragging = false; });
window.addEventListener("keydown", function (e) {
  keys[e.key] = true;
  if (["ArrowLeft","ArrowRight"," "].includes(e.key)) e.preventDefault();
  initAudio();
  if (state !== "play") { if (e.key === " " || e.key === "Enter") startGame(); return; }
  if (e.key === " ") launch();
  if (e.key === "m" || e.key === "M") setMuted(!muted);
});
window.addEventListener("keyup", function (e) { keys[e.key] = false; });

// ---------- Update ----------
function update(dt) {
  if (state !== "play") return;
  const kSpeed = 640;
  if (keys["ArrowLeft"] || keys["a"] || keys["A"]) paddle.x -= kSpeed * dt;
  if (keys["ArrowRight"] || keys["d"] || keys["D"]) paddle.x += kSpeed * dt;
  paddle.x = clamp(paddle.x, padW / 2, W - padW / 2);

  if (ball.stuck) { ball.x = paddle.x; ball.y = padY - ballR - 1; return; }

  // Sub-step so fast balls can't tunnel through bricks.
  const steps = Math.max(1, Math.ceil(ball.speed * dt / (ballR * 1.2)));
  const sdt = dt / steps;
  for (let s = 0; s < steps; s++) {
    ball.x += ball.vx * sdt;
    ball.y += ball.vy * sdt;

    if (ball.x < ballR) { ball.x = ballR; ball.vx = Math.abs(ball.vx); sfxWall(); enforceMinVertical(); }
    if (ball.x > W - ballR) { ball.x = W - ballR; ball.vx = -Math.abs(ball.vx); sfxWall(); enforceMinVertical(); }
    if (ball.y < ballR) { ball.y = ballR; ball.vy = Math.abs(ball.vy); sfxWall(); enforceMinVertical(); }

    // Paddle
    if (ball.vy > 0 && ball.y + ballR >= padY && ball.y - ballR <= padY + padH &&
        Math.abs(ball.x - paddle.x) <= padW / 2 + ballR * 0.5) {
      const off = clamp((ball.x - paddle.x) / (padW / 2), -1, 1);
      const ang = off * 1.15; // up to ~66 degrees
      ball.speed = Math.min(700, ball.speed + 4);
      ball.vx = Math.sin(ang) * ball.speed;
      ball.vy = -Math.cos(ang) * ball.speed;
      ball.y = padY - ballR - 1;
      sfxPaddle(); enforceMinVertical();
    }

    // Bricks
    for (let i = 0; i < bricks.length; i++) {
      const b = bricks[i];
      if (!b.alive) continue;
      const bx = brickX + b.c * (brickW + brickGap);
      const by = brickY + b.r * (brickH + brickGap);
      if (ball.x + ballR > bx && ball.x - ballR < bx + brickW &&
          ball.y + ballR > by && ball.y - ballR < by + brickH) {
        b.alive = false;
        score += 10;
        sfxBrick(b.r);
        // Bounce off the face we hit: compare penetration depths.
        const penL = (ball.x + ballR) - bx, penR = (bx + brickW) - (ball.x - ballR);
        const penT = (ball.y + ballR) - by, penB = (by + brickH) - (ball.y - ballR);
        const minPen = Math.min(penL, penR, penT, penB);
        if (minPen === penT) ball.vy = -Math.abs(ball.vy);
        else if (minPen === penB) ball.vy = Math.abs(ball.vy);
        else if (minPen === penL) ball.vx = -Math.abs(ball.vx);
        else ball.vx = Math.abs(ball.vx);
        enforceMinVertical();
        break;
      }
    }

    if (ball.y - ballR > H) {
      lives--; sfxLose();
      if (lives <= 0) {
        state = "over";
        if (score > hi) { hi = score; try { localStorage.setItem("breakout_hi", String(hi)); } catch (e) {} }
      } else {
        resetBall();
      }
      return;
    }
  }

  if (bricks.every(b => !b.alive)) {
    level++; score += 100; sfxLevel();
    buildLevel(); resetBall();
  }
}

// ---------- Draw ----------
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
// Darker shade per row colour for brick gradients (visual only)
const ROW_DARK = ["#c22a2a","#c96a14","#c9a414","#3da34a","#2478c8","#7a4fd0","#c22a90","#1da88f"];
function glassPanel(x, y, w, h) {
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,.5)"; ctx.shadowBlur = 34; ctx.shadowOffsetY = 12;
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, "rgba(26,40,64,.88)"); g.addColorStop(1, "rgba(10,16,28,.90)");
  ctx.fillStyle = g; rr(x, y, w, h, 22); ctx.fill();
  ctx.restore();
  ctx.lineWidth = 1.5; ctx.strokeStyle = "rgba(255,255,255,.18)"; rr(x, y, w, h, 22); ctx.stroke();
  ctx.strokeStyle = "rgba(255,255,255,.10)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x + 22, y + 1); ctx.lineTo(x + w - 22, y + 1); ctx.stroke();
}
function draw() {
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, "#1b2c49"); bg.addColorStop(0.55, "#111c30"); bg.addColorStop(1, "#0a101d");
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  const glow = ctx.createRadialGradient(W / 2, H * 0.30, 10, W / 2, H * 0.30, H * 0.62);
  glow.addColorStop(0, "rgba(110,180,255,.15)"); glow.addColorStop(1, "rgba(110,180,255,0)");
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
  // faint starfield / dust (deterministic, visual only)
  ctx.fillStyle = "rgba(200,220,255,.32)";
  for (let i = 0; i < 30; i++) {
    const sx = ((i * 149.3) % 97) / 97 * W, sy = ((i * 83.7) % 89) / 89 * H;
    ctx.fillRect(sx, sy, 2, 2);
  }
  // HUD: frosted pills
  ctx.save();
  ctx.fillStyle = "rgba(12,22,40,.48)"; rr(8, 8, Math.min(W * 0.40, 180), 40, 20); ctx.fill();
  ctx.lineWidth = 1; ctx.strokeStyle = "rgba(255,255,255,.22)"; rr(8, 8, Math.min(W * 0.40, 180), 40, 20); ctx.stroke();
  ctx.fillStyle = "rgba(12,22,40,.48)"; rr(W / 2 - 52, 8, 104, 40, 20); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.22)"; rr(W / 2 - 52, 8, 104, 40, 20); ctx.stroke();
  ctx.restore();
  ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#eaf2ff";
  ctx.font = "bold " + Math.round(u * 5) + "px system-ui, sans-serif";
  ctx.fillText("Score " + score, 20, 30);
  ctx.textAlign = "center";
  ctx.fillStyle = "#c8dcf5";
  ctx.fillText("Level " + level, W / 2, 30);
  ctx.textAlign = "right";
  let hearts = "";
  for (let i = 0; i < lives; i++) hearts += "● ";
  ctx.fillStyle = "#ff7a94";
  ctx.fillText(hearts.trim(), W - 66, 30);
  ctx.textAlign = "right";
  ctx.fillStyle = "#5f7595";
  ctx.font = Math.round(u * 3.6) + "px system-ui, sans-serif";
  // (best shown on overlays)
  // Bricks: glossy gradients with soft shadows and a top sheen
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,.38)"; ctx.shadowBlur = 6; ctx.shadowOffsetY = 3;
  for (const b of bricks) {
    if (!b.alive) continue;
    const bx = brickX + b.c * (brickW + brickGap);
    const by = brickY + b.r * (brickH + brickGap);
    const ci = b.r % ROW_COLORS.length;
    const bgd = ctx.createLinearGradient(0, by, 0, by + brickH);
    bgd.addColorStop(0, ROW_COLORS[ci]); bgd.addColorStop(0.55, ROW_COLORS[ci]); bgd.addColorStop(1, ROW_DARK[ci]);
    ctx.fillStyle = bgd;
    rr(bx, by, brickW, brickH, 6); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.32)";
    rr(bx + 3, by + 2.5, brickW - 6, Math.max(2.5, brickH * 0.26), 3); ctx.fill();
  }
  ctx.restore();
  // Paddle: glossy cyan gradient + ball: glowing orb with trail
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,.5)"; ctx.shadowBlur = 12; ctx.shadowOffsetY = 4;
  const padG = ctx.createLinearGradient(0, padY, 0, padY + padH);
  padG.addColorStop(0, "#bfeaff"); padG.addColorStop(0.5, "#54c8ff"); padG.addColorStop(1, "#2478c8");
  ctx.fillStyle = padG; rr(paddle.x - padW / 2, padY, padW, padH, padH / 2); ctx.fill();
  ctx.restore();
  ctx.fillStyle = "rgba(255,255,255,.45)";
  rr(paddle.x - padW / 2 + 6, padY + 2, padW - 12, Math.max(2, padH * 0.32), padH * 0.16); ctx.fill();
  if (!ball.stuck) {
    ctx.fillStyle = "rgba(255,210,120,.16)";
    ctx.beginPath(); ctx.arc(ball.x - ball.vx * 0.026, ball.y - ball.vy * 0.026, ballR * 0.85, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255,210,120,.24)";
    ctx.beginPath(); ctx.arc(ball.x - ball.vx * 0.013, ball.y - ball.vy * 0.013, ballR * 0.92, 0, Math.PI * 2); ctx.fill();
  }
  const halo = ctx.createRadialGradient(ball.x, ball.y, ballR * 0.3, ball.x, ball.y, ballR * 2.2);
  halo.addColorStop(0, "rgba(255,230,170,.38)"); halo.addColorStop(1, "rgba(255,230,170,0)");
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ballR * 2.2, 0, Math.PI * 2); ctx.fill();
  const ballG = ctx.createRadialGradient(ball.x - ballR * 0.35, ball.y - ballR * 0.4, ballR * 0.15, ball.x, ball.y, ballR * 1.2);
  ballG.addColorStop(0, "#ffffff"); ballG.addColorStop(0.65, "#ffeec2"); ballG.addColorStop(1, "#f5b94e");
  ctx.fillStyle = ballG;
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ballR, 0, Math.PI * 2); ctx.fill();
  if (ball.stuck && state === "play") {
    ctx.fillStyle = "#9db8dd"; ctx.textAlign = "center";
    ctx.font = Math.round(u * 4) + "px system-ui, sans-serif";
    ctx.fillText("Tap or press SPACE to launch", W / 2, padY - 34);
  }
  // vignette
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.42, W / 2, H / 2, H * 0.92);
  vg.addColorStop(0, "rgba(0,0,12,0)"); vg.addColorStop(1, "rgba(0,0,12,.30)");
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  if (state !== "play") {
    ctx.fillStyle = "rgba(5,8,16,0.60)"; ctx.fillRect(0, 0, W, H);
    glassPanel(Math.max(12, W / 2 - 230), H * 0.20, Math.min(W - 24, 460), H * 0.52);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const tg = ctx.createLinearGradient(0, H * 0.25, 0, H * 0.33);
    tg.addColorStop(0, "#ffffff"); tg.addColorStop(0.55, "#bfeaff"); tg.addColorStop(1, "#54c8ff");
    ctx.fillStyle = tg;
    ctx.font = "bold " + Math.round(u * 10.5) + "px system-ui, sans-serif";
    ctx.fillText("BREAKOUT", W / 2, H * 0.30);
    ctx.fillStyle = "#eaf2ff";
    ctx.font = Math.round(u * 4.4) + "px system-ui, sans-serif";
    if (state === "menu") {
      ctx.fillText("Drag the paddle, or use ◀ ▶ arrow keys.", W / 2, H * 0.42);
      ctx.fillText("Smash every brick. You have 3 balls.", W / 2, H * 0.475);
      ctx.fillStyle = "#9db8dd";
      ctx.fillText("Edge hits angle the ball — aim for the gaps.", W / 2, H * 0.53);
      if (hi) ctx.fillText("Best score: " + hi, W / 2, H * 0.585);
    } else {
      ctx.fillText("Game over — score " + score, W / 2, H * 0.42);
      ctx.fillStyle = "#9db8dd";
      ctx.fillText("Reached level " + level + " · Best " + hi, W / 2, H * 0.475);
    }
    ctx.fillStyle = "#54c8ff";
    ctx.font = "bold " + Math.round(u * 5) + "px system-ui, sans-serif";
    ctx.fillText(state === "menu" ? "TAP TO START" : "TAP TO PLAY AGAIN", W / 2, H * 0.66);
  }
}

// ---------- Loop ----------
let lastT = 0;
function frame(t) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (t - lastT) / 1000 || 0); lastT = t;
  update(dt);
  draw();
}
resize();
reset();
requestAnimationFrame(frame);
</script>
</body>
</html>
