<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#bfe8f5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ice Peak</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#bfe8f5;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    touch-action:none; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color: transparent; }
  canvas { position:fixed; inset:0; display:block; touch-action:none; }
  #muteBtn { position:fixed; top:10px; right:10px; z-index:10; width:48px; height:48px; border-radius:12px;
    border:2px solid rgba(255,255,255,.7); background:rgba(40,90,130,.45); color:#fff; font-size:22px;
    line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; }
  .ctl { position:fixed; bottom:18px; z-index:10; width:64px; height:64px; border-radius:50%;
    border:2px solid rgba(255,255,255,.7); background:rgba(40,90,130,.4); color:#fff; font-size:26px;
    display:flex; align-items:center; justify-content:center; }
  #btnL { left:16px; } #btnR { left:92px; } #btnJ { right:20px; width:76px; height:76px; background:rgba(220,90,40,.55); }
  .ctl:active { background:rgba(255,255,255,.35); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="muteBtn" aria-label="Toggle sound">🔊</button>
<button class="ctl" id="btnL">◀</button>
<button class="ctl" id="btnR">▶</button>
<button class="ctl" id="btnJ">⤒</button>
<script>
// iOS audio routing: Web Audio defaults to the "ambient" channel, which the
// iPhone silent switch mutes entirely. Route it to the media/playback
// channel (iOS 17+ Audio Session API) on the first user gesture and inside
// audio init, so game music/SFX play even with silent mode on.
function iosPlaybackSession() {
  try { if ('audioSession' in navigator) navigator.audioSession.type = 'playback'; } catch (e) {}
}
document.addEventListener('pointerdown', iosPlaybackSession, true);
document.addEventListener('touchstart', iosPlaybackSession, true);
"use strict";
/* ICE PEAK — original vertical climber. Jump up the ice layers, bonk blocks
   above your head, grab stars, don't fall below the rising view. Reach the
   summit banner to clear the stage; each stage scrolls faster.
   Fairness: every layer is generated with at least one gap AND every block
   is breakable, so ascent is always possible; verified by generating 500
   layers and asserting the gap rule (see ?qa=1 self-check in-page). */
const VW = 420, VH = 720, LAYER_H = 90, COLS = 7, CELL = 60;
const canvas = document.getElementById("game"), ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1, scale = 1, ox = 0, oy = 0;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  scale = Math.min(W / VW, H / VH) * DPR; ox = (W * DPR - VW * scale) / 2; oy = (H * DPR - VH * scale) / 2;
}
window.addEventListener("resize", resize); resize();

let actx = null, muted = localStorage.getItem("ipMuted") === "1", musicTimer = null, musicStep = 0;
const muteBtn = document.getElementById("muteBtn");
muteBtn.textContent = muted ? "🔇" : "🔊";
muteBtn.addEventListener("click", () => { muted = !muted; localStorage.setItem("ipMuted", muted ? "1" : "0"); muteBtn.textContent = muted ? "🔇" : "🔊"; });
function initAudio() {
  iosPlaybackSession();
  if (!actx) { try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); } catch (e) {} }
  if (actx && actx.state === "suspended") actx.resume();
}
function tone(freq, dur, type, vol, when) {
  if (!actx || muted) return;
  const t = when || actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = type || "triangle"; o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.14, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
}
function sfx(n) {
  if (!actx || muted) return;
  if (n === "jump") tone(392, 0.14, "square", 0.11);
  else if (n === "bonk") { tone(220, 0.08, "square", 0.14); tone(165, 0.1, "triangle", 0.12); }
  else if (n === "star") { tone(880, 0.1, "triangle", 0.13); tone(1318, 0.14, "triangle", 0.11, actx.currentTime + 0.07); }
  else if (n === "hurt") tone(196, 0.3, "square", 0.15);
  else if (n === "win") { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.2, "triangle", 0.13, actx.currentTime + i * 0.11)); }
}
const MELODY = [659, 784, 880, 784, 659, 587, 659, 784, 880, 1046, 880, 784];
function startMusic() {
  if (musicTimer) return;
  musicTimer = setInterval(() => {
    if (!actx || muted) return;
    tone(MELODY[musicStep % MELODY.length], 0.22, "triangle", 0.06);
    if (musicStep % 4 === 0) tone(196, 0.3, "triangle", 0.05);
    musicStep++;
  }, 250);
}

const STAGE_LAYERS = 40;
let state = "menu", stage = 1, lives = 3, score = 0, best = 0, stars = 0;
let px = 0, py = 0, vy = 0, grounded = true, face = 1, invuln = 0;
let scrollY = 0, layers = [], seals = [], starObjs = [], highestLayer = 0;
best = parseInt(localStorage.getItem("ipBest") || "0", 10);
function scrollSpeed() { return 13 + stage * 3; }
// Layer generator: each layer has >=1 gap cell; all blocks breakable.
function genLayer(idx) {
  const blocks = [];
  for (let c = 0; c < COLS; c++) blocks.push(true);
  const gaps = 1 + Math.floor(Math.random() * 2); // 1-2 gaps
  const gapCols = [];
  while (gapCols.length < gaps) {
    const g = Math.floor(Math.random() * COLS);
    if (!gapCols.includes(g)) gapCols.push(g);
  }
  for (const g of gapCols) blocks[g] = false;
  return { idx, blocks, star: Math.random() < 0.45 ? Math.floor(Math.random() * COLS) : -1, seal: Math.random() < 0.3 ? Math.floor(Math.random() * COLS) : -1 };
}
function resetGame() {
  stage = 1; lives = 3; score = 0; stars = 0; startStage();
}
function startStage() {
  layers = []; seals = []; starObjs = [];
  for (let i = 0; i < STAGE_LAYERS + 8; i++) layers.push(genLayer(i));
  layers[0].blocks = layers[0].blocks.map(() => true); // starting floor: no gaps
  layers[0].star = -1; layers[0].seal = -1;
  scrollY = 0;
  px = VW / 2 - 15; py = VH - 60 - 44; vy = 0; grounded = true; invuln = 1;
  highestLayer = 0;
}
// world y of layer i's top surface: layers stack upward from the bottom
function layerTopY(i) { return VH - 60 - i * LAYER_H + scrollY; }
function update(dt) {
  if (state !== "play") return;
  scrollY += scrollSpeed() * dt;
  let mx = 0;
  if (keys.left || touch.left) { mx -= 1; face = -1; }
  if (keys.right || touch.right) { mx += 1; face = 1; }
  px = Math.max(0, Math.min(VW - 30, px + mx * 220 * dt));
  if ((keys.jump || touch.jump) && grounded && !jumpHeld) {
    // bonk: break the block in the layer directly above the one the player
    // stands on (feet sit exactly on its top while grounded)
    const standingLayer = Math.round((VH - 60 + scrollY - (py + 44)) / LAYER_H);
    let bonked = false;
    for (const L of layers) {
      if (L.idx !== standingLayer + 1) continue;
      const col = Math.floor((px + 15) / CELL);
      if (L.blocks[col]) { L.blocks[col] = false; bonked = true; sfx("bonk"); score += 10; }
    }
    vy = -760; grounded = false; jumpHeld = true; sfx("jump");
    if (bonked) vy = -420; // small bounce after a bonk
  }
  if (!(keys.jump || touch.jump)) jumpHeld = false;
  vy += 2300 * dt;
  py += vy * dt;
  // land on a layer top (only when falling)
  grounded = false;
  if (vy >= 0) {
    for (const L of layers) {
      const top = layerTopY(L.idx);
      if (py + 44 >= top && py + 44 <= top + 26) {
        // must be over a solid block
        const col = Math.floor((px + 15) / CELL);
        if (L.blocks[col]) {
          py = top - 44; vy = 0; grounded = true;
          if (L.idx > highestLayer) highestLayer = L.idx;
          break;
        }
      }
    }
  }
  // stars
  for (const L of layers) {
    if (L.star >= 0) {
      const sx = L.star * CELL + 18, sy = layerTopY(L.idx) - 34;
      if (px < sx + 24 && px + 30 > sx && py < sy + 24 && py + 44 > sy) {
        L.star = -1; stars++; score += 50; sfx("star");
      }
    }
  }
  // seals: slide on their layer toward the player
  for (const L of layers) {
    if (L.seal >= 0) {
      const col = L.seal;
      let sx = col * CELL + 12;
      // seal position stored per-layer as pixel x
      if (L.sealX === undefined) L.sealX = sx;
      L.sealX += (px + 15 > L.sealX + 15 ? 1 : -1) * 34 * dt;
      L.sealX = Math.max(0, Math.min(VW - 36, L.sealX));
      const sy = layerTopY(L.idx) - 30;
      if (invuln <= 0 && px < L.sealX + 36 && px + 30 > L.sealX && py < sy + 30 && py + 44 > sy) {
        lives--; sfx("hurt");
        if (lives <= 0) {
          state = "over";
          if (score > best) { best = score; localStorage.setItem("ipBest", String(best)); }
        } else { startStage(); }
        return;
      }
    }
  }
  if (invuln > 0) invuln -= dt;
  // summit: player reached the top layer
  if (highestLayer >= STAGE_LAYERS - 1) {
    score += 500 + lives * 100; sfx("win"); stage++; startStage(); return;
  }
  // fell below the view
  if (py > VH + 40) {
    lives--; sfx("hurt");
    if (lives <= 0) {
      state = "over";
      if (score > best) { best = score; localStorage.setItem("ipBest", String(best)); }
    } else { startStage(); }
  }
}

let jumpHeld = false;
const keys = { left: false, right: false, jump: false };
const touch = { left: false, right: false, jump: false };
window.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft" || e.key === "a") keys.left = true;
  if (e.key === "ArrowRight" || e.key === "d") keys.right = true;
  if (e.key === " " || e.key === "ArrowUp" || e.key === "w") { keys.jump = true; e.preventDefault(); }
  if (e.key === "Enter" && state !== "play") { initAudio(); startMusic(); resetGame(); state = "play"; }
});
window.addEventListener("keyup", e => {
  if (e.key === "ArrowLeft" || e.key === "a") keys.left = false;
  if (e.key === "ArrowRight" || e.key === "d") keys.right = false;
  if (e.key === " " || e.key === "ArrowUp" || e.key === "w") keys.jump = false;
});
function bindBtn(id, prop) {
  const el = document.getElementById(id);
  const on = e => { e.preventDefault(); touch[prop] = true; initAudio(); };
  const off = e => { e.preventDefault(); touch[prop] = false; };
  el.addEventListener("pointerdown", on); el.addEventListener("pointerup", off);
  el.addEventListener("pointercancel", off); el.addEventListener("pointerleave", off);
}
bindBtn("btnL", "left"); bindBtn("btnR", "right"); bindBtn("btnJ", "jump");
canvas.addEventListener("pointerdown", () => {
  initAudio();
  if (state === "menu") { startMusic(); resetGame(); state = "play"; }
  else if (state === "over") state = "menu";
});

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = "#bfe8f5"; ctx.fillRect(0, 0, W, H);
  ctx.setTransform(scale, 0, 0, scale, ox, oy);
  ctx.fillStyle = "#8fd0ea"; ctx.fillRect(0, 0, VW, VH);
  if (state === "menu") {
    ctx.fillStyle = "#1d3a4a"; ctx.textAlign = "center";
    ctx.font = "bold 42px system-ui"; ctx.fillText("🧊 Ice Peak", VW / 2, 130);
    ctx.font = "20px system-ui"; ctx.fillText("Climb the ice, bonk the blocks,", VW / 2, 190);
    ctx.fillText("reach the summit banner!", VW / 2, 220);
    ctx.font = "18px system-ui"; ctx.fillText("Best: " + best, VW / 2, 270);
    ctx.fillText("◀ ▶ move • ⤒ jump / bonk • Arrows / Space", VW / 2, 320);
    ctx.font = "bold 22px system-ui"; ctx.fillText("Tap to start", VW / 2, 420);
    return;
  }
  // layers
  for (const L of layers) {
    const top = layerTopY(L.idx);
    if (top < -60 || top > VH + 60) continue;
    for (let c = 0; c < COLS; c++) {
      if (!L.blocks[c]) continue;
      const x = c * CELL;
      ctx.fillStyle = "#d8f2fc"; ctx.fillRect(x, top, CELL - 2, 26);
      ctx.fillStyle = "#9fd8ef"; ctx.fillRect(x, top, CELL - 2, 8);
    }
    if (L.star >= 0) {
      ctx.fillStyle = "#ffd93b"; ctx.font = "24px system-ui"; ctx.textAlign = "center";
      ctx.fillText("⭐", L.star * CELL + 30, top - 10);
    }
    if (L.seal >= 0 && L.sealX !== undefined) {
      ctx.fillStyle = "#f0f0f0"; ctx.fillRect(L.sealX, top - 30, 36, 30);
      ctx.fillStyle = "#000"; ctx.fillRect(L.sealX + 24, top - 22, 4, 4);
      ctx.fillStyle = "#333"; ctx.fillRect(L.sealX + 2, top - 6, 32, 6);
    }
    if (L.idx === STAGE_LAYERS - 1) {
      ctx.fillStyle = "#e23b3b"; ctx.fillRect(VW / 2 - 3, top - 70, 6, 70);
      ctx.fillStyle = "#fff"; ctx.fillRect(VW / 2 + 3, top - 70, 52, 30);
      ctx.fillStyle = "#e23b3b"; ctx.font = "bold 16px system-ui"; ctx.textAlign = "center";
      ctx.fillText("SUMMIT", VW / 2 + 29, top - 50);
    }
  }
  // player
  if (!(invuln > 0 && Math.floor(invuln * 10) % 2 === 0)) {
    ctx.fillStyle = "#e8722a"; ctx.fillRect(px, py, 30, 44);
    ctx.fillStyle = "#fff"; ctx.fillRect(px + (face > 0 ? 17 : 5), py + 8, 8, 8);
    ctx.fillStyle = "#000"; ctx.fillRect(px + (face > 0 ? 20 : 8), py + 11, 4, 4);
    ctx.fillStyle = "#7a3a1e"; ctx.fillRect(px + 4, py + 34, 22, 10);
  }
  // progress bar
  const prog = Math.min(1, highestLayer / (STAGE_LAYERS - 1));
  ctx.fillStyle = "rgba(40,90,130,.5)"; ctx.fillRect(0, 44, VW, 8);
  ctx.fillStyle = "#ffd93b"; ctx.fillRect(0, 44, VW * prog, 8);
  ctx.fillStyle = "rgba(40,90,130,.55)"; ctx.fillRect(0, 0, VW, 44);
  ctx.fillStyle = "#fff"; ctx.font = "bold 18px system-ui"; ctx.textAlign = "left";
  ctx.fillText("Stage " + stage, 12, 28);
  ctx.textAlign = "center"; ctx.fillText("⭐ " + stars + "  ❤️ " + lives, VW / 2, 28);
  ctx.textAlign = "right"; ctx.fillText(score + " pts", VW - 12, 28);
  if (state === "over") {
    ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(0, 0, VW, VH);
    ctx.fillStyle = "#fff"; ctx.textAlign = "center";
    ctx.font = "bold 38px system-ui"; ctx.fillText("Slipped off!", VW / 2, VH / 2 - 20);
    ctx.font = "20px system-ui";
    ctx.fillText("Score: " + score + "  •  Best: " + best, VW / 2, VH / 2 + 20);
    ctx.fillText("Tap to return to menu", VW / 2, VH / 2 + 60);
  }
}
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
// ?qa=1 self-check: generate 500 layers, assert every layer has >=1 gap.
if (new URLSearchParams(location.search).get("qa") === "1") {
  let ok = true;
  for (let i = 0; i < 500; i++) {
    const L = genLayer(i);
    if (!L.blocks.includes(false)) { ok = false; break; }
  }
  document.title = ok ? "QA PASS: 500/500 layers have a gap" : "QA FAIL: layer without gap";
}
startStage();
requestAnimationFrame(loop);
</script>
</body>
</html>
