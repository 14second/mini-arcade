<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#0e1a2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tower Stacker</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:
      radial-gradient(120% 90% at 50% 0%, #274a75 0%, rgba(39,74,117,0) 55%),
      linear-gradient(180deg, #12263f 0%, #0e1a2e 60%, #081120 100%);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    touch-action:none; user-select:none; -webkit-user-select:none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { position:fixed; inset:0; display:block; touch-action:none; }
  #muteBtn {
    position:fixed; top:10px; right:10px; z-index:10;
    width:48px; height:48px; border-radius:14px;
    border:1.5px solid rgba(170,205,255,.55);
    background:linear-gradient(180deg, rgba(70,110,160,.55), rgba(10,20,38,.65));
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    box-shadow:0 6px 18px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.25);
    color:#fff; font-size:22px; line-height:1; cursor:pointer;
    touch-action:none; user-select:none; -webkit-user-select:none;
    display:flex; align-items:center; justify-content:center; padding:0;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="muteBtn" aria-label="Toggle sound">🔊</button>
<script>
// iOS audio routing: route Web Audio to the media/playback channel (iOS 17+
// Audio Session API) on the first gesture and inside audio init, so sound
// plays even with the silent switch on.
function iosPlaybackSession() {
  try { if ('audioSession' in navigator) navigator.audioSession.type = 'playback'; } catch (e) {}
}
document.addEventListener('pointerdown', iosPlaybackSession, true);
// Sleep in the background (2026-11-09): the wrapper's pauseTimers stops
// JS timers, but the Web Audio graph is a separate engine — suspend the
// audio context whenever the page is hidden so nothing keeps the CPU
// (or the sound) running while the app is in the background.
document.addEventListener("visibilitychange", function () {
  try {
    var c = window.__maCtx;
    if (document.hidden) {
      window.__maHidden = true;
      if (c) {
        if (c.close) { try { var p = c.close(); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
        if (c.suspend && c.state === "running") { try { c.suspend(); } catch (e) {} }
        window.__maCtx = null;
      }
    } else {
      window.__maHidden = false;
      var ac = c || (window.__maActx && window.__maActx());
      if (ac && ac.state === "suspended" && ac.resume) { try { ac.resume(); } catch (e) {} }
    }
  } catch (e) {}
});

document.addEventListener('touchstart', iosPlaybackSession, true);

"use strict";
/* ============================================================
   TOWER STACKER — a block slides back and forth up high.
   Tap (or SPACE) to drop it. Whatever hangs over the edge is
   sliced off and falls. Land it perfectly to keep your width.
   How tall can you build?
   ============================================================ */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1, u = 4;
let blockH = 26, baseY = 0;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  u = Math.min(W, H) / 100;
  blockH = Math.max(20, Math.min(34, u * 6.4));
  baseY = H - Math.max(60, H * 0.1);
}
window.addEventListener("resize", resize);

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

// ---------- Audio ----------
let actx = null, muted = false;
const muteBtn = document.getElementById("muteBtn");
function initAudio() {
  iosPlaybackSession();
  if (!actx || actx.state === "closed") {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) actx = new AC(); window.__maCtx = actx; window.__maActx = function () { return actx; };;
    } catch (e) { actx = null; }
    if (actx) startMusicScheduler();
  }
  if (actx && actx.state === "suspended") actx.resume();
}
function beep(freq, dur, type, vol, slide) {
  if (!actx || muted) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || "square";
  o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t + dur);
  g.gain.setValueAtTime(vol || 0.08, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function sfxDrop(perfect) {
  if (perfect) { beep(880, 0.1, "square", 0.07); setTimeout(() => beep(1174, 0.12, "square", 0.07), 70); }
  else beep(340, 0.08, "square", 0.06, 240);
}
function sfxSlice() { beep(190, 0.16, "sawtooth", 0.05, 90); }
function sfxFall()  { beep(280, 0.4, "sawtooth", 0.08, 50); }

// Sky-high loop, BPM 116. Bass >= MIDI 48.
const BPM = 116, STEP_DUR = 60 / BPM / 2;
const BASS = [
  48,0,0,48, 0,0,55,0, 50,0,0,50, 0,0,57,0,
  53,0,0,53, 0,0,60,0, 55,0,0,50, 0,0, 0,0
];
const LEAD = [
  72,0,74,0, 76,0,0,0, 79,0,76,0, 74,0,0,0,
  77,0,76,0, 74,0,71,0, 72,0,0,0, 0,0,0,0
];
const PADS = [ [60,64,67], [62,66,69], [65,69,72], [55,59,62] ];
let musicStep = 0, nextNoteTime = 0, musicTimer = null;
function midiFreq(m) { return 440 * Math.pow(2, (m - 69) / 12); }
function toneAt(midi, when, dur, type, vol) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(midiFreq(midi), when);
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(vol, when + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(when); o.stop(when + dur + 0.03);
}
function scheduleStep(step, when) {
  if (muted) return;
  const b = BASS[step % 32]; if (b) toneAt(b, when, STEP_DUR * 0.9, "triangle", 0.05);
  const l = LEAD[step % 32]; if (l) toneAt(l, when, STEP_DUR * 0.8, "square", 0.024);
  if (step % 8 === 0) {
    const chord = PADS[Math.floor(step / 8) % PADS.length];
    for (let i = 0; i < chord.length; i++) toneAt(chord[i], when, STEP_DUR * 7.6, "triangle", 0.012);
  }
}
function startMusicScheduler() {
  if (musicTimer !== null || !actx) return;
  musicStep = 0; nextNoteTime = actx.currentTime + 0.06;
  musicTimer = setInterval(function () {
    if (!actx) return;
    if (nextNoteTime < actx.currentTime) nextNoteTime = actx.currentTime + 0.05;
    while (nextNoteTime < actx.currentTime + 0.12) {
      scheduleStep(musicStep, nextNoteTime);
      nextNoteTime += STEP_DUR; musicStep = (musicStep + 1) % 32;
    }
  }, 25);
}
function setMuted(m) { muted = m; muteBtn.textContent = muted ? "🔇" : "🔊"; }
muteBtn.addEventListener("pointerdown", function (e) {
  e.stopPropagation(); e.preventDefault(); initAudio(); setMuted(!muted);
});
muteBtn.addEventListener("click", function (e) { e.stopPropagation(); e.preventDefault(); });

// ---------- Game state ----------
let state = "menu"; // menu | play | over
let best = 0;
try { best = parseInt(localStorage.getItem("towerstacker_best") || "0", 10) || 0; } catch (e) { best = 0; }
let stack = [];      // {x, w, level} placed blocks; level 0 = base platform
let mover = null;    // {x, w, dir, speed}
let debris = [];     // falling sliced pieces {x, w, y, vy, level}
let camY = 0, camTarget = 0, score = 0, perfects = 0;
let flashText = "", flashUntil = 0;

function blockColor(level) {
  const hue = (205 + level * 9) % 360;
  return "hsl(" + hue + ", 72%, " + (52 + (level % 3) * 4) + "%)";
}
function levelY(level) { return baseY - (level + 1) * blockH; } // screen y of a level's top, before camera

function reset() {
  const baseW = Math.min(W * 0.52, 300);
  stack = [{ x: (W - baseW) / 2, w: baseW, level: 0 }];
  debris = [];
  score = 0; perfects = 0;
  camY = 0; camTarget = 0;
  spawnMover();
}
function spawnMover() {
  const top = stack[stack.length - 1];
  const speed = Math.min(330, 145 + stack.length * 7);
  mover = { x: -top.w + 10, w: top.w, dir: 1, speed };
  // Camera: keep the action line (top of stack + one block) at ~52% height.
  const actionY = levelY(stack.length) + camY;
  camTarget += (H * 0.52 - actionY);
}
function drop() {
  if (state !== "play" || !mover) return;
  const top = stack[stack.length - 1];
  const left = Math.max(mover.x, top.x);
  const right = Math.min(mover.x + mover.w, top.x + top.w);
  const overlap = right - left;
  if (overlap <= 0) {
    // Complete miss — the whole block falls.
    debris.push({ x: mover.x, w: mover.w, y: levelY(stack.length), vy: 40, level: stack.length });
    mover = null;
    sfxFall();
    state = "over";
    if (score > best) { best = score; try { localStorage.setItem("towerstacker_best", String(best)); } catch (e) {} }
    return;
  }
  const perfect = Math.abs(mover.x - top.x) < 5;
  const placedX = perfect ? top.x : left;
  const placedW = perfect ? mover.w : overlap;
  if (!perfect) {
    if (mover.x < top.x) debris.push({ x: mover.x, w: mover.w - overlap, y: levelY(stack.length), vy: 30, level: stack.length });
    else debris.push({ x: right, w: (mover.x + mover.w) - right, y: levelY(stack.length), vy: 30, level: stack.length });
    if (overlap < mover.w - 2) sfxSlice();
  }
  stack.push({ x: placedX, w: placedW, level: stack.length });
  score++;
  if (perfect) {
    perfects++;
    score++; // perfect bonus point
    flashText = "PERFECT! +1";
    flashUntil = performance.now() + 800;
    sfxDrop(true);
  } else {
    sfxDrop(false);
  }
  mover = null;
  spawnMover();
}
function startGame() { initAudio(); reset(); state = "play"; }

// ---------- Input ----------
canvas.addEventListener("pointerdown", function (e) {
  initAudio();
  if (state !== "play") { startGame(); return; }
  drop();
});
window.addEventListener("keydown", function (e) {
  initAudio();
  if (e.key === " ") {
    e.preventDefault();
    if (state !== "play") startGame(); else drop();
  }
  if (e.key === "Enter" && state !== "play") startGame();
  if (e.key === "m" || e.key === "M") setMuted(!muted);
});

// ---------- Update / draw ----------
function update(dt) {
  if (mover && state === "play") {
    mover.x += mover.dir * mover.speed * dt;
    if (mover.x + mover.w > W + 30) { mover.x = W + 30 - mover.w; mover.dir = -1; }
    if (mover.x < -30) { mover.x = -30; mover.dir = 1; }
  }
  for (let i = debris.length - 1; i >= 0; i--) {
    const d = debris[i];
    d.vy += 1500 * dt; d.y += d.vy * dt;
    if (d.y > H + 80) debris.splice(i, 1);
  }
  camY += (camTarget - camY) * Math.min(1, dt * 5);
}
function rr2(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function glassPill(x, y, w, h) {
  ctx.save();
  ctx.shadowColor = "rgba(2,6,14,.5)"; ctx.shadowBlur = 10; ctx.shadowOffsetY = 3;
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, "rgba(80,120,175,.5)"); g.addColorStop(1, "rgba(14,26,46,.55)");
  ctx.fillStyle = g;
  rr2(x, y, w, h, h / 2); ctx.fill();
  ctx.restore();
  ctx.lineWidth = 1; ctx.strokeStyle = "rgba(190,220,255,.35)";
  rr2(x, y, w, h, h / 2); ctx.stroke();
}
function drawBlock(x, y, w, level) {
  const hue = (205 + level * 9) % 360;
  const bh = blockH - 2;
  ctx.save();
  ctx.shadowColor = "rgba(2,6,14,.45)"; ctx.shadowBlur = 6; ctx.shadowOffsetY = 3;
  const g = ctx.createLinearGradient(0, y, 0, y + bh);
  g.addColorStop(0, "hsl(" + hue + ", 85%, " + (66 + (level % 3) * 3) + "%)");
  g.addColorStop(0.45, "hsl(" + hue + ", 72%, " + (52 + (level % 3) * 4) + "%)");
  g.addColorStop(1, "hsl(" + hue + ", 68%, " + (40 + (level % 3) * 3) + "%)");
  ctx.fillStyle = g;
  rr2(x, y, w, bh, 4); ctx.fill();
  ctx.restore();
  // glossy top face + window-like sheen + shaded base
  ctx.fillStyle = "rgba(255,255,255,0.38)";
  ctx.fillRect(x + 2, y + 1, Math.max(0, w - 4), 3);
  ctx.fillStyle = "rgba(255,255,255,0.10)";
  ctx.fillRect(x + 3, y + 5, Math.max(0, w - 6), Math.max(0, bh * 0.34));
  ctx.fillStyle = "rgba(0,0,0,0.22)";
  ctx.fillRect(x + 2, y + bh - 4, Math.max(0, w - 4), 3);
  ctx.strokeStyle = "rgba(255,255,255,.22)"; ctx.lineWidth = 1;
  rr2(x + 0.5, y + 0.5, w - 1, bh - 1, 4); ctx.stroke();
}
function draw() {
  // sky — deep layered night gradient
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, "#0a1526"); grad.addColorStop(0.5, "#122a47"); grad.addColorStop(1, "#1d3a5f");
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
  // moon with halo (drifts very slightly against the camera for depth)
  const mx = W * 0.82, my = 92 + (camY * 0.06 % 40);
  const halo = ctx.createRadialGradient(mx, my, 6, mx, my, 90);
  halo.addColorStop(0, "rgba(255,246,210,.5)"); halo.addColorStop(1, "rgba(255,246,210,0)");
  ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(mx, my, 90, 0, Math.PI * 2); ctx.fill();
  const mg = ctx.createRadialGradient(mx - 8, my - 8, 4, mx, my, 30);
  mg.addColorStop(0, "#fffdf0"); mg.addColorStop(1, "#e8dfba");
  ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(mx, my, 27, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(190,180,140,.35)";
  ctx.beginPath(); ctx.arc(mx - 8, my + 5, 5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(mx + 9, my - 9, 3.6, 0, Math.PI * 2); ctx.fill();
  // stars (fixed pattern, scroll slightly with camera for depth)
  for (let i = 0; i < 46; i++) {
    const sx = ((i * 173) % 997) / 997 * W;
    const sy = (((i * 389) % 991) / 991 * H + camY * 0.25) % H;
    ctx.fillStyle = "rgba(255,255,255," + (0.25 + ((i * 37) % 50) / 100) + ")";
    ctx.beginPath(); ctx.arc(sx, sy < 0 ? sy + H : sy, i % 5 === 0 ? 1.8 : 1.1, 0, Math.PI * 2); ctx.fill();
  }
  // distant skyline silhouettes — two parallax layers riding the camera
  ctx.fillStyle = "rgba(70,110,160,.28)";
  for (let i = 0; i < 9; i++) {
    const bw = 46 + (i * 53) % 60, bh = 60 + (i * 97) % 110;
    const bx = ((i * 211) % 997) / 997 * W;
    const by = baseY + camY * 0.92;
    ctx.fillRect(bx, by - bh, bw, bh);
  }
  ctx.fillStyle = "rgba(30,52,84,.55)";
  for (let i = 0; i < 7; i++) {
    const bw = 60 + (i * 71) % 70, bh = 40 + (i * 67) % 80;
    const bx = ((i * 307 + 90) % 997) / 997 * W;
    const by = baseY + camY * 0.97;
    ctx.fillRect(bx, by - bh, bw, bh);
  }
  // ground — gradient slab with a glowing top edge
  const gg = ctx.createLinearGradient(0, baseY + camY, 0, H);
  gg.addColorStop(0, "#13253d"); gg.addColorStop(1, "#060d18");
  ctx.fillStyle = gg;
  ctx.fillRect(0, baseY + camY, W, H - baseY);
  ctx.fillStyle = "#5f96cc";
  ctx.fillRect(0, baseY + camY, W, 3);
  ctx.fillStyle = "rgba(140,190,255,.18)";
  ctx.fillRect(0, baseY + camY + 3, W, 8);
  // stack
  for (const b of stack) drawBlock(b.x, levelY(b.level) + camY, b.w, b.level);
  // guide line under mover
  if (mover && state === "play") {
    const my = levelY(stack.length) + camY;
    ctx.fillStyle = "rgba(255,255,255,0.10)";
    ctx.fillRect(mover.x, my + blockH, mover.w, Math.max(0, baseY + camY - my - blockH));
    drawBlock(mover.x, my, mover.w, stack.length);
  }
  // debris (stored in no-camera space, like levelY)
  for (const d of debris) drawBlock(d.x, d.y + camY, d.w, d.level);
  // HUD — frosted pills
  glassPill(8, 8, 138, 44);
  glassPill(W - 206, 8, 134, 44);
  ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#eaf3ff";
  ctx.font = "bold " + Math.round(u * 5.4) + "px system-ui, sans-serif";
  ctx.fillText("Height " + score, 14, 30);
  ctx.textAlign = "right";
  ctx.fillStyle = "#bcd4f2";
  ctx.fillText("Best " + Math.max(best, score), W - 66, 30);
  if (flashText && performance.now() < flashUntil) {
    ctx.textAlign = "center";
    ctx.save();
    ctx.shadowColor = "rgba(255,200,40,.75)"; ctx.shadowBlur = 16;
    ctx.fillStyle = "#ffd93d";
    ctx.font = "bold " + Math.round(u * 5.6) + "px system-ui, sans-serif";
    ctx.fillText(flashText, W / 2, H * 0.3);
    ctx.restore();
  }
  if (state !== "play") {
    ctx.fillStyle = "rgba(5,10,20,0.64)"; ctx.fillRect(0, 0, W, H);
    const pw = Math.min(W - 28, 560), ph = H * 0.58, px = (W - pw) / 2, py = H * 0.16;
    ctx.save();
    ctx.shadowColor = "rgba(1,4,10,.65)"; ctx.shadowBlur = 34; ctx.shadowOffsetY = 12;
    const pg = ctx.createLinearGradient(0, py, 0, py + ph);
    pg.addColorStop(0, "rgba(38,66,104,.9)"); pg.addColorStop(1, "rgba(10,20,38,.94)");
    ctx.fillStyle = pg;
    rr2(px, py, pw, ph, 24); ctx.fill();
    ctx.restore();
    ctx.lineWidth = 1.5; ctx.strokeStyle = "rgba(170,210,255,.3)";
    rr2(px, py, pw, ph, 24); ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,.12)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(px + 24, py + 1); ctx.lineTo(px + pw - 24, py + 1); ctx.stroke();
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const tg = ctx.createLinearGradient(0, H * 0.28 - u * 5, 0, H * 0.28 + u * 5);
    tg.addColorStop(0, "#ffffff"); tg.addColorStop(0.55, "#bfe0ff"); tg.addColorStop(1, "#5ea9f5");
    ctx.fillStyle = tg;
    ctx.font = "bold " + Math.round(u * 9.5) + "px system-ui, sans-serif";
    ctx.fillText("TOWER STACKER", W / 2, H * 0.28);
    ctx.fillStyle = "#eaf3ff";
    ctx.font = Math.round(u * 4.4) + "px system-ui, sans-serif";
    if (state === "menu") {
      ctx.fillText("A block slides overhead. Tap to drop it.", W / 2, H * 0.40);
      ctx.fillText("Whatever hangs over the edge gets sliced off.", W / 2, H * 0.455);
      ctx.fillStyle = "#ffd93d";
      ctx.fillText("Perfect drops keep your width and score a bonus.", W / 2, H * 0.51);
      ctx.fillStyle = "#9db9dd";
      ctx.fillText("Miss completely and the tower topples.", W / 2, H * 0.565);
    } else {
      ctx.fillText("Tower height: " + score, W / 2, H * 0.42);
      ctx.fillStyle = "#9db9dd";
      ctx.fillText("Perfect drops: " + perfects + " · Best " + best, W / 2, H * 0.475);
    }
    ctx.fillStyle = "#7cc4ff";
    ctx.font = "bold " + Math.round(u * 5) + "px system-ui, sans-serif";
    ctx.fillText(state === "menu" ? "TAP TO START" : "TAP TO PLAY AGAIN", W / 2, H * 0.66);
  }
}

// ---------- Loop ----------
let lastT = 0;
function frame(t) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (t - lastT) / 1000 || 0); lastT = t;
  update(dt);
  draw();
}
resize();
reset();
requestAnimationFrame(frame);
</script>
</body>
</html>
