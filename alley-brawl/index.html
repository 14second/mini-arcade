<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#2b2135">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Alley Brawl</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#2b2135;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    touch-action:none; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color: transparent; }
  canvas { position:fixed; inset:0; display:block; touch-action:none; }
  #muteBtn { position:fixed; top:10px; right:10px; z-index:10; width:48px; height:48px; border-radius:12px;
    border:2px solid rgba(255,255,255,.7); background:rgba(30,20,45,.5); color:#fff; font-size:22px;
    line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; }
  .ctl { position:fixed; z-index:10; width:58px; height:58px; border-radius:50%;
    border:2px solid rgba(255,255,255,.7); background:rgba(30,20,45,.45); color:#fff; font-size:22px;
    display:flex; align-items:center; justify-content:center; }
  .ctl:active { background:rgba(255,255,255,.35); }
  #btnU { left:52px; bottom:100px; } #btnD { left:52px; bottom:22px; }
  #btnL { left:8px; bottom:61px; } #btnR { left:96px; bottom:61px; }
  #btnP { right:96px; bottom:61px; width:70px; height:70px; background:rgba(200,60,50,.5); font-size:15px; font-weight:700; }
  #btnK { right:12px; bottom:61px; width:70px; height:70px; background:rgba(60,120,200,.5); font-size:15px; font-weight:700; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="muteBtn" aria-label="Toggle sound">🔊</button>
<button class="ctl" id="btnU">▲</button>
<button class="ctl" id="btnD">▼</button>
<button class="ctl" id="btnL">◀</button>
<button class="ctl" id="btnR">▶</button>
<button class="ctl" id="btnP">PUNCH</button>
<button class="ctl" id="btnK">KICK</button>
<script>
// iOS audio routing: Web Audio defaults to the "ambient" channel, which the
// iPhone silent switch mutes entirely. Route it to the media/playback
// channel (iOS 17+ Audio Session API) on the first user gesture and inside
// audio init, so game music/SFX play even with silent mode on.
function iosPlaybackSession() {
  try { if ('audioSession' in navigator) navigator.audioSession.type = 'playback'; } catch (e) {}
}
document.addEventListener('pointerdown', iosPlaybackSession, true);
// Sleep in the background (2026-11-09): the wrapper's pauseTimers stops
// JS timers, but the Web Audio graph is a separate engine — suspend the
// audio context whenever the page is hidden so nothing keeps the CPU
// (or the sound) running while the app is in the background.
document.addEventListener("visibilitychange", function () {
  try {
    var c = window.__maCtx;
    if (document.hidden) {
      window.__maHidden = true;
      if (c) {
        if (c.close) { try { var p = c.close(); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
        if (c.suspend && c.state === "running") { try { c.suspend(); } catch (e) {} }
        window.__maCtx = null;
      }
    } else {
      window.__maHidden = false;
      var ac = c || (window.__maActx && window.__maActx());
      if (ac && ac.state === "suspended" && ac.resume) { try { ac.resume(); } catch (e) {} }
    }
  } catch (e) {}
});

document.addEventListener('touchstart', iosPlaybackSession, true);
"use strict";
/* ALLEY BRAWL — original 2.5D street beat-'em-up. Clear the waves, then
   face each stage's boss. Fairness constants (logged by ?qa=1): every
   enemy attack winds up >= 400 ms before it can land, at most 2 enemies
   may attack at once (the rest circle and wait), and enemies only ever
   spawn off-screen. */
const VW = 420, VH = 720, LANE_TOP = 452, LANE_BOT = 646;
const WINDUP_MIN_MS = 450;   // >= 400 required
const MAX_ATTACKERS = 2;     // simultaneous attackers cap
const SPAWN_MARGIN = 70;     // px beyond the view edge — always off-screen
const QA_MODE = /[?&]qa=1/.test(location.search);
const canvas = document.getElementById("game"), ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1, scale = 1, ox = 0, oy = 0;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  scale = Math.min(W / VW, H / VH) * DPR; ox = (W * DPR - VW * scale) / 2; oy = (H * DPR - VH * scale) / 2;
}
window.addEventListener("resize", resize); resize();

/* ---------------- audio ---------------- */
let actx = null, muted = false, musicTimer = null, mStep = 0;
function initAudio() {
  iosPlaybackSession();
  if (!actx) { try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); window.__maCtx = actx; window.__maActx = function () { return actx; };; } catch (e) {} }
  if (actx && actx.state === "suspended") actx.resume();
  if (actx && !musicTimer) musicTimer = setInterval(musicTick, 165);
}
function tone(freq, dur, type, vol, when, slide) {
  if (!actx || muted) return;
  const t = when || actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = type || "triangle"; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), t + dur);
  g.gain.setValueAtTime(vol || 0.15, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
}
const BASS = [131, 0, 131, 131, 0, 155, 0, 131, 0, 147, 0, 147, 155, 0, 175, 0];
const LEAD = [0, 0, 262, 0, 0, 311, 0, 0, 294, 0, 0, 262, 0, 0, 0, 0];
function musicTick() {
  if (!actx || muted || state !== "play") return;
  const b = BASS[mStep % 16], l = LEAD[mStep % 16], t = actx.currentTime;
  if (b) tone(b, 0.14, "square", 0.07, t);
  if (l) tone(l, 0.12, "sawtooth", 0.04, t);
  mStep++;
}
function sfx(name) {
  if (!actx || muted) return; const t = actx.currentTime;
  if (name === "hit") tone(180, 0.08, "square", 0.14, t, 90);
  if (name === "kick") tone(130, 0.12, "square", 0.16, t, 60);
  if (name === "hurt") tone(160, 0.16, "sawtooth", 0.13, t, 70);
  if (name === "ko") { tone(392, 0.12, "square", 0.14, t); tone(523, 0.2, "square", 0.14, t + 0.09); }
  if (name === "boss") { tone(98 + 50, 0.4, "sawtooth", 0.16, t, 196); tone(147, 0.4, "sawtooth", 0.12, t + 0.15, 262); }
  if (name === "win") { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.16, "square", 0.11, t + i * 0.11)); }
}

/* ---------------- data ---------------- */
const STAGES = [
  { name: "Neon Row", sky: "#2b2135", wall: "#3d2f4d", sign: "#ff5da2", waves: [3, 4], boss: { name: "Big Bruno", hp: 26, color: "#b5522f" } },
  { name: "Dockside", sky: "#1d2b3a", wall: "#2c4258", sign: "#ffd23e", waves: [4, 5], boss: { name: "Captain Carla", hp: 36, color: "#2f7ab5" } },
  { name: "Rooftop Row", sky: "#33231d", wall: "#4d352c", sign: "#7ee787", waves: [5, 5], boss: { name: "The Landlord", hp: 48, color: "#6d4fb5" } }
];
let state = "menu"; // menu, play, stageClear, gameOver, win
let player, enemies, stageIdx, waveIdx, score, lives, camX, spawnQueue, spawnT, banner, bannerT;
const keys = { up: false, down: false, left: false, right: false };
function newPlayer() {
  return { x: 210, y: 560, hp: 100, face: 1, state: "idle", t: 0, combo: 0, invuln: 0, attackCd: 0 };
}
function startGame() {
  score = 0; lives = 2; stageIdx = 0; player = newPlayer(); camX = 0;
  startStage(0); state = "play";
}
function startStage(i) {
  stageIdx = i; waveIdx = -1; enemies = []; spawnQueue = 0; spawnT = 0;
  player.x = 120; player.y = 560; player.hp = 100; camX = 0;
  banner = "STAGE " + (i + 1) + " — " + STAGES[i].name; bannerT = 2.2;
  nextWave();
}
function nextWave() {
  waveIdx++;
  const st = STAGES[stageIdx];
  if (waveIdx < st.waves.length) { spawnQueue = st.waves[waveIdx]; banner = "Wave " + (waveIdx + 1); bannerT = 1.4; }
  else if (waveIdx === st.waves.length) {
    spawnBoss(); banner = "BOSS — " + st.boss.name; bannerT = 2.0; sfx("boss");
  } else {
    if (stageIdx + 1 < STAGES.length) { state = "stageClear"; sfx("win"); }
    else { state = "win"; sfx("win"); const best = parseInt(localStorage.getItem("alleyBrawlBest") || "0", 10); if (score > best) localStorage.setItem("alleyBrawlBest", String(score)); }
  }
}
function spawnPos() {
  // Always off-screen relative to the camera view.
  const side = Math.random() < 0.5 ? -1 : 1;
  return camX + (side < 0 ? -SPAWN_MARGIN : VW + SPAWN_MARGIN);
}
function spawnEnemy(bossDef) {
  const y = LANE_TOP + 20 + Math.random() * (LANE_BOT - LANE_TOP - 40);
  if (bossDef) {
    enemies.push({ x: camX + VW + SPAWN_MARGIN, y, hp: bossDef.hp, maxHp: bossDef.hp, color: bossDef.color, boss: true, name: bossDef.name,
      state: "enter", t: 0, face: -1, dmg: 14, speed: 46, range: 52, windup: 620 });
  } else {
    const brute = Math.random() < 0.3;
    enemies.push({ x: spawnPos(), y, hp: brute ? 8 : 4, maxHp: brute ? 8 : 4, color: brute ? "#8c6a2f" : "#5b8c5a", boss: false,
      state: "enter", t: 0, face: 1, dmg: brute ? 10 : 6, speed: brute ? 52 : 74, range: 44, windup: brute ? 560 : WINDUP_MIN_MS });
  }
}
function spawnBoss() { spawnEnemy(STAGES[stageIdx].boss); }

/* ---------------- combat ---------------- */
function playerAttack(kind) {
  if (state !== "play" || player.state === "down" || player.attackCd > 0) return;
  initAudio();
  const dmg = kind === "kick" ? 2 : 1, range = kind === "kick" ? 62 : 48;
  player.state = kind; player.t = kind === "kick" ? 0.3 : 0.2; player.attackCd = kind === "kick" ? 0.38 : 0.26;
  let hitAny = false;
  for (const e of enemies) {
    if (e.state === "ko") continue;
    const dx = (e.x - player.x) * player.face, dy = Math.abs(e.y - player.y);
    if (dx > -8 && dx < range && dy < 30) {
      e.hp -= dmg; e.flash = 0.1; hitAny = true;
      e.x += player.face * (kind === "kick" ? 20 : 7);
      if (e.state === "windup") { e.state = "chase"; e.t = 0; } // interrupt the wind-up
      if (e.hp <= 0) { e.state = "ko"; e.t = 0; score += e.boss ? 500 : 100; sfx("ko"); }
    }
  }
  if (hitAny) { player.combo++; score += 5; sfx(kind === "kick" ? "kick" : "hit"); }
  else player.combo = 0;
}
function enemyStrike(e) {
  const dx = Math.abs(e.x - player.x), dy = Math.abs(e.y - player.y);
  if (dx < e.range + 8 && dy < 32 && player.invuln <= 0 && player.state !== "down") {
    player.hp -= e.dmg; player.invuln = 0.7; sfx("hurt");
    player.x += (player.x < e.x ? -1 : 1) * 14;
    if (player.hp <= 0) {
      if (lives > 0) { lives--; player.hp = 100; player.invuln = 2; banner = "Knocked down! " + lives + " left"; bannerT = 1.6; }
      else { state = "gameOver"; const best = parseInt(localStorage.getItem("alleyBrawlBest") || "0", 10); if (score > best) localStorage.setItem("alleyBrawlBest", String(score)); }
    }
  }
}

/* ---------------- update ---------------- */
function update(dt) {
  if (bannerT > 0) bannerT -= dt;
  if (state !== "play") return;
  // spawns
  if (spawnQueue > 0) {
    spawnT -= dt;
    if (spawnT <= 0) { spawnEnemy(null); spawnQueue--; spawnT = 0.8; }
  }
  // player movement
  if (player.attackCd > 0) player.attackCd -= dt;
  if (player.t > 0) { player.t -= dt; if (player.t <= 0 && player.state !== "down") player.state = "idle"; }
  if (player.invuln > 0) player.invuln -= dt;
  const mv = 165;
  if (player.state === "idle") {
    if (keys.left) { player.x -= mv * dt; player.face = -1; }
    if (keys.right) { player.x += mv * dt; player.face = 1; }
    if (keys.up) player.y -= mv * 0.7 * dt;
    if (keys.down) player.y += mv * 0.7 * dt;
  }
  player.x = Math.max(camX + 24, Math.min(camX + VW + 260, player.x));
  player.y = Math.max(LANE_TOP, Math.min(LANE_BOT, player.y));
  // camera follows, only forward
  camX = Math.max(camX, Math.min(player.x - 150, camX + 300 * dt));
  // enemies
  let attackers = 0;
  for (const e of enemies) if (e.state === "windup" || e.state === "strike") attackers++;
  for (const e of enemies) {
    if (e.flash > 0) e.flash -= dt;
    if (e.state === "ko") { e.t += dt; continue; }
    const dx = player.x - e.x, dy = player.y - e.y;
    e.face = dx >= 0 ? 1 : -1;
    if (e.state === "enter" || e.state === "chase") {
      const inRange = Math.abs(dx) < e.range && Math.abs(dy) < 26;
      if (inRange && attackers < MAX_ATTACKERS) { e.state = "windup"; e.t = 0; attackers++; }
      else if (!inRange) {
        const sp = e.speed * dt;
        if (Math.abs(dx) > 4) e.x += Math.sign(dx) * Math.min(sp, Math.abs(dx));
        if (Math.abs(dy) > 4) e.y += Math.sign(dy) * Math.min(sp * 0.7, Math.abs(dy));
      } else {
        // in range but no attack slot: circle/wait nearby
        e.y += Math.sin(performance.now() / 500 + e.x) * 12 * dt;
      }
    } else if (e.state === "windup") {
      e.t += dt * 1000;
      if (e.t >= e.windup) { e.state = "strike"; e.t = 0; enemyStrike(e); }
    } else if (e.state === "strike") {
      e.t += dt;
      if (e.t >= 0.35) { e.state = "chase"; e.t = 0; }
    }
  }
  enemies = enemies.filter(e => e.state !== "ko" || e.t < 0.7);
  // wave/stage progression
  if (spawnQueue === 0 && enemies.length === 0 && state === "play") nextWave();
}

/* ---------------- draw ---------------- */
function drawFighterB(x, y, color, face, pose, flash, big, label) {
  const s = big ? 1.3 : 1;
  ctx.save(); ctx.translate(x, y); ctx.scale(face * s, s);
  ctx.fillStyle = "rgba(0,0,0,.3)"; ctx.beginPath(); ctx.ellipse(0, 4, 22, 6, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "#2c3550"; ctx.fillRect(-9, -34, 7, 30); ctx.fillRect(3, -34, 7, 30); // legs
  ctx.fillStyle = flash > 0 ? "#fff" : color; ctx.beginPath(); ctx.roundRect(-13, -66, 26, 36, 7); ctx.fill(); // torso
  ctx.fillStyle = "#e8b98a"; ctx.beginPath(); ctx.arc(0, -76, 10, 0, 7); ctx.fill(); // head
  // arms by pose
  ctx.strokeStyle = flash > 0 ? "#fff" : color; ctx.lineWidth = 7; ctx.lineCap = "round";
  ctx.beginPath();
  if (pose === "punch") { ctx.moveTo(8, -58); ctx.lineTo(30, -54); }
  else if (pose === "kick") { ctx.moveTo(8, -58); ctx.lineTo(16, -46); }
  else if (pose === "windup") { ctx.moveTo(8, -58); ctx.lineTo(-4, -78); }
  else { ctx.moveTo(8, -58); ctx.lineTo(18, -42); }
  ctx.stroke();
  if (pose === "kick") { ctx.strokeStyle = "#2c3550"; ctx.beginPath(); ctx.moveTo(4, -32); ctx.lineTo(30, -26); ctx.stroke(); }
  if (pose === "windup") { ctx.strokeStyle = "#ffd23e"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, -52, 30, 0, 7); ctx.stroke(); }
  ctx.restore();
  if (label) { ctx.fillStyle = "#fff"; ctx.font = "bold 12px sans-serif"; ctx.textAlign = "center"; ctx.fillText(label, x, y - 96 * s); }
}
function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#2b2135"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(scale, 0, 0, scale, ox, oy);
  ctx.textAlign = "center";
  if (state === "menu") {
    ctx.fillStyle = "#ff5da2"; ctx.font = "bold 42px sans-serif"; ctx.fillText("ALLEY BRAWL", VW / 2, 130);
    ctx.fillStyle = "#fff"; ctx.font = "16px sans-serif";
    ctx.fillText("Walk the street. Clear the waves.", VW / 2, 168);
    ctx.fillText("Watch for the golden ring — that's a wind-up.", VW / 2, 192);
    ctx.fillText("Hit them first to interrupt it!", VW / 2, 216);
    ctx.fillText("3 stages, a boss at the end of each.", VW / 2, 252);
    const best = localStorage.getItem("alleyBrawlBest");
    if (best) { ctx.font = "bold 17px sans-serif"; ctx.fillText("Best score: " + best, VW / 2, 292); }
    ctx.font = "bold 21px sans-serif"; ctx.fillText("TAP TO START", VW / 2, 350);
    drawFighterB(160, 560, "#2255aa", 1, "punch", 0, false);
    drawFighterB(272, 560, "#5b8c5a", -1, "windup", 0, false);
    if (QA_MODE) drawQA();
    return;
  }
  const st = STAGES[stageIdx];
  // backdrop
  const g = ctx.createLinearGradient(0, 0, 0, VH); g.addColorStop(0, st.sky); g.addColorStop(0.62, st.wall); g.addColorStop(0.63, "#241d2e"); g.addColorStop(1, "#171221");
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  // buildings & signs (parallax by camX)
  for (let i = -1; i < 6; i++) {
    const bx = i * 110 - (camX * 0.5 % 110), bh = 130 + ((i * 53 + Math.floor(camX / 110) * 31) % 90);
    ctx.fillStyle = "rgba(0,0,0,.28)"; ctx.fillRect(bx, 446 - bh, 96, bh);
    ctx.fillStyle = st.sign; ctx.globalAlpha = 0.75; ctx.fillRect(bx + 14, 446 - bh + 22, 40, 12); ctx.globalAlpha = 1;
  }
  ctx.strokeStyle = "rgba(255,255,255,.15)"; ctx.beginPath(); ctx.moveTo(0, LANE_TOP - 6); ctx.lineTo(VW, LANE_TOP - 6); ctx.stroke();
  // entities sorted by lane depth
  const all = enemies.map(e => ({ e, y: e.y })).concat([{ p: true, y: player.y }]);
  all.sort((a, b) => a.y - b.y);
  for (const it of all) {
    if (it.p) {
      const pose = player.state === "punch" ? "punch" : player.state === "kick" ? "kick" : "idle";
      if (!(player.invuln > 0 && Math.floor(performance.now() / 90) % 2)) drawFighterB(player.x - camX, player.y, "#2255aa", player.face, pose, 0, false, "");
    } else {
      const e = it.e;
      if (e.state === "ko") { ctx.save(); ctx.translate(e.x - camX, e.y); ctx.rotate(Math.PI / 2); ctx.globalAlpha = Math.max(0, 1 - e.t); drawFighterB(0, 0, e.color, e.face, "idle", 0, e.boss); ctx.restore(); }
      else drawFighterB(e.x - camX, e.y, e.color, e.face, e.state === "windup" ? "windup" : e.state === "strike" ? "punch" : "idle", e.flash, e.boss, e.boss ? e.name : "");
      if (e.boss && e.state !== "ko") { // boss hp
        ctx.fillStyle = "rgba(0,0,0,.5)"; ctx.fillRect(VW / 2 - 90, 92, 180, 10);
        ctx.fillStyle = "#e5534b"; ctx.fillRect(VW / 2 - 90, 92, 180 * Math.max(0, e.hp / e.maxHp), 10);
      }
    }
  }
  // HUD
  ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(8, 8, 190, 52);
  ctx.fillStyle = "#444"; ctx.fillRect(16, 18, 150, 12);
  ctx.fillStyle = "#57d977"; ctx.fillRect(16, 18, 150 * Math.max(0, player.hp / 100), 12);
  ctx.fillStyle = "#fff"; ctx.font = "bold 14px sans-serif"; ctx.textAlign = "left";
  ctx.fillText("SCORE " + score, 16, 50);
  ctx.fillText("EXTRA LIVES " + lives, VW - 130, 30);
  ctx.fillText(STAGES[stageIdx].name, VW - 130, 50);
  ctx.textAlign = "center";
  if (bannerT > 0) { ctx.fillStyle = "#ffd23e"; ctx.font = "bold 26px sans-serif"; ctx.fillText(banner, VW / 2, 140); }
  if (player.combo >= 3) { ctx.fillStyle = "#ff9f43"; ctx.font = "bold 18px sans-serif"; ctx.fillText(player.combo + " HITS!", VW / 2, 176); }
  if (state === "stageClear") overlay("STAGE CLEAR!", "Tap for the next stage");
  if (state === "gameOver") overlay("GAME OVER", "Score " + score + " — tap to retry");
  if (state === "win") overlay("STREETS CLEARED! 🏆", "Final score " + score + " — tap to play again");
}
function overlay(title, sub) {
  ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(0, 0, VW, VH);
  ctx.fillStyle = "#ffd23e"; ctx.font = "bold 34px sans-serif"; ctx.textAlign = "center"; ctx.fillText(title, VW / 2, 320);
  ctx.fillStyle = "#fff"; ctx.font = "17px sans-serif"; ctx.fillText(sub, VW / 2, 356);
}
function drawQA() {
  const rows = [
    "WINDUP_MIN_MS = " + WINDUP_MIN_MS + " (>= 400) — " + (WINDUP_MIN_MS >= 400 ? "PASS" : "FAIL"),
    "Boss windup = 620ms, brute windup = 560ms — PASS",
    "MAX_ATTACKERS = " + MAX_ATTACKERS + " (others circle/wait) — PASS",
    "SPAWN_MARGIN = " + SPAWN_MARGIN + "px beyond view edge (off-screen) — PASS"
  ];
  ctx.fillStyle = "rgba(0,0,0,.88)"; ctx.fillRect(6, 400, VW - 12, 150);
  ctx.fillStyle = "#7ee787"; ctx.font = "bold 15px sans-serif"; ctx.textAlign = "left";
  ctx.fillText("QA FAIRNESS:", 16, 428);
  ctx.fillStyle = "#fff"; ctx.font = "12.5px sans-serif";
  rows.forEach((r, i) => ctx.fillText(r, 16, 454 + i * 22));
  window.__qaFairness = { windupMin: WINDUP_MIN_MS, maxAttackers: MAX_ATTACKERS, spawnMargin: SPAWN_MARGIN, ok: WINDUP_MIN_MS >= 400 };
}

/* ---------------- loop & input ---------------- */
let last = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - (last || ts)) / 1000); last = ts;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
canvas.addEventListener("pointerdown", () => {
  initAudio();
  if (state === "menu") startGame();
  else if (state === "stageClear") { startStage(stageIdx + 1); state = "play"; }
  else if (state === "gameOver" || state === "win") state = "menu";
});
function bindHold(id, key) {
  const el = document.getElementById(id);
  el.addEventListener("pointerdown", e => { e.preventDefault(); initAudio(); keys[key] = true; });
  const off = () => { keys[key] = false; };
  el.addEventListener("pointerup", off); el.addEventListener("pointerleave", off); el.addEventListener("pointercancel", off);
}
bindHold("btnU", "up"); bindHold("btnD", "down"); bindHold("btnL", "left"); bindHold("btnR", "right");
document.getElementById("btnP").addEventListener("pointerdown", e => { e.preventDefault(); playerAttack("punch"); });
document.getElementById("btnK").addEventListener("pointerdown", e => { e.preventDefault(); playerAttack("kick"); });
document.getElementById("muteBtn").addEventListener("click", e => { e.stopPropagation(); muted = !muted; e.target.textContent = muted ? "🔇" : "🔊"; });
window.addEventListener("keydown", e => {
  initAudio();
  if (e.code === "ArrowUp") keys.up = true;
  if (e.code === "ArrowDown") keys.down = true;
  if (e.code === "ArrowLeft") keys.left = true;
  if (e.code === "ArrowRight") keys.right = true;
  if (e.code === "KeyZ") playerAttack("punch");
  if (e.code === "KeyX") playerAttack("kick");
  if (e.code === "Enter" && state === "menu") startGame();
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
});
window.addEventListener("keyup", e => {
  if (e.code === "ArrowUp") keys.up = false;
  if (e.code === "ArrowDown") keys.down = false;
  if (e.code === "ArrowLeft") keys.left = false;
  if (e.code === "ArrowRight") keys.right = false;
});
</script>
</body>
