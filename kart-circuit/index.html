<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#17351b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kart Circuit</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#17351b;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    touch-action:none; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color: transparent; }
  canvas { position:fixed; inset:0; display:block; touch-action:none; }
  #muteBtn { position:fixed; top:10px; right:10px; z-index:10; width:48px; height:48px; border-radius:12px;
    border:2px solid rgba(255,255,255,.7); background:rgba(12,40,16,.55); color:#fff; font-size:22px;
    line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; }
  #pad { position:fixed; left:0; right:0; bottom:0; z-index:10; display:flex; justify-content:space-between; align-items:center;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom)); }
  .cluster { display:flex; gap:10px; }
  #pad button { width:64px; height:60px; border-radius:16px; border:2px solid rgba(255,255,255,.45);
    background:rgba(20,55,25,.78); color:#fff; font-size:23px; cursor:pointer; padding:0; }
  #pad button:active { background:rgba(50,110,55,.9); }
  #itemBtn { width:76px; background:rgba(110,80,10,.85); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="muteBtn" aria-label="Toggle sound">🔊</button>
<div id="pad">
  <div class="cluster">
    <button id="bL" aria-label="Steer left">◀</button>
    <button id="bR" aria-label="Steer right">▶</button>
  </div>
  <button id="itemBtn" aria-label="Use item">★</button>
  <div class="cluster">
    <button id="bBrake" aria-label="Brake">▼</button>
  </div>
</div>
<script>
// iOS audio routing: Web Audio defaults to the "ambient" channel, which the
// iPhone silent switch mutes entirely. Route it to the media/playback
// channel (iOS 17+ Audio Session API) on the first user gesture and inside
// audio init, so game music/SFX play even with silent mode on.
function iosPlaybackSession() {
  try { if ('audioSession' in navigator) navigator.audioSession.type = 'playback'; } catch (e) {}
}
document.addEventListener('pointerdown', iosPlaybackSession, true);
// Sleep in the background (2026-11-09): the wrapper's pauseTimers stops
// JS timers, but the Web Audio graph is a separate engine — suspend the
// audio context whenever the page is hidden so nothing keeps the CPU
// (or the sound) running while the app is in the background.
document.addEventListener("visibilitychange", function () {
  try {
    var c = window.__maCtx;
    if (document.hidden) {
      window.__maHidden = true;
      if (c) {
        if (c.close) { try { var p = c.close(); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
        if (c.suspend && c.state === "running") { try { c.suspend(); } catch (e) {} }
        window.__maCtx = null;
      }
    } else {
      window.__maHidden = false;
      var ac = c || (window.__maActx && window.__maActx());
      if (ac && ac.state === "suspended" && ac.resume) { try { ac.resume(); } catch (e) {} }
    }
  } catch (e) {}
});

document.addEventListener('touchstart', iosPlaybackSession, true);
"use strict";
/* KART CIRCUIT — original top-down kart racing. Three closed-loop
   tracks, three laps, three rival karts on racing lines, and item
   boxes that hand out a boost or a shield.
   Fairness (verified by the ?qa=1 self-check): the track is 92 px wide
   everywhere vs a 22 px kart (4.2x, floor 2.2x), and rival top speed —
   even fully rubber-banded — is capped at or below the player's. */
const VW = 420, VH = 720;
const QA_MODE = /[?&]qa=1/.test(location.search);
const canvas = document.getElementById("game"), ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1, scale = 1, ox = 0, oy = 0;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  scale = Math.min(W / VW, H / VH) * DPR; ox = (W * DPR - VW * scale) / 2; oy = (H * DPR - VH * scale) / 2;
}
window.addEventListener("resize", resize); resize();

/* ---------------- audio ---------------- */
let actx = null, muted = false, musicTimer = null, mStep = 0;
function initAudio() {
  iosPlaybackSession();
  if (!actx || actx.state === "closed") { try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); window.__maCtx = actx; window.__maActx = function () { return actx; };; } catch (e) {} }
  if (actx && actx.state === "suspended") actx.resume();
  if (actx && !musicTimer) musicTimer = setInterval(musicTick, 185);
}
function tone(freq, dur, type, vol, when, slide) {
  if (!actx || muted) return;
  const t = when || actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = type || "triangle"; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), t + dur);
  g.gain.setValueAtTime(vol || 0.15, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
}
const BASS = [131, 0, 0, 131, 0, 0, 147, 0, 0, 147, 0, 0, 165, 0, 147, 0];
const LEAD = [0, 784, 0, 0, 880, 0, 0, 0, 988, 0, 880, 0, 784, 0, 659, 0];
function musicTick() {
  if (!actx || muted || state !== "play") return;
  const b = BASS[mStep % 16], l = LEAD[mStep % 16], t = actx.currentTime;
  if (b) tone(b, 0.15, "triangle", 0.12, t);
  if (l) tone(l, 0.11, "triangle", 0.05, t);
  mStep++;
}
function sfx(name) {
  if (!actx || muted) return; const t = actx.currentTime;
  if (name === "go") { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.13, "square", 0.11, t + i * 0.09)); }
  if (name === "count") tone(440, 0.1, "square", 0.1, t);
  if (name === "item") { tone(880, 0.08, "triangle", 0.12, t); tone(1319, 0.1, "triangle", 0.1, t + 0.06); }
  if (name === "boost") tone(300, 0.35, "sawtooth", 0.07, t, 900);
  if (name === "bump") tone(150, 0.1, "square", 0.12, t, 90);
  if (name === "lap") { [659, 880].forEach((f, i) => tone(f, 0.11, "triangle", 0.11, t + i * 0.08)); }
  if (name === "win") { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, 0.15, "square", 0.11, t + i * 0.11)); }
}

/* ---------------- tracks ---------------- */
const TRACK_W = 92, KART_W = 22, SAMPLES = 260;
const MAXV = 252, RIVAL_MAX_FACTOR = 0.985; // rivals can never out-top-speed the player
const TRACKS = [
  { name: "Meadow Loop", a1: 26, a2: 12, p1: 0.4, p2: 2.1, base: 205 },
  { name: "Serpentine", a1: 14, a2: 34, p1: 1.7, p2: 0.6, base: 200 },
  { name: "Figure Eight-ish", a1: 40, a2: 20, p1: 2.9, p2: 4.2, base: 198 }
];
function buildLine(tr) {
  const pts = [];
  for (let i = 0; i < SAMPLES; i++) {
    const th = i / SAMPLES * Math.PI * 2;
    const r = tr.base + tr.a1 * Math.sin(2 * th + tr.p1) + tr.a2 * Math.sin(3 * th + tr.p2);
    pts.push({ x: 210 + Math.cos(th) * r * 0.68, y: 388 + Math.sin(th) * r * 1.14 });
  }
  return pts;
}
let state = "menu", line, trackIdx, karts, player, items, raceT, countT, lapsDone, lastT, finishedCount;
let steerL, steerR, braking;
let records = JSON.parse(localStorage.getItem("kartcircuit_best") || "{}");
function nearestIdx(k, hint) {
  let bestI = hint, bestD = 1e12;
  for (let o = -30; o <= 30; o++) {
    const i = (hint + o + SAMPLES) % SAMPLES;
    const d = (line[i].x - k.x) ** 2 + (line[i].y - k.y) ** 2;
    if (d < bestD) { bestD = d; bestI = i; }
  }
  return { i: bestI, d: Math.sqrt(bestD) };
}
function startGame(ti) {
  trackIdx = ti || 0;
  line = buildLine(TRACKS[trackIdx]);
  const mk = (idx, color, isPlayer, factor, lat) => {
    const p = line[idx], q = line[(idx + 2) % SAMPLES];
    return { x: p.x + lat, y: p.y, ang: Math.atan2(q.y - p.y, q.x - p.x), v: 0, color, isPlayer: !!isPlayer,
      factor: factor || 1, near: idx, prog: 0, lap: 1, item: null, boostT: 0, shield: false, spinT: 0, finished: false, finishT: 0, bestLap: 0, lapT: 0 };
  };
  player = mk(0, "#e84a4a", true, 1, -16);
  karts = [player,
    mk(SAMPLES - 4, "#3fa7e8", false, 0.955, 14),
    mk(SAMPLES - 8, "#39d353", false, 0.94, -14),
    mk(SAMPLES - 12, "#f2b838", false, 0.925, 16)];
  items = [];
  [40, 105, 170, 225].forEach((si, i) => {
    const p = line[si];
    items.push({ x: p.x + (i % 2 ? 20 : -20), y: p.y, taken: false, respawn: 0 });
  });
  raceT = 0; countT = 3200; lapsDone = 0; finishedCount = 0;
  state = "play"; initAudio();
}
function step(dtms) {
  if (state !== "play") return;
  const dt = Math.min(0.04, dtms / 1000);
  if (countT > 0) { countT -= dtms; if (Math.ceil(countT / 800) !== Math.ceil((countT + dtms) / 800)) sfx("count"); if (countT <= 0) sfx("go"); return; }
  raceT += dt;
  for (const k of karts) {
    if (k.finished) continue;
    k.lapT += dt;
    const near = nearestIdx(k, k.near);
    let delta = near.i - k.near;
    if (delta > SAMPLES / 2) delta -= SAMPLES; if (delta < -SAMPLES / 2) delta += SAMPLES;
    k.prog += delta; k.near = near.i;
    const totalProg = (k.lap - 1) * SAMPLES + k.prog;
    if (k.prog >= SAMPLES) {
      k.prog -= SAMPLES; k.lap++;
      if (!k.bestLap || k.lapT < k.bestLap) k.bestLap = k.lapT;
      k.lapT = 0;
      if (k.isPlayer) { sfx("lap"); if (k.lap > 3) finishKart(k); }
      else if (k.lap > 3) finishKart(k);
    }
    const offTrack = near.d > TRACK_W / 2 - 6;
    let top = MAXV * (k.factor || 1);
    if (!k.isPlayer) {
      // rubber band, capped so rivals never exceed the player's top speed
      const gap = totalProg - ((player.lap - 1) * SAMPLES + player.prog);
      let f = k.factor + (gap < -160 ? 0.03 : gap > 160 ? -0.03 : 0);
      top = MAXV * Math.min(RIVAL_MAX_FACTOR, Math.max(0.88, f));
    }
    if (k.boostT > 0) { k.boostT -= dt; top *= 1.45; }
    if (offTrack) top *= 0.45;
    if (k.spinT > 0) { k.spinT -= dt; top = 0; k.ang += 9 * dt; }
    const accel = k.isPlayer ? (braking ? -340 : 150) : 150;
    k.v += accel * dt;
    const dragK = offTrack ? 1.6 : 0.55;
    k.v -= k.v * dragK * dt;
    if (k.v > top) k.v = Math.max(top, k.v - 260 * dt);
    if (k.v < 0) k.v = 0;
    if (k.isPlayer) {
      const steer = (steerL ? -1 : 0) + (steerR ? 1 : 0);
      k.ang += steer * 2.5 * dt * Math.min(1, k.v / 120 + 0.25) * (k.v >= 0 ? 1 : -1);
    } else {
      const target = line[(k.near + 9) % SAMPLES];
      const want = Math.atan2(target.y - k.y, target.x - k.x);
      let da = want - k.ang;
      while (da > Math.PI) da -= 2 * Math.PI; while (da < -Math.PI) da += 2 * Math.PI;
      k.ang += Math.max(-2.4 * dt, Math.min(2.4 * dt, da * 4 * dt));
    }
    k.x += Math.cos(k.ang) * k.v * dt;
    k.y += Math.sin(k.ang) * k.v * dt;
    k.x = Math.max(14, Math.min(VW - 14, k.x)); k.y = Math.max(60, Math.min(VH - 90, k.y));
    // item boxes
    if (k.isPlayer) for (const it of items) {
      if (!it.taken && Math.hypot(it.x - k.x, it.y - k.y) < 24 && !k.item) {
        it.taken = true; it.respawn = 6000;
        k.item = Math.random() < 0.55 ? "boost" : "shield";
        sfx("item");
      }
    }
  }
  for (const it of items) if (it.taken) { it.respawn -= dtms; if (it.respawn <= 0) it.taken = false; }
  // kart-kart bumps
  for (let i = 0; i < karts.length; i++) for (let j = i + 1; j < karts.length; j++) {
    const a = karts[i], b = karts[j];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (d < 24 && d > 0.01) {
      const nx = (a.x - b.x) / d, ny = (a.y - b.y) / d, push = (24 - d) / 2;
      a.x += nx * push; a.y += ny * push; b.x -= nx * push; b.y -= ny * push;
      const slower = a.v < b.v ? a : b;
      if (Math.abs(a.v - b.v) > 40) {
        if (slower.shield) { slower.shield = false; sfx("item"); }
        else if (slower.spinT <= 0 && (slower.isPlayer || Math.random() < 0.7)) { slower.spinT = 0.8; slower.v *= 0.3; if (slower.isPlayer) sfx("bump"); }
      }
    }
  }
}
function finishKart(k) {
  k.finished = true; k.finishT = raceT; finishedCount++;
  if (k.isPlayer) {
    state = "over"; sfx("win");
    const key = "t" + trackIdx;
    const pos = karts.filter(o => o.finished && o.finishT <= k.finishT).length;
    player.finalPos = pos;
    if (!records[key] || raceT < records[key].total) {
      records[key] = { total: Math.round(raceT * 10) / 10, lap: Math.round((player.bestLap || 0) * 10) / 10 };
      localStorage.setItem("kartcircuit_best", JSON.stringify(records));
    }
  }
}
function useItem() {
  if (state !== "play" || !player || !player.item) return;
  if (player.item === "boost") { player.boostT = 2.4; sfx("boost"); }
  if (player.item === "shield") { player.shield = true; sfx("item"); }
  player.item = null;
}
function racePosition() {
  const scoreOf = k => (k.finished ? 1e9 - k.finishT : (k.lap - 1) * SAMPLES + k.prog);
  return karts.slice().sort((a, b) => scoreOf(b) - scoreOf(a)).indexOf(player) + 1;
}

/* ---------------- fairness / QA self-check ---------------- */
function fairnessCheck() {
  const widthOk = TRACK_W >= 2.2 * KART_W;
  // width holds at the tightest centerline curvature: check min distance
  // between non-adjacent line points stays > KART_W (no self-pinch) — use
  // each track's sampled geometry.
  let minGap = 1e9;
  for (const tr of TRACKS) {
    const L = buildLine(tr);
    for (let i = 0; i < SAMPLES; i += 4) for (let j = i + 20; j < SAMPLES; j += 4) {
      const d = Math.hypot(L[i].x - L[j].x, L[i].y - L[j].y);
      if (d < minGap) minGap = d;
    }
  }
  const rivalCapOk = RIVAL_MAX_FACTOR <= 1.0;
  const r = { game: "kart-circuit", trackW: TRACK_W, kartW: KART_W, widthRatio: Math.round(TRACK_W / KART_W * 10) / 10,
    minCenterlineGapPx: Math.round(minGap), rivalMaxFactor: RIVAL_MAX_FACTOR,
    pass: widthOk && rivalCapOk && minGap > KART_W };
  window.__qaFairness = r; return r;
}

/* ---------------- draw ---------------- */
function drawKart(k) {
  ctx.save(); ctx.translate(k.x, k.y); ctx.rotate(k.ang);
  if (k.shield) { ctx.strokeStyle = "rgba(120,220,255,.8)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, 19, 0, 7); ctx.stroke(); }
  ctx.fillStyle = "#22222c"; ctx.fillRect(-13, -13, 9, 6); ctx.fillRect(-13, 7, 9, 6); ctx.fillRect(5, -13, 9, 6); ctx.fillRect(5, 7, 9, 6);
  ctx.fillStyle = k.color; ctx.beginPath();
  ctx.moveTo(15, 0); ctx.lineTo(6, -9); ctx.lineTo(-12, -9); ctx.lineTo(-14, 0); ctx.lineTo(-12, 9); ctx.lineTo(6, 9); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(-1, 0, 5.5, 0, 7); ctx.fill();
  ctx.restore();
}
function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#0f2c13"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(scale, 0, 0, scale, ox, oy);
  ctx.fillStyle = "#2c7a35"; ctx.fillRect(0, 0, VW, VH);
  if (line) {
    ctx.lineJoin = "round"; ctx.lineCap = "round";
    ctx.strokeStyle = "#e8e8e8"; ctx.lineWidth = TRACK_W + 10;
    ctx.beginPath(); line.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.closePath(); ctx.stroke();
    ctx.strokeStyle = "#4a4a55"; ctx.lineWidth = TRACK_W;
    ctx.beginPath(); line.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.closePath(); ctx.stroke();
    // start line
    const s0 = line[0], s1 = line[4];
    const ang = Math.atan2(s1.y - s0.y, s1.x - s0.x) + Math.PI / 2;
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(s0.x - Math.cos(ang) * TRACK_W / 2, s0.y - Math.sin(ang) * TRACK_W / 2);
    ctx.lineTo(s0.x + Math.cos(ang) * TRACK_W / 2, s0.y + Math.sin(ang) * TRACK_W / 2); ctx.stroke();
    for (const it of items) if (!it.taken) {
      ctx.fillStyle = "#ffd94a"; ctx.fillRect(it.x - 10, it.y - 10, 20, 20);
      ctx.fillStyle = "#7a5b00"; ctx.font = "800 15px system-ui"; ctx.textAlign = "center"; ctx.fillText("?", it.x, it.y + 6);
    }
    for (const k of karts) drawKart(k);
  }
  // HUD
  ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(0, 0, VW, 60);
  ctx.fillStyle = "#fff"; ctx.font = "700 19px system-ui"; ctx.textAlign = "left";
  if (state === "play" || state === "over") {
    ctx.fillText("LAP " + Math.min(3, player.lap) + "/3 · POS " + racePosition() + "/4", 14, 27);
    ctx.font = "600 14px system-ui"; ctx.fillStyle = "#d8f2da";
    ctx.fillText("⏱ " + raceT.toFixed(1) + "s   ITEM: " + (player.item ? (player.item === "boost" ? "🚀 BOOST" : "🛡 SHIELD") : player.shield ? "🛡 ACTIVE" : "—"), 14, 50);
  } else {
    ctx.fillText("KART CIRCUIT", 14, 36);
  }
  if (state === "play" && countT > 0) {
    ctx.fillStyle = "#ffd94a"; ctx.font = "800 74px system-ui"; ctx.textAlign = "center";
    ctx.fillText(countT > 400 ? Math.ceil(countT / 800) : "GO!", VW / 2, 300);
  }
  if (state === "menu") {
    ctx.fillStyle = "rgba(6,22,8,.86)"; ctx.fillRect(0, 150, VW, 400);
    ctx.fillStyle = "#fff"; ctx.font = "700 32px system-ui"; ctx.textAlign = "center";
    ctx.fillText("KART CIRCUIT", VW / 2, 210);
    ctx.font = "400 15px system-ui"; ctx.fillStyle = "#d2ecd6";
    ctx.fillText("Auto-gas racing: steer, brake for corners,", VW / 2, 240);
    ctx.fillText("grab ? boxes, ★ uses your item. 3 laps.", VW / 2, 262);
    TRACKS.forEach((t, i) => {
      const y = 306 + i * 62;
      ctx.fillStyle = "#1d5c2a"; ctx.fillRect(70, y - 24, 280, 44);
      ctx.fillStyle = "#fff"; ctx.font = "700 17px system-ui";
      ctx.fillText(t.name, VW / 2, y - 1);
      ctx.font = "400 12px system-ui"; ctx.fillStyle = "#a8d8ae";
      const rec = records["t" + i];
      ctx.fillText(rec ? "Best " + rec.total + "s · lap " + rec.lap + "s" : "No record yet", VW / 2, y + 15);
    });
  }
  if (state === "over") {
    ctx.fillStyle = "rgba(6,22,8,.88)"; ctx.fillRect(0, 210, VW, 240);
    ctx.fillStyle = "#fff"; ctx.font = "700 30px system-ui"; ctx.textAlign = "center";
    ctx.fillText("FINISH — " + ["", "1st! 🏆", "2nd", "3rd", "4th"][player.finalPos || 4], VW / 2, 272);
    ctx.font = "400 17px system-ui"; ctx.fillStyle = "#d2ecd6";
    ctx.fillText(TRACKS[trackIdx].name + " · " + raceT.toFixed(1) + "s", VW / 2, 308);
    ctx.fillText("Best lap " + (player.bestLap ? player.bestLap.toFixed(1) + "s" : "—"), VW / 2, 336);
    ctx.fillStyle = "#ffd94a"; ctx.font = "700 20px system-ui";
    ctx.fillText("TAP FOR MENU", VW / 2, 400);
  }
  if (QA_MODE) {
    const f = fairnessCheck();
    ctx.fillStyle = "rgba(0,0,0,.65)"; ctx.fillRect(0, VH - 30, VW, 30);
    ctx.fillStyle = f.pass ? "#7dff8a" : "#ff7d7d"; ctx.font = "600 12px monospace"; ctx.textAlign = "left";
    ctx.fillText("QA kart pass=" + f.pass + " width=" + f.widthRatio + "x gap=" + f.minCenterlineGapPx + " rivalCap=" + f.rivalMaxFactor, 8, VH - 10);
  }
}
function frame(t) {
  const dt = Math.min(50, t - (lastT || t)); lastT = t;
  if (state === "play") step(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------------- input ---------------- */
function bindHold(id, fn) {
  const el = document.getElementById(id);
  el.addEventListener("pointerdown", e => { e.preventDefault(); initAudio(); fn(true); });
  const off = () => fn(false);
  el.addEventListener("pointerup", off); el.addEventListener("pointerleave", off); el.addEventListener("pointercancel", off);
}
bindHold("bL", v => steerL = v); bindHold("bR", v => steerR = v); bindHold("bBrake", v => braking = v);
document.getElementById("itemBtn").addEventListener("pointerdown", e => { e.preventDefault(); initAudio(); useItem(); });
canvas.addEventListener("pointerdown", e => {
  initAudio();
  if (state === "menu") {
    const r = canvas.getBoundingClientRect();
    const ly = (e.clientY - r.top) * (VH / r.height);
    TRACKS.forEach((t, i) => { if (Math.abs(ly - (306 + i * 62)) < 26) startGame(i); });
  } else if (state === "over") state = "menu";
});
window.addEventListener("keydown", e => {
  if (e.code === "ArrowLeft") steerL = true;
  else if (e.code === "ArrowRight") steerR = true;
  else if (e.code === "ArrowDown") braking = true;
  else if (e.code === "Space") { e.preventDefault(); if (state === "play") useItem(); else startGame(0); }
});
window.addEventListener("keyup", e => {
  if (e.code === "ArrowLeft") steerL = false;
  if (e.code === "ArrowRight") steerR = false;
  if (e.code === "ArrowDown") braking = false;
});
const muteBtn = document.getElementById("muteBtn");
function syncMute() { muteBtn.textContent = muted ? "🔇" : "🔊"; }
muteBtn.addEventListener("click", e => { e.stopPropagation(); muted = !muted; localStorage.setItem("kartcircuit_muted", muted ? 1 : 0); syncMute(); });
muted = localStorage.getItem("kartcircuit_muted") === "1"; syncMute();
line = buildLine(TRACKS[0]); trackIdx = 0;
player = { lap: 1, prog: 0, item: null, shield: false, finished: false, x: 0, y: 0 }; karts = [player]; items = [];
if (QA_MODE) fairnessCheck();
</script>
