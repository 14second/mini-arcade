<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0b18">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pixel Racer</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:#070712;
    font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    touch-action:none; user-select:none; -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent; color:#fff;
  }
  canvas { position:fixed; inset:0; display:block; touch-action:none; }
  #muteBtn {
    position:fixed; top:10px; right:10px; z-index:10;
    width:46px; height:46px; border-radius:12px;
    border:2px solid rgba(255,255,255,.35); background:rgba(10,10,25,.65);
    color:#fff; font-size:22px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    touch-action:none; user-select:none; -webkit-user-select:none;
  }
  #muteBtn:active { background:rgba(60,60,110,.8); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="muteBtn" aria-label="Mute">🔊</button>
<script>
// iOS audio routing: Web Audio defaults to the "ambient" channel, which the
// iPhone silent switch mutes entirely. Route it to the media/playback
// channel (iOS 17+ Audio Session API) on the first user gesture and inside
// audio init, so game music/SFX play even with silent mode on.
function iosPlaybackSession() {
  try { if ('audioSession' in navigator) navigator.audioSession.type = 'playback'; } catch (e) {}
}
document.addEventListener('pointerdown', iosPlaybackSession, true);
document.addEventListener('touchstart', iosPlaybackSession, true);

"use strict";
/* ============================================================
   PIXEL RACER — top-down endless driver
   Single-file, dependency-free. All art drawn on canvas.
   ============================================================ */
var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');
var muteBtn = document.getElementById('muteBtn');

var W = 390, H = 844, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  computeRoad();
  // Keep player sizes proportional to lane width and inside the road.
  var lw = roadW / 4;
  player.w = Math.max(26, Math.min(lw * 0.68, 46));
  player.h = player.w * 1.85;
  if (state === 'menu') { player.x = W / 2; player.y = H * 0.78; }
  clampPlayer();
}
window.addEventListener('resize', resize);

/* ---------------- Road geometry ---------------- */
var roadX = 0, roadW = 300;
function computeRoad() {
  if (W > H) { // landscape: wider fraction, capped for playability
    roadW = Math.min(W * 0.56, 640);
  } else {     // portrait-first
    roadW = Math.min(W * 0.86, 460);
  }
  roadX = (W - roadW) / 2;
}
function laneCenter(i) { return roadX + (i + 0.5) * (roadW / 4); }

/* ---------------- Game state ---------------- */
var state = 'menu'; // "menu" | "play" | "over"
var score = 0;              // float internally, floored for display
var best = 0;
try { best = parseInt(localStorage.getItem('pixelracer_hi') || '0', 10) || 0; } catch (e) { best = 0; }
var speed = 260;            // px/s scroll speed, ramps 260 -> 640
var playTime = 0;
var scroll = 0;
var nearMisses = 0;
var lastMilestone = 0;
var shake = 0;
var goTimer = 0;
var spawnTimer = 0.6;
var traffic = [];
var lastWaveSpeed = 0; // speed of the most recent traffic wave (see spawnTraffic)
var particles = [];
var popups = [];
var speedLines = [];
var keys = {};

var player = {
  x: 195, y: 658, w: 36, h: 67,
  vx: 0, tilt: 0
};

function clampPlayer() {
  var hw = player.w / 2;
  if (player.x < roadX + hw + 4) player.x = roadX + hw + 4;
  if (player.x > roadX + roadW - hw - 4) player.x = roadX + roadW - hw - 4;
  if (player.y < H * 0.52) player.y = H * 0.52;
  if (player.y > H * 0.90) player.y = H * 0.90;
}
function speedNorm() { return Math.max(0, Math.min(1, (speed - 260) / 380)); }

/* ============================================================
   AUDIO — Web Audio synth only, lazy on first gesture
   ============================================================ */
var AC = null, muted = false;
var engineOsc = null, engineGain = null;

function initAudio() {
  iosPlaybackSession();
  if (AC) { if (AC.state === 'suspended') { try { AC.resume(); } catch (e) {} } return; }
  try {
    var Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return;
    AC = new Ctor();
  } catch (e) { AC = null; }
}
function midiFreq(m) { return 440 * Math.pow(2, (m - 69) / 12); }

function beep(freq, dur, type, vol, slide) {
  if (!AC || muted) return;
  try {
    var t = AC.currentTime;
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t + dur);
    g.gain.setValueAtTime(vol || 0.08, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
function noiseBurst(dur, vol, filterFrom, filterTo) {
  if (!AC || muted) return;
  try {
    var t = AC.currentTime;
    var len = Math.max(1, Math.floor(AC.sampleRate * dur));
    var buf = AC.createBuffer(1, len, AC.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    var src = AC.createBufferSource(); src.buffer = buf;
    var f = AC.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 0.9;
    f.frequency.setValueAtTime(filterFrom, t);
    f.frequency.exponentialRampToValueAtTime(Math.max(40, filterTo), t + dur);
    var g = AC.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(f); f.connect(g); g.connect(AC.destination);
    src.start(t); src.stop(t + dur + 0.02);
  } catch (e) {}
}
function sfxWhoosh() { noiseBurst(0.18, 0.22, 500, 2600); beep(1100, 0.16, 'sine', 0.05, 280); }
function sfxCrash() {
  noiseBurst(0.45, 0.35, 900, 90);
  beep(170, 0.45, 'sawtooth', 0.20, 38);
  beep(82, 0.55, 'square', 0.16, 30);
}
function sfxMilestone() {
  beep(880, 0.09, 'square', 0.07);
  setTimeout(function () { beep(1318, 0.13, 'square', 0.07); }, 70);
}
function sfxGo() { beep(660, 0.10, 'square', 0.09); setTimeout(function () { beep(990, 0.16, 'square', 0.09); }, 90); }

/* ---- Engine hum: low sawtooth, frequency follows speed ---- */
function startEngine() {
  if (!AC || engineOsc) return;
  try {
    engineOsc = AC.createOscillator();
    engineGain = AC.createGain();
    engineOsc.type = 'sawtooth';
    engineOsc.frequency.value = 55;
    engineGain.gain.value = muted ? 0 : 0.03;
    var f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 420;
    engineOsc.connect(f); f.connect(engineGain); engineGain.connect(AC.destination);
    engineOsc.start();
  } catch (e) { engineOsc = null; engineGain = null; }
}
function updateEngine() {
  if (!engineOsc) return;
  try {
    engineOsc.frequency.value = 48 + speedNorm() * 95 + Math.sin(playTime * 31) * 2.5;
    if (engineGain) engineGain.gain.value = muted ? 0 : 0.03;
  } catch (e) {}
}
function stopEngine() {
  if (!engineOsc) return;
  try {
    var o = engineOsc, g = engineGain, t = AC ? AC.currentTime : 0;
    if (g) g.gain.setTargetAtTime(0, t, 0.03);
    setTimeout(function () { try { o.stop(); } catch (e) {} }, 140);
  } catch (e) {}
  engineOsc = null; engineGain = null;
}

/* ---- Music: lookahead step-sequencer, BPM ~132, E minor ---- */
var BPM = 132;
var STEP_DUR = 60 / BPM / 2; // 8th notes
// E minor power bass (MIDI, 0 = rest) — 32 steps = 4 bars
var BASS = [
  40,40,0,40, 40,0,40,0,
  40,40,0,40, 47,0,45,0,
  36,36,0,36, 36,0,36,0,
  38,38,0,38, 43,0,47,0
];
// Sparse lead stabs (MIDI, 0 = rest)
var LEAD = [
  0,0,64,0, 0,67,0,0,
  0,0,71,0, 69,0,0,0,
  0,0,64,0, 0,0,67,0,
  74,0,71,0, 69,0,67,0
];
var musicTimer = null, musicStep = 0, nextNoteTime = 0;

function playNote(midi, time, dur, type, vol) {
  if (!AC || muted || !midi) return;
  try {
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(midiFreq(midi), time);
    g.gain.setValueAtTime(vol, time);
    g.gain.exponentialRampToValueAtTime(0.001, time + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(time); o.stop(time + dur + 0.02);
  } catch (e) {}
}
function musicScheduler() {
  if (!AC) return;
  while (nextNoteTime < AC.currentTime + 0.12) {
    var s = musicStep % 32;
    if (!muted) {
      playNote(BASS[s], nextNoteTime, 0.20, 'square', 0.085);
      playNote(LEAD[s], nextNoteTime, 0.17, 'square', 0.045);
      if (s % 4 === 2) noiseTick(nextNoteTime);
    }
    nextNoteTime += STEP_DUR;
    musicStep++;
  }
}
function noiseTick(time) {
  if (!AC || muted) return;
  try {
    var len = Math.floor(AC.sampleRate * 0.03);
    var buf = AC.createBuffer(1, len, AC.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    var src = AC.createBufferSource(); src.buffer = buf;
    var f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 6000;
    var g = AC.createGain(); g.gain.value = 0.028;
    src.connect(f); f.connect(g); g.connect(AC.destination);
    src.start(time); src.stop(time + 0.04);
  } catch (e) {}
}
function startMusic() {
  if (!AC || musicTimer) return;
  musicStep = 0;
  nextNoteTime = AC.currentTime + 0.06;
  musicTimer = setInterval(musicScheduler, 25);
}
function stopMusic() {
  if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
}

function setMuted(m) {
  muted = m;
  muteBtn.textContent = muted ? '🔇' : '🔊';
  if (engineGain) { try { engineGain.gain.value = muted ? 0 : 0.03; } catch (e) {} }
}
muteBtn.addEventListener('pointerdown', function (e) {
  e.stopPropagation(); e.preventDefault();
  initAudio(); setMuted(!muted);
}, { passive: false });
muteBtn.addEventListener('click', function (e) { e.stopPropagation(); e.preventDefault(); });

/* ============================================================
   INPUT — relative-delta touch/mouse drag + keyboard
   ============================================================ */
var dragging = false, lastPX = 0, lastPY = 0;

canvas.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  initAudio();
  if (state !== 'play') { startGame(); return; }
  dragging = true; lastPX = e.clientX; lastPY = e.clientY;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
}, { passive: false });

canvas.addEventListener('pointermove', function (e) {
  if (!dragging || state !== 'play') return;
  e.preventDefault();
  var dx = e.clientX - lastPX, dy = e.clientY - lastPY;
  lastPX = e.clientX; lastPY = e.clientY;
  // Relative-delta steering: car follows finger delta, finger never covers it.
  player.x += dx;
  player.y += dy * 0.6; // gentler vertical drag, stays in the band via clamp
  player.vx = player.vx * 0.5 + dx * 22;
  clampPlayer();
}, { passive: false });

function endDrag() { dragging = false; }
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('touchstart', function (e) { e.preventDefault(); }, { passive: false });
canvas.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });

window.addEventListener('keydown', function (e) {
  var k = e.key;
  if (k === ' ' || k === 'Spacebar') {
    e.preventDefault();
    initAudio();
    if (state !== 'play') startGame();
    return;
  }
  if (k === 'm' || k === 'M') { initAudio(); setMuted(!muted); return; }
  if ((k === 'r' || k === 'R') && state !== 'play') { initAudio(); startGame(); return; }
  keys[k.length === 1 ? k.toLowerCase() : k] = true;
  if (k.indexOf('Arrow') === 0) e.preventDefault();
});
window.addEventListener('keyup', function (e) {
  var k = e.key;
  keys[k.length === 1 ? k.toLowerCase() : k] = false;
});

/* ============================================================
   GAME FLOW
   ============================================================ */
function startGame() {
  initAudio();
  state = 'play';
  score = 0; playTime = 0; speed = 260;
  nearMisses = 0; lastMilestone = 0;
  traffic = []; particles = []; popups = []; speedLines = [];
  lastWaveSpeed = 0;
  shake = 0; goTimer = 0.9; spawnTimer = 0.55;
  dragging = false;
  player.x = W / 2; player.y = H * 0.78; player.vx = 0; player.tilt = 0;
  clampPlayer();
  stopMusic(); startMusic();
  stopEngine(); startEngine();
  sfxGo();
}
function gameOver() {
  state = 'over';
  shake = 16;
  spawnExplosion(player.x, player.y);
  sfxCrash();
  stopEngine();
  stopMusic();
  var s = Math.floor(score);
  if (s > best) {
    best = s;
    try { localStorage.setItem('pixelracer_hi', String(best)); } catch (e) {}
  }
}
function spawnExplosion(x, y) {
  var colors = ['#ffcc33', '#ff7722', '#ff3322', '#dddddd', '#888899'];
  for (var i = 0; i < 42; i++) {
    var a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 300;
    particles.push({
      x: x, y: y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40,
      life: 0.6 + Math.random() * 0.7, maxLife: 1.3,
      size: 3 + Math.random() * 7,
      color: colors[i % colors.length]
    });
  }
}

/* ---------------- Traffic spawning ---------------- */
var CAR_COLORS = ['#e33b3b', '#3b78e3', '#39c26a', '#e8e8f0', '#9b59d0', '#ff8c2e', '#2ec4c6', '#5a6270'];
function spawnTraffic() {
  // Waves with a guaranteed gap (the old per-event lane picks could
  // combine across events into a wall across all 4 lanes):
  //  - each wave leaves one lane completely empty;
  //  - every car in a wave shares one speed, and a new wave is never
  //    slower than the wave ahead of it, so a later wave can never
  //    catch up to an earlier one and seal its gap;
  //  - a wave only spawns once the top of the road is clear, keeping
  //    waves far enough apart to change lanes between them.
  // Returns false when the top isn't clear yet (caller retries shortly).
  var TOP_CLEAR = 300;
  for (var k = 0; k < traffic.length; k++) {
    if (traffic[k].y < TOP_CLEAR) return false;
  }
  if (traffic.length === 0) lastWaveSpeed = 0;
  var lw = roadW / 4;
  var gapLane = Math.floor(Math.random() * 4);
  var waveSpeed = Math.max(lastWaveSpeed, 110 + Math.random() * 90);
  lastWaveSpeed = waveSpeed;
  var truckChance = 0.10 + speedNorm() * 0.22;
  var spawned = 0;
  for (var lane = 0; lane < 4; lane++) {
    if (lane === gapLane) continue;
    if (spawned > 0 && Math.random() < 0.3) continue; // sometimes open a second lane too
    var roll = Math.random();
    var type = 'car', tw, th;
    if (roll < truckChance) {
      type = 'truck';
      tw = Math.min(lw * 0.78, 52); th = tw * 2.9;
    } else if (roll < truckChance + 0.16) {
      type = 'taxi';
      tw = Math.min(lw * 0.68, 46); th = tw * 1.85;
    } else {
      type = 'car';
      tw = Math.min(lw * 0.68, 46); th = tw * (1.75 + Math.random() * 0.25);
    }
    traffic.push({
      x: laneCenter(lane) + (Math.random() - 0.5) * lw * 0.14,
      y: -th / 2 - 6,
      w: tw, h: th, speed: waveSpeed, type: type,
      color: type === 'taxi' ? '#f7c531' : CAR_COLORS[Math.floor(Math.random() * CAR_COLORS.length)],
      passed: false
    });
    spawned++;
  }
  return true;
}

/* ============================================================
   UPDATE
   ============================================================ */
function update(dt) {
  // Particles / popups / speed lines animate in every state.
  for (var i = particles.length - 1; i >= 0; i--) {
    var p = particles[i];
    p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (var q = popups.length - 1; q >= 0; q--) {
    popups[q].life -= dt; popups[q].y -= 46 * dt;
    if (popups[q].life <= 0) popups.splice(q, 1);
  }
  for (var s = speedLines.length - 1; s >= 0; s--) {
    speedLines[s].y += speedLines[s].vy * dt;
    if (speedLines[s].y - speedLines[s].len > H) speedLines.splice(s, 1);
  }
  if (shake > 0) shake = Math.max(0, shake - dt * 26);
  if (goTimer > 0) goTimer -= dt;

  if (state !== 'play') return;

  playTime += dt;
  speed = Math.min(640, 260 + playTime * 8);
  scroll += speed * dt;
  score += speed * dt * 0.07;

  // Milestone ding every 500 pts
  var ms = Math.floor(score / 500);
  if (ms > lastMilestone) { lastMilestone = ms; sfxMilestone(); }

  /* Keyboard steering */
  var kvx = 0, kvy = 0;
  if (keys['ArrowLeft'] || keys['a']) kvx -= 1;
  if (keys['ArrowRight'] || keys['d']) kvx += 1;
  if (keys['ArrowUp'] || keys['w']) kvy -= 1;
  if (keys['ArrowDown'] || keys['s']) kvy += 1;
  if (kvx !== 0 || kvy !== 0) {
    player.x += kvx * 430 * dt;
    player.y += kvy * 300 * dt;
    player.vx = player.vx * 0.6 + kvx * 430 * 0.4;
    clampPlayer();
  } else if (!dragging) {
    player.vx *= Math.pow(0.001, dt); // quick decay
  }
  // Tilt visual follows horizontal velocity
  var targetTilt = Math.max(-0.16, Math.min(0.16, player.vx * 0.00045));
  player.tilt += (targetTilt - player.tilt) * Math.min(1, dt * 10);

  updateEngine();

  /* Spawning */
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    if (spawnTraffic()) {
      var base = 1.08 - speedNorm() * 0.5; // 1.08s -> 0.58s
      spawnTimer = base * (0.75 + Math.random() * 0.5);
    } else {
      spawnTimer = 0.12; // top of the road not clear yet — retry shortly
    }
  }

  /* Speed lines at high speed */
  if (speed > 460 && Math.random() < dt * 22) {
    speedLines.push({
      x: roadX + 6 + Math.random() * (roadW - 12),
      y: -80, len: 50 + Math.random() * 80,
      vy: speed * 1.7
    });
  }

  /* Traffic movement, near-miss, collision */
  var pShrinkW = player.w * 0.82, pShrinkH = player.h * 0.82;
  for (var t = traffic.length - 1; t >= 0; t--) {
    var car = traffic[t];
    car.y += (speed - car.speed) * dt;

    // Near miss: car has just passed below the player
    if (!car.passed && car.y - car.h / 2 > player.y + player.h / 2) {
      car.passed = true;
      var gap = Math.abs(car.x - player.x) - (car.w + player.w) / 2;
      if (gap < 14) {
        nearMisses++;
        score += 50;
        popups.push({ text: 'NEAR MISS! +50', x: player.x, y: player.y - player.h, life: 0.9 });
        sfxWhoosh();
      }
    }

    // Forgiving AABB collision (both boxes shrunk ~18%)
    var cShrinkW = car.w * 0.82, cShrinkH = car.h * 0.82;
    if (Math.abs(car.x - player.x) < (cShrinkW + pShrinkW) / 2 &&
        Math.abs(car.y - player.y) < (cShrinkH + pShrinkH) / 2) {
      gameOver();
      return;
    }

    if (car.y - car.h / 2 > H + 60) traffic.splice(t, 1);
  }
}

/* ============================================================
   DRAWING — original chunky pixel-style cars from rects
   ============================================================ */
function rect(x, y, w, h, color) { ctx.fillStyle = color; ctx.fillRect(x, y, w, h); }

function drawCar(cx, cy, w, h, color, isPlayer, type) {
  var x = cx - w / 2, y = cy - h / 2;
  var u = w / 16; // chunky pixel unit
  // Wheels
  ctx.fillStyle = '#101018';
  var ww = u * 2.4, wh = h * 0.16;
  ctx.fillRect(x - ww * 0.45, y + h * 0.10, ww, wh);
  ctx.fillRect(x + w - ww * 0.55, y + h * 0.10, ww, wh);
  ctx.fillRect(x - ww * 0.45, y + h * 0.74, ww, wh);
  ctx.fillRect(x + w - ww * 0.55, y + h * 0.74, ww, wh);

  if (type === 'truck') {
    // Trailer
    rect(x + u, y, w - u * 2, h * 0.72, '#d8dbe4');
    rect(x + u, y, w - u * 2, h * 0.10, '#aab0c0');
    rect(x + u * 2, y + h * 0.16, w - u * 4, h * 0.06, '#b9c0d2');
    rect(x + u * 2, y + h * 0.34, w - u * 4, h * 0.06, '#b9c0d2');
    // Cab (at bottom — truck travels same direction, cab leads at top visually flipped: cab near top)
    rect(x + u * 0.5, y + h * 0.74, w - u, h * 0.26, color);
    rect(x + u * 2, y + h * 0.78, w - u * 4, h * 0.10, '#20303f'); // windshield
    rect(x + u, y + h * 0.94, u * 2.4, u * 1.1, '#ffe27a');
    rect(x + w - u * 3.4, y + h * 0.94, u * 2.4, u * 1.1, '#ffe27a');
    return;
  }

  // Body
  rect(x + u, y + u, w - u * 2, h - u * 2, color);
  // Shading: darker rear, lighter nose stripe
  rect(x + u, y + h - u * 4.2, w - u * 2, u * 3.2, 'rgba(0,0,0,0.22)');
  rect(x + u, y + u, w - u * 2, u * 1.6, 'rgba(255,255,255,0.20)');
  // Cabin / roof
  rect(x + u * 3, y + h * 0.30, w - u * 6, h * 0.40, color);
  rect(x + u * 3, y + h * 0.30, w - u * 6, h * 0.40, 'rgba(0,0,0,0.14)');
  // Windshield (front, top) + rear window
  rect(x + u * 3.6, y + h * 0.235, w - u * 7.2, h * 0.075, '#9fd8ef');
  rect(x + u * 3.6, y + h * 0.695, w - u * 7.2, h * 0.065, '#2b4256');
  // Side mirrors
  rect(x, y + h * 0.30, u * 1.2, u * 1.4, color);
  rect(x + w - u * 1.2, y + h * 0.30, u * 1.2, u * 1.4, color);

  if (type === 'taxi') {
    rect(x + u * 6.2, y + h * 0.44, u * 3.6, h * 0.10, '#fff3b0'); // roof sign
    rect(x + u, y + h * 0.80, u * 2, u * 2, '#111');
    rect(x + u * 5, y + h * 0.80, u * 2, u * 2, '#111');
    rect(x + u * 9, y + h * 0.80, u * 2, u * 2, '#111');
    rect(x + u * 13, y + h * 0.80, u * 2, u * 2, '#111');
  }
  if (isPlayer) {
    // Racing stripe
    rect(cx - u * 1.1, y + u, u * 2.2, h - u * 2, 'rgba(255,255,255,0.85)');
    rect(cx - u * 1.1, y + h * 0.30, u * 2.2, h * 0.40, 'rgba(255,255,255,0.55)');
    // Headlights (top)
    rect(x + u * 1.4, y + u * 0.6, u * 2.6, u * 1.3, '#fff6a8');
    rect(x + w - u * 4, y + u * 0.6, u * 2.6, u * 1.3, '#fff6a8');
  } else {
    // Taillights (bottom, facing the player)
    rect(x + u * 1.4, y + h - u * 2, u * 2.6, u * 1.3, '#ff4040');
    rect(x + w - u * 4, y + h - u * 2, u * 2.6, u * 1.3, '#ff4040');
  }
}

function drawRoad() {
  // Surroundings
  rect(0, 0, W, H, '#0d1420');
  // Side scenery streaks: posts / blocks whipping by
  var spacing = 110;
  var off = scroll % spacing;
  ctx.fillStyle = '#1d3a2a';
  ctx.fillRect(0, 0, Math.max(0, roadX - 14), H);
  ctx.fillRect(Math.min(W, roadX + roadW + 14), 0, W, H);
  for (var y = -spacing + off; y < H + spacing; y += spacing) {
    rect(roadX - 34, y, 16, 30, '#274b63');
    rect(roadX + roadW + 18, y + 40, 16, 30, '#274b63');
    rect(6, y + 55, 10, 20, '#3a2b12');
    rect(W - 16, y + 10, 10, 20, '#3a2b12');
  }
  // Shoulders
  rect(roadX - 14, 0, 14, H, '#3d3d4d');
  rect(roadX + roadW, 0, 14, H, '#3d3d4d');
  // Asphalt
  rect(roadX, 0, roadW, H, '#23232f');
  rect(roadX, 0, roadW, H, 'rgba(255,255,255,0.02)');
  // Neon edge lines
  rect(roadX + 2, 0, 4, H, '#22e6ff');
  rect(roadX + roadW - 6, 0, 4, H, '#ff3df0');
  rect(roadX + 6, 0, 2, H, 'rgba(34,230,255,0.35)');
  rect(roadX + roadW - 8, 0, 2, H, 'rgba(255,61,240,0.35)');
  // Lane dashes scrolling at speed
  var dashH = 36, gap = 30, cycle = dashH + gap;
  var doff = scroll % cycle;
  ctx.fillStyle = '#e8e84a';
  for (var lane = 1; lane < 4; lane++) {
    var lx = roadX + lane * (roadW / 4) - 3;
    for (var dy = -cycle + doff; dy < H + cycle; dy += cycle) {
      ctx.fillRect(lx, dy, 6, dashH);
    }
  }
  // Speed lines
  if (speedLines.length) {
    ctx.strokeStyle = 'rgba(255,255,255,0.28)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (var i = 0; i < speedLines.length; i++) {
      var sl = speedLines[i];
      ctx.moveTo(sl.x, sl.y);
      ctx.lineTo(sl.x, sl.y + sl.len);
    }
    ctx.stroke();
  }
}

function drawPanel(x, y, w, h) {
  ctx.fillStyle = 'rgba(8,8,22,0.82)';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = '#22e6ff'; ctx.lineWidth = 3;
  ctx.strokeRect(x + 1.5, y + 1.5, w - 3, h - 3);
}
function centerText(text, y, size, color, weight) {
  ctx.fillStyle = color;
  ctx.font = (weight || 'bold') + ' ' + size + 'px system-ui, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, W / 2, y);
}
function leftText(text, x, y, size, color) {
  ctx.fillStyle = color;
  ctx.font = 'bold ' + size + 'px system-ui, sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y);
}

function drawHUD() {
  leftText('SCORE ' + Math.floor(score), 12, 24, 19, '#ffffff');
  leftText('BEST ' + best, 12, 48, 13, '#9fd8ef');
  var kmh = Math.round(speed * 0.36);
  leftText('SPEED ' + kmh + ' km/h', 12, 72, 13, '#ffe27a');
  leftText('NEAR MISS x' + nearMisses, 12, 94, 13, '#ff9df5');
  // Speed bar
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.fillRect(12, 106, 110, 6);
  ctx.fillStyle = speedNorm() > 0.8 ? '#ff5040' : '#22e6ff';
  ctx.fillRect(12, 106, 110 * speedNorm(), 6);
}

function draw() {
  ctx.save();
  if (shake > 0) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  }
  drawRoad();

  // Traffic
  for (var i = 0; i < traffic.length; i++) {
    var c = traffic[i];
    drawCar(c.x, c.y, c.w, c.h, c.color, false, c.type);
  }

  // Player (hidden in the explosion flash right after a crash)
  if (state !== 'over') {
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(player.tilt);
    ctx.translate(-player.x, -player.y);
    drawCar(player.x, player.y, player.w, player.h, '#ffcf3f', true, 'car');
    ctx.restore();
  }

  // Particles
  for (var p = 0; p < particles.length; p++) {
    var pt = particles[p];
    ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
    rect(pt.x - pt.size / 2, pt.y - pt.size / 2, pt.size, pt.size, pt.color);
  }
  ctx.globalAlpha = 1;

  // Popups
  for (var u = 0; u < popups.length; u++) {
    var pp = popups[u];
    ctx.globalAlpha = Math.max(0, Math.min(1, pp.life / 0.5));
    ctx.fillStyle = '#ffe27a';
    ctx.font = 'bold 17px system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(pp.text, pp.x, pp.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  if (state === 'play') {
    drawHUD();
    if (goTimer > 0) centerText('GO!', H * 0.38, 54, '#7dff6a');
  } else if (state === 'menu') {
    drawHUD();
    var mw = Math.min(W - 36, 380), mh = 300;
    var mx = (W - mw) / 2, my = H * 0.20;
    drawPanel(mx, my, mw, mh);
    centerText('PIXEL', my + 52, 44, '#22e6ff');
    centerText('RACER', my + 98, 44, '#ff3df0');
    // Demo car in the panel
    drawCar(W / 2, my + 152, 34, 63, '#ffcf3f', true, 'car');
    centerText('Drag, mouse or ← → ↑ ↓ / A D to steer', my + 208, 14.5, '#ffffff', 'normal');
    centerText('Thread the traffic. Graze cars for', my + 232, 14.5, '#ffffff', 'normal');
    centerText('NEAR MISS +50 bonuses. Don\'t crash!', my + 254, 14.5, '#ffffff', 'normal');
    centerText('TAP OR PRESS SPACE TO START', my + mh - 22, 15, '#ffe27a');
    if (best > 0) centerText('BEST  ' + best, my + mh + 28, 16, '#9fd8ef');
  } else if (state === 'over') {
    drawHUD();
    var ow = Math.min(W - 36, 360), oh = 246;
    var ox = (W - ow) / 2, oy = H * 0.28;
    drawPanel(ox, oy, ow, oh);
    centerText('CRASHED!', oy + 42, 34, '#ff5040');
    centerText('SCORE  ' + Math.floor(score), oy + 96, 26, '#ffffff');
    centerText('BEST  ' + best, oy + 132, 19, '#9fd8ef');
    centerText('NEAR MISSES  x' + nearMisses, oy + 164, 17, '#ff9df5');
    centerText('TAP OR PRESS SPACE TO RESTART', oy + oh - 28, 14.5, '#ffe27a');
  }
}

/* ============================================================
   MAIN LOOP — rAF, dt clamped
   ============================================================ */
var lastTime = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  if (!lastTime) lastTime = ts;
  var dt = (ts - lastTime) / 1000;
  lastTime = ts;
  if (dt > 0.033) dt = 0.033;
  if (dt < 0) dt = 0;
  // In menu/over, keep the world gently scrolling for life.
  if (state !== 'play') scroll += 130 * dt;
  update(dt);
  draw();
}

resize();
requestAnimationFrame(loop);

/* Test / automation hook */
window.__game = {
  get state() { return state; },
  get score() { return Math.floor(score); },
  start: function () { startGame(); }
};
</script>
