<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#3a2b10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Micro Mayhem</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden;
    background:
      radial-gradient(120% 90% at 50% 0%, #6b4d16 0%, rgba(107,77,22,0) 55%),
      linear-gradient(180deg, #2c2008 0%, #3a2b10 55%, #1d1405 100%);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    touch-action:none; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color: transparent; }
  canvas { position:fixed; inset:0; display:block; touch-action:none; }
  #muteBtn { position:fixed; top:10px; right:10px; z-index:10; width:48px; height:48px; border-radius:12px;
    border:1px solid rgba(255,255,255,.45); background:linear-gradient(180deg, rgba(110,80,25,.65), rgba(46,32,8,.65));
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    box-shadow:0 6px 18px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.25);
    color:#fff; font-size:22px;
    line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="muteBtn" aria-label="Toggle sound">🔊</button>
<script>
// iOS audio routing: Web Audio defaults to the "ambient" channel, which the
// iPhone silent switch mutes entirely. Route it to the media/playback
// channel (iOS 17+ Audio Session API) on the first user gesture and inside
// audio init, so game music/SFX play even with silent mode on.
function iosPlaybackSession() {
  try { if ('audioSession' in navigator) navigator.audioSession.type = 'playback'; } catch (e) {}
}
document.addEventListener('pointerdown', iosPlaybackSession, true);
// Sleep in the background (2026-11-09): the wrapper's pauseTimers stops
// JS timers, but the Web Audio graph is a separate engine — suspend the
// audio context whenever the page is hidden so nothing keeps the CPU
// (or the sound) running while the app is in the background.
document.addEventListener("visibilitychange", function () {
  try {
    var c = window.__maCtx;
    if (document.hidden) {
      window.__maHidden = true;
      if (c) {
        if (c.close) { try { var p = c.close(); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
        if (c.suspend && c.state === "running") { try { c.suspend(); } catch (e) {} }
        window.__maCtx = null;
      }
    } else {
      window.__maHidden = false;
      var ac = c || (window.__maActx && window.__maActx());
      if (ac && ac.state === "suspended" && ac.resume) { try { ac.resume(); } catch (e) {} }
    }
  } catch (e) {}
});

document.addEventListener('touchstart', iosPlaybackSession, true);
"use strict";
/* MICRO MAYHEM — original rapid-fire microgame collection. One word of
   instruction, four seconds, faster every round; four misses ends it.
   Fairness (logged by the ?qa=1 self-check): at the maximum speed
   multiplier (2.0x), every microgame's demand stays within a humanly
   possible floor — required taps <= 8 per window and the timing zone is
   never narrower than 12% of its sweep. */
const VW = 420, VH = 720;
const BASE_WINDOW = 4.2, MAX_SPEEDUP = 2.0;
const QA_MODE = /[?&]qa=1/.test(location.search);
const canvas = document.getElementById("game"), ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1, scale = 1, ox = 0, oy = 0;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  scale = Math.min(W / VW, H / VH) * DPR; ox = (W * DPR - VW * scale) / 2; oy = (H * DPR - VH * scale) / 2;
}
window.addEventListener("resize", resize); resize();

/* ---------------- audio ---------------- */
let actx = null, muted = false, musicTimer = null, mStep = 0;
function initAudio() {
  iosPlaybackSession();
  if (!actx || actx.state === "closed") { try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); window.__maCtx = actx; window.__maActx = function () { return actx; };; } catch (e) {} }
  if (actx && actx.state === "suspended") actx.resume();
  if (actx && !musicTimer) musicTimer = setInterval(musicTick, 140);
}
function tone(freq, dur, type, vol, when, slide) {
  if (!actx || muted) return;
  const t = when || actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = type || "triangle"; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), t + dur);
  g.gain.setValueAtTime(vol || 0.15, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
}
const BASS = [147, 0, 147, 0, 175, 0, 147, 0, 131, 0, 131, 0, 165, 0, 196, 0];
function musicTick() {
  if (!actx || muted || state !== "play") return;
  const b = BASS[mStep % 16], t = actx.currentTime;
  if (b) tone(b, 0.12, "triangle", 0.13, t);
  if (mStep % 4 === 0) tone(262 + (mStep % 3) * 65, 0.08, "square", 0.05, t);
  mStep++;
}
function sfx(name) {
  if (!actx || muted) return; const t = actx.currentTime;
  if (name === "good") { tone(659, 0.09, "square", 0.13, t); tone(988, 0.13, "square", 0.13, t + 0.07); }
  if (name === "bad") tone(185, 0.25, "sawtooth", 0.14, t, 90);
  if (name === "tap") tone(440, 0.05, "square", 0.1, t);
  if (name === "pop") tone(300, 0.1, "square", 0.13, t, 700);
  if (name === "next") tone(784, 0.08, "square", 0.1, t);
}

/* ---------------- guarded storage ---------------- */
// Storage can be denied (preview panes, private-mode webviews); a throwing
// read would kill the script or the draw loop — route every access here.
function storeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function storeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

/* ---------------- microgames ---------------- */
/* Each entry: word (instruction), taps (max discrete inputs needed at any
   speed), zone (narrowest timing zone as a fraction of sweep, if any),
   start(g), update(g, dt) -> true/false when decided early,
   draw(g), tap(g, x, y), drag handling via shared pointer state. */
const GAMES = [
  { word: "TAP!", taps: 3, zone: null,
    start(g) { g.n = 0; g.x = 90 + Math.random() * 240; g.y = 240 + Math.random() * 240; },
    tap(g, x, y) { if (Math.hypot(x - g.x, y - g.y) < 64) { g.n++; sfx("tap"); g.x = 80 + Math.random() * 260; g.y = 230 + Math.random() * 260; if (g.n >= 3) g.done = true; } },
    draw(g) { ctx.fillStyle = "rgba(0,0,0,.3)"; ctx.beginPath(); ctx.ellipse(g.x, g.y + 50, 44, 9, 0, 0, 7); ctx.fill();
      const bg = ctx.createRadialGradient(g.x - 18, g.y - 20, 8, g.x, g.y, 62); bg.addColorStop(0, "#fff3b0"); bg.addColorStop(0.55, "#ffd23e"); bg.addColorStop(1, "#e8a812");
      ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(g.x, g.y, 56, 0, 7); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.5)"; ctx.beginPath(); ctx.ellipse(g.x - 20, g.y - 24, 16, 9, -0.5, 0, 7); ctx.fill();
      ctx.fillStyle = "#7a5200"; ctx.font = "bold 26px sans-serif"; ctx.fillText("TAP", g.x, g.y + 4); ctx.fillStyle = "#fff"; ctx.font = "bold 20px sans-serif"; ctx.fillText(g.n + " / 3", VW / 2, 640); } },
  { word: "MASH!", taps: 6, zone: null,
    start(g) { g.n = 0; },
    tap(g) { g.n++; sfx("tap"); if (g.n >= 6) g.done = true; },
    draw(g) { const f = g.n / 6; ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.beginPath(); ctx.roundRect(70, 330, 280, 44, 22); ctx.fill();
      if (f > 0) { const fg = ctx.createLinearGradient(70, 0, 350, 0); fg.addColorStop(0, "#8bf79b"); fg.addColorStop(1, "#35b558"); ctx.fillStyle = fg; ctx.beginPath(); ctx.roundRect(70, 330, Math.max(44, 280 * f), 44, 22); ctx.fill(); }
      ctx.fillStyle = "rgba(255,255,255,.25)"; ctx.beginPath(); ctx.roundRect(82, 336, 256, 12, 6); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.font = "bold 22px sans-serif"; ctx.fillText("TAP ANYWHERE!", VW / 2, 300); ctx.font = "44px sans-serif"; ctx.fillText("🥤", VW / 2, 470); ctx.fillText("fill the cup: " + g.n + "/6", VW / 2, 540); } },
  { word: "CATCH!", taps: 0, zone: null,
    start(g) { g.bx = VW / 2; g.sx = 60 + Math.random() * 300; g.sy = 130; g.caught = false; },
    update(g, dt) { g.sy += dt * 235 * g.speed; if (g.sy > 566) { if (Math.abs(g.sx - g.bx) < 52) { g.caught = true; g.done = true; sfx("good"); } else if (g.sy > 640) { g.fail = true; g.done = true; } } },
    move(g, x) { g.bx = Math.max(44, Math.min(VW - 44, x)); },
    key(g, dir) { g.bx = Math.max(44, Math.min(VW - 44, g.bx + dir * 30)); },
    draw(g) { ctx.font = "40px sans-serif"; ctx.fillText("⭐", g.sx, g.sy);
      ctx.fillStyle = "rgba(0,0,0,.3)"; ctx.beginPath(); ctx.ellipse(g.bx, 592, 50, 7, 0, 0, 7); ctx.fill();
      const bg2 = ctx.createLinearGradient(0, 556, 0, 590); bg2.addColorStop(0, "#e8935a"); bg2.addColorStop(1, "#a85424");
      ctx.fillStyle = bg2; ctx.beginPath(); ctx.roundRect(g.bx - 48, 560, 96, 26, 8); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.35)"; ctx.fillRect(g.bx - 44, 562, 88, 4);
      ctx.fillStyle = "#fff"; ctx.font = "15px sans-serif"; ctx.fillText("◀ drag or arrow keys ▶", VW / 2, 660); } },
  { word: "DODGE!", taps: 0, zone: null,
    start(g) { g.px = VW / 2; g.barrels = [0, 1, 2].map(i => ({ x: 60 + Math.random() * 300, y: -60 - i * 210, s: 200 + Math.random() * 60 })); },
    update(g, dt) {
      for (const b of g.barrels) { b.y += b.s * g.speed * dt; if (b.y > 520 && b.y < 592 && Math.abs(b.x - g.px) < 46) { g.fail = true; g.done = true; } }
      if (g.barrels.every(b => b.y > 640)) g.done = true;
    },
    move(g, x) { g.px = Math.max(30, Math.min(VW - 30, x)); },
    key(g, dir) { g.px = Math.max(30, Math.min(VW - 30, g.px + dir * 34)); },
    draw(g) { for (const b of g.barrels) { ctx.font = "42px sans-serif"; ctx.fillText("🛢️", b.x, b.y); } ctx.font = "40px sans-serif"; ctx.fillText("🐭", g.px, 580); ctx.fillStyle = "#fff"; ctx.font = "15px sans-serif"; ctx.fillText("stay out of their lane!", VW / 2, 660); } },
  { word: "ORDER!", taps: 3, zone: null,
    start(g) { g.next = 1; const spots = [[110, 300], [310, 300], [210, 470]]; g.order = [1, 2, 3].sort(() => Math.random() - 0.5); g.pads = spots.map((s, i) => ({ x: s[0], y: s[1], n: g.order[i] })); },
    tap(g, x, y) { for (const p of g.pads) if (Math.hypot(x - p.x, y - p.y) < 52) { if (p.n === g.next) { p.hit = true; g.next++; sfx("tap"); if (g.next > 3) g.done = true; } else { g.fail = true; g.done = true; } } },
    draw(g) { for (const p of g.pads) { ctx.fillStyle = "rgba(0,0,0,.3)"; ctx.beginPath(); ctx.ellipse(p.x, p.y + 42, 40, 8, 0, 0, 7); ctx.fill();
        const pg = ctx.createRadialGradient(p.x - 14, p.y - 16, 6, p.x, p.y, 52); if (p.hit) { pg.addColorStop(0, "#a5f2b1"); pg.addColorStop(1, "#2f9e4f"); } else { pg.addColorStop(0, "#7ba7f0"); pg.addColorStop(1, "#2b4fa8"); }
        ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(p.x, p.y, 46, 0, 7); ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,.35)"; ctx.beginPath(); ctx.ellipse(p.x - 15, p.y - 18, 14, 8, -0.5, 0, 7); ctx.fill();
        ctx.fillStyle = "#fff"; ctx.font = "bold 30px sans-serif"; ctx.fillText(String(p.n), p.x, p.y + 4); } ctx.font = "17px sans-serif"; ctx.fillText("tap 1, then 2, then 3", VW / 2, 640); } },
  { word: "STOP!", taps: 1, zone: 0.16,
    start(g) { g.t = 0; g.stopped = false; g.zoneC = 0.3 + Math.random() * 0.4; },
    update(g, dt) { if (!g.stopped) g.t += dt * g.speed; },
    tap(g) { if (g.stopped) return; g.stopped = true; const pos = (Math.sin(g.t * 2.4) + 1) / 2; if (Math.abs(pos - g.zoneC) <= 0.08) { g.done = true; sfx("good"); } else { g.fail = true; g.done = true; } },
    key(g) { g.tap && g.tap(g); },
    draw(g) { const pos = (Math.sin(g.t * 2.4) + 1) / 2; ctx.fillStyle = "rgba(0,0,0,.5)"; ctx.beginPath(); ctx.roundRect(50, 340, 320, 30, 15); ctx.fill();
      const zg = ctx.createLinearGradient(0, 340, 0, 370); zg.addColorStop(0, "#8bf79b"); zg.addColorStop(1, "#35b558"); ctx.fillStyle = zg; ctx.fillRect(50 + 320 * (g.zoneC - 0.08), 340, 320 * 0.16, 30);
      ctx.save(); ctx.shadowColor = "rgba(255,210,62,.85)"; ctx.shadowBlur = 12; const mg = ctx.createLinearGradient(0, 322, 0, 388); mg.addColorStop(0, "#ffe98a"); mg.addColorStop(1, "#e8a812"); ctx.fillStyle = mg; ctx.beginPath(); ctx.roundRect(50 + 320 * pos - 5, 322, 10, 66, 5); ctx.fill(); ctx.restore();
      ctx.fillStyle = "#fff"; ctx.font = "17px sans-serif"; ctx.fillText("tap when the bar is in the green", VW / 2, 460); } },
  { word: "POP!", taps: 3, zone: null,
    start(g) { g.n = 0; g.bs = [0, 1, 2, 3].map(i => ({ x: 60 + Math.random() * 300, y: 240 + Math.random() * 260, vx: (Math.random() * 2 - 1) * 60, vy: (Math.random() * 2 - 1) * 45, dead: false })); },
    update(g, dt) { for (const b of g.bs) { if (b.dead) continue; b.x += b.vx * dt * g.speed; b.y += b.vy * dt * g.speed; if (b.x < 44 || b.x > VW - 44) b.vx *= -1; if (b.y < 200 || b.y > 560) b.vy *= -1; } },
    tap(g, x, y) { for (const b of g.bs) if (!b.dead && Math.hypot(x - b.x, y - b.y) < 46) { b.dead = true; g.n++; sfx("pop"); if (g.n >= 3) g.done = true; } },
    draw(g) { for (const b of g.bs) { if (b.dead) continue; ctx.font = "46px sans-serif"; ctx.fillText("🎈", b.x, b.y); } ctx.fillStyle = "#fff"; ctx.font = "bold 20px sans-serif"; ctx.fillText("popped " + g.n + " / 3", VW / 2, 640); } },
  { word: "HAMMER!", taps: 4, zone: null,
    start(g) { g.n = 0; },
    tap(g) { g.n++; sfx("tap"); if (g.n >= 4) g.done = true; },
    draw(g) { ctx.font = "52px sans-serif"; ctx.fillText("🔨", VW / 2, 300);
      const ng = ctx.createLinearGradient(VW / 2 - 5, 0, VW / 2 + 5, 0); ng.addColorStop(0, "#e8edf2"); ng.addColorStop(0.5, "#aeb6bf"); ng.addColorStop(1, "#7e8894"); ctx.fillStyle = ng; ctx.fillRect(VW / 2 - 5, 380, 10, 90 - g.n * 18);
      const wg = ctx.createLinearGradient(0, 470, 0, 486); wg.addColorStop(0, "#b07a3e"); wg.addColorStop(1, "#7c4f22"); ctx.fillStyle = wg; ctx.beginPath(); ctx.roundRect(VW / 2 - 70, 470, 140, 16, 4); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.font = "bold 20px sans-serif"; ctx.fillText("nail: " + g.n + "/4 taps", VW / 2, 550); } },
  { word: "SLIDE!", taps: 0, zone: null,
    start(g) { g.px = 70; g.gx = 280 + Math.random() * 60; g.held = false; },
    down(g, x, y) { if (Math.hypot(x - g.px, y - 420) < 52) g.held = true; },
    move(g, x) { if (g.held) g.px = Math.max(46, Math.min(VW - 46, x)); },
    up(g) { if (!g.held) return; g.held = false; if (Math.abs(g.px - g.gx) < 40) { g.done = true; sfx("good"); } else { g.fail = true; g.done = true; } },
    draw(g) { ctx.save(); ctx.shadowColor = "rgba(87,217,119,.8)"; ctx.shadowBlur = 16; ctx.fillStyle = "rgba(87,217,119,.5)"; ctx.beginPath(); ctx.arc(g.gx, 420, 40, 0, 7); ctx.fill(); ctx.restore();
      ctx.strokeStyle = "rgba(190,255,205,.9)"; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(g.gx, 420, 40, 0, 7); ctx.stroke();
      ctx.fillStyle = "#fff"; ctx.font = "14px sans-serif"; ctx.fillText("GOAL", g.gx, 424); ctx.font = "46px sans-serif"; ctx.fillText("🥌", g.px, 436); ctx.font = "15px sans-serif"; ctx.fillText("drag the stone into the goal, let go", VW / 2, 560); } }
];
function fairnessCheck() {
  const winAtMax = BASE_WINDOW / MAX_SPEEDUP;
  const rows = []; let ok = winAtMax >= 1.8;
  rows.push("Window at max speed (" + MAX_SPEEDUP + "x): " + winAtMax.toFixed(2) + "s (floor 1.80s) — " + (winAtMax >= 1.8 ? "PASS" : "FAIL"));
  for (const gm of GAMES) {
    const tapOk = gm.taps <= 8, zoneOk = gm.zone === null || gm.zone >= 0.12;
    if (!tapOk || !zoneOk) ok = false;
    rows.push(gm.word + " needs " + gm.taps + " taps" + (gm.zone !== null ? ", zone " + Math.round(gm.zone * 100) + "% of sweep" : "") + " — " + (tapOk && zoneOk ? "PASS" : "FAIL"));
  }
  return { ok, rows, winAtMax };
}

/* ---------------- visual helpers ---------------- */
// shared glass-panel look for menu / result cards
function glassPanel(x, y, w, h, r) {
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,.55)"; ctx.shadowBlur = 26; ctx.shadowOffsetY = 10;
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, "rgba(74,54,16,.88)"); g.addColorStop(1, "rgba(30,20,4,.92)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill();
  ctx.restore();
  ctx.lineWidth = 1.5; ctx.strokeStyle = "rgba(255,210,62,.35)";
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.stroke();
  ctx.strokeStyle = "rgba(255,255,255,.12)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x + r, y + 1); ctx.lineTo(x + w - r, y + 1); ctx.stroke();
}

/* ---------------- flow ---------------- */
let state = "menu"; // menu, play, over
let score, misses, cleared, g, gTime, gWindow, between, betweenT, lastResult;
function speedup() { return Math.min(MAX_SPEEDUP, 1 + 0.25 * Math.floor(cleared / 4)); }
function startGame() {
  score = 0; misses = 0; cleared = 0; between = 0;
  nextGame(); state = "play";
}
function nextGame() {
  const def = GAMES[Math.floor(Math.random() * GAMES.length)];
  g = { def, speed: speedup(), done: false, fail: false };
  def.start && def.start(g);
  gWindow = BASE_WINDOW / g.speed; gTime = 0; between = 0;
  sfx("next");
}
function update(dt) {
  if (state !== "play") return;
  if (between > 0) { betweenT -= dt; if (betweenT <= 0) nextGame(); return; }
  gTime += dt;
  if (g.def.update) g.def.update(g, dt);
  if (g.done || gTime >= gWindow) {
    const won = g.done && !g.fail;
    lastResult = won;
    if (won) { cleared++; score = cleared; sfx("good"); }
    else { misses++; sfx("bad"); }
    if (misses >= 4) {
      state = "over";
      const best = parseInt(storeGet("microMayhemBest") || "0", 10);
      if (score > best) storeSet("microMayhemBest", String(score));
      return;
    }
    between = 1; betweenT = 0.85;
  }
}
function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#3a2b10"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(scale, 0, 0, scale, ox, oy);
  ctx.textAlign = "center";
  if (state === "menu") {
    glassPanel(20, 92, VW - 40, 262, 22);
    const titleG = ctx.createLinearGradient(0, 96, 0, 140); titleG.addColorStop(0, "#ffffff"); titleG.addColorStop(0.55, "#ffe98a"); titleG.addColorStop(1, "#ffb52e");
    ctx.fillStyle = titleG; ctx.font = "bold 42px sans-serif"; ctx.fillText("MICRO MAYHEM", VW / 2, 130);
    ctx.fillStyle = "#f5ecd7"; ctx.font = "16px sans-serif";
    ctx.fillText("One word. Four seconds. No mercy.", VW / 2, 168);
    ctx.fillText(GAMES.length + " tiny games, faster every four you clear.", VW / 2, 192);
    ctx.fillText("Four misses and the mayhem ends.", VW / 2, 216);
    const best = storeGet("microMayhemBest");
    if (best) { ctx.font = "bold 17px sans-serif"; ctx.fillText("Best streak: " + best, VW / 2, 262); }
    ctx.font = "bold 21px sans-serif"; ctx.fillText("TAP TO START", VW / 2, 330);
    if (QA_MODE) drawQA();
    return;
  }
  if (state === "over") {
    glassPanel(30, 252, VW - 60, 152, 20);
    const og = ctx.createLinearGradient(0, 272, 0, 308); og.addColorStop(0, "#ffffff"); og.addColorStop(1, "#ffb52e");
    ctx.fillStyle = og; ctx.font = "bold 36px sans-serif"; ctx.fillText("MAYHEM OVER", VW / 2, 300);
    ctx.fillStyle = "#fff"; ctx.font = "20px sans-serif"; ctx.fillText("You cleared " + score + " microgames", VW / 2, 344);
    ctx.fillStyle = "#e8dcc0"; ctx.font = "16px sans-serif"; ctx.fillText("Tap to play again", VW / 2, 384);
    return;
  }
  if (between > 0) {
    glassPanel(VW / 2 - 150, 292, 300, 92, 20);
    ctx.save(); ctx.shadowColor = lastResult ? "rgba(87,217,119,.7)" : "rgba(229,83,75,.7)"; ctx.shadowBlur = 16;
    ctx.fillStyle = lastResult ? "#7ee787" : "#ff8a80"; ctx.font = "bold 54px sans-serif";
    ctx.fillText(lastResult ? "✔ NICE!" : "✘ MISS", VW / 2, 356);
    ctx.restore();
    return;
  }
  // stage backdrop per game — gradient arena with a soft inner glow
  const arenaG = ctx.createLinearGradient(0, 120, 0, 640); arenaG.addColorStop(0, "#6b5013"); arenaG.addColorStop(0.5, "#54400f"); arenaG.addColorStop(1, "#42300a");
  ctx.fillStyle = arenaG; ctx.beginPath(); ctx.roundRect(24, 120, VW - 48, 520, 18); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.05)";
  for (let i = 0; i < 26; i++) { const dxp = 44 + (i * 149) % (VW - 96), dyp = 140 + (i * 211) % 480; ctx.beginPath(); ctx.arc(dxp, dyp, 2, 0, 7); ctx.fill(); }
  ctx.strokeStyle = "rgba(255,210,62,.75)"; ctx.lineWidth = 3; ctx.beginPath(); ctx.roundRect(24, 120, VW - 48, 520, 18); ctx.stroke();
  ctx.strokeStyle = "rgba(255,255,255,.14)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.roundRect(28, 124, VW - 56, 512, 15); ctx.stroke();
  g.def.draw(g);
  // instruction + timer + lives
  ctx.save(); ctx.shadowColor = "rgba(255,210,62,.55)"; ctx.shadowBlur = 16;
  const wordG = ctx.createLinearGradient(0, 48, 0, 88); wordG.addColorStop(0, "#ffffff"); wordG.addColorStop(0.55, "#ffe98a"); wordG.addColorStop(1, "#ffb52e");
  ctx.fillStyle = wordG; ctx.font = "bold 44px sans-serif"; ctx.fillText(g.def.word, VW / 2, 84); ctx.restore();
  const frac = Math.max(0, 1 - gTime / gWindow);
  ctx.fillStyle = "rgba(0,0,0,.5)"; ctx.beginPath(); ctx.roundRect(40, 668, VW - 80, 14, 7); ctx.fill();
  if (frac > 0.01) { const tg = ctx.createLinearGradient(40, 0, VW - 40, 0); if (frac > 0.3) { tg.addColorStop(0, "#8bf79b"); tg.addColorStop(1, "#35b558"); } else { tg.addColorStop(0, "#ff9d5c"); tg.addColorStop(1, "#e5534b"); } ctx.fillStyle = tg; ctx.beginPath(); ctx.roundRect(40, 668, Math.max(14, (VW - 80) * frac), 14, 7); ctx.fill(); }
  ctx.fillStyle = "rgba(24,16,2,.5)"; ctx.beginPath(); ctx.roundRect(10, 12, VW - 20, 58, 14); ctx.fill();
  ctx.lineWidth = 1; ctx.strokeStyle = "rgba(255,210,62,.3)"; ctx.beginPath(); ctx.roundRect(10, 12, VW - 20, 58, 14); ctx.stroke();
  ctx.fillStyle = "#fff"; ctx.font = "bold 15px sans-serif"; ctx.textAlign = "left";
  ctx.fillText("CLEARED " + cleared, 26, 40);
  ctx.textAlign = "right";
  ctx.fillText("MISSES " + "✘".repeat(misses) + "·".repeat(Math.max(0, 4 - misses)), VW - 26, 40);
  ctx.fillText("SPEED x" + speedup().toFixed(2).replace(/\.?0+$/, ""), VW - 26, 62);
  ctx.textAlign = "center";
}
function drawQA() {
  const r = fairnessCheck();
  ctx.fillStyle = "rgba(0,0,0,.88)"; ctx.fillRect(6, 380, VW - 12, 300);
  ctx.fillStyle = r.ok ? "#7ee787" : "#ff7b72"; ctx.font = "bold 15px sans-serif"; ctx.textAlign = "left";
  ctx.fillText("QA FAIRNESS: " + (r.ok ? "PASS" : "FAIL"), 16, 406);
  ctx.fillStyle = "#fff"; ctx.font = "11.5px sans-serif";
  r.rows.forEach((row, i) => ctx.fillText(row, 16, 430 + i * 20));
  window.__qaFairness = r;
}

/* ---------------- loop & input ---------------- */
let last = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - (last || ts)) / 1000); last = ts;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
function toGame(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * VW, y: (e.clientY - r.top) / r.height * VH };
}
canvas.addEventListener("pointerdown", e => {
  initAudio();
  if (state === "menu") { startGame(); return; }
  if (state === "over") { state = "menu"; return; }
  if (between > 0) return;
  const p = toGame(e);
  if (g.def.down) g.def.down(g, p.x, p.y);
  if (g.def.tap) g.def.tap(g, p.x, p.y);
});
canvas.addEventListener("pointermove", e => {
  if (state !== "play" || between > 0 || !g) return;
  const p = toGame(e);
  if (g.def.move) g.def.move(g, p.x);
});
window.addEventListener("pointerup", () => {
  if (state === "play" && between === 0 && g && g.def.up) g.def.up(g);
});
window.addEventListener("keydown", e => {
  initAudio();
  if (state === "menu" && e.code === "Enter") { startGame(); return; }
  if (state !== "play" || between > 0 || !g) return;
  if (e.code === "ArrowLeft" && g.def.key) g.def.key(g, -1);
  if (e.code === "ArrowRight" && g.def.key) g.def.key(g, 1);
  if (e.code === "Space") {
    if (g.def.key) g.def.key(g, 0);
    if (g.def.tap && (g.def === GAMES[1] || g.def === GAMES[5] || g.def === GAMES[7])) g.def.tap(g, VW / 2, VH / 2);
    e.preventDefault();
  }
});
document.getElementById("muteBtn").addEventListener("click", e => { e.stopPropagation(); muted = !muted; e.target.textContent = muted ? "🔇" : "🔊"; });
</script>
