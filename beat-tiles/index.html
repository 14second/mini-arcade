<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0618">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Beat Tiles</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #0b0618; overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas {
    position: fixed; inset: 0; display: block;
    touch-action: none;
  }
  #muteBtn {
    position: fixed; top: 10px; right: 10px; z-index: 10;
    width: 46px; height: 46px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(20,14,44,0.72); color: #fff;
    font-size: 22px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    touch-action: none; user-select: none; -webkit-user-select: none;
    padding: 0;
  }
  #muteBtn:active { background: rgba(60,40,120,0.85); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="muteBtn" aria-label="Toggle sound">🔊</button>
<script>
// iOS audio routing: Web Audio defaults to the "ambient" channel, which the
// iPhone silent switch mutes entirely. Route it to the media/playback
// channel (iOS 17+ Audio Session API) on the first user gesture and inside
// audio init, so game music/SFX play even with silent mode on.
function iosPlaybackSession() {
  try { if ('audioSession' in navigator) navigator.audioSession.type = 'playback'; } catch (e) {}
}
document.addEventListener('pointerdown', iosPlaybackSession, true);
document.addEventListener('touchstart', iosPlaybackSession, true);

"use strict";
/* ============================================================
   BEAT TILES — a piano-tiles rhythm tapper
   The music IS the clock: a lookahead step-sequencer schedules
   8th notes ~0.15s ahead on the Web Audio clock, and every tile
   is spawned from that same schedule so it lands in the hit zone
   exactly on its beat. Melody notes sound only when YOU hit them.
   ============================================================ */

// ---------- Canvas / sizing ----------
var canvas = document.getElementById("game");
var ctx = canvas.getContext("2d");
var W = window.innerWidth;
var H = window.innerHeight;

function resize() {
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

// ---------- Derived layout (recomputed from W/H every frame) ----------
function playWidth() { return Math.min(W, 520); }
function playX() { return (W - playWidth()) / 2; }
function laneW() { return playWidth() / 4; }
function hitZoneH() { return H * 0.12; }
function hitZoneTop() { return H - hitZoneH() - H * 0.055; }
function hitZoneCenter() { return hitZoneTop() + hitZoneH() / 2; }
function tileH() { return Math.max(58, Math.min(110, H * 0.13)); }
function tileW() { return laneW() * 0.86; }

// ---------- Timing / music constants ----------
var BPM = 120;
var STEP_DUR = 60 / BPM / 2;          // 8th note = 0.25s at 120 BPM
var LEAD_STEPS = 8;                   // tiles spawn 8 steps (2s) early
var TRAVEL_TIME = LEAD_STEPS * STEP_DUR; // 2.0 seconds from top to zone
var HIT_WINDOW = 0.30;                // generous: seconds either side of the beat
var SLOPPY_WINDOW = 0.45;             // off-beat leeway: tap this close and the tile still counts, for +2 and no combo growth
var LOOKAHEAD = 0.15;                 // sequencer schedules this far ahead

function scrollSpeed() { return hitZoneCenter() / TRAVEL_TIME; } // px per second

// ---------- Audio (synth only, lazy, gesture-gated) ----------
var AC = null;
var masterGain = null;
var muted = false;

function ensureAudio() {
  iosPlaybackSession();
  if (!AC) {
    try {
      var Ctor = window.AudioContext || window.webkitAudioContext;
      if (Ctor) {
        AC = new Ctor();
        masterGain = AC.createGain();
        masterGain.gain.value = muted ? 0 : 0.9;
        masterGain.connect(AC.destination);
      }
    } catch (e) { AC = null; }
  }
  if (AC && AC.state === "suspended") { AC.resume(); }
}

function nowSec() {
  return AC ? AC.currentTime : performance.now() / 1000;
}

// Generic synth blip.
function beep(freq, dur, type, vol, slide, delaySec) {
  if (!AC || muted) return;
  type = type || "sine";
  vol = (vol === undefined) ? 0.2 : vol;
  delaySec = delaySec || 0;
  var t0 = AC.currentTime + delaySec;
  var osc = AC.createOscillator();
  var g = AC.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g); g.connect(masterGain);
  osc.start(t0); osc.stop(t0 + dur + 0.03);
}

function midiFreq(m) { return 440 * Math.pow(2, (m - 69) / 12); }

// Pleasant pluck for a hit tile: triangle fundamental + soft sine octave.
function pluck(midi, delaySec) {
  var f = midiFreq(midi);
  beep(f, 0.34, "triangle", 0.34, 0, delaySec || 0);
  beep(f * 2, 0.18, "sine", 0.10, 0, delaySec || 0);
}
function buzz(delaySec) {
  beep(110, 0.28, "sawtooth", 0.26, -55, delaySec || 0);
  beep(82, 0.28, "square", 0.14, -30, delaySec || 0);
}
function startJingle() {
  var notes = [60, 64, 67, 72];
  for (var i = 0; i < notes.length; i++) pluck(notes[i], i * 0.07);
}
function gameOverJingle() {
  var notes = [67, 64, 62, 60];
  for (var i = 0; i < notes.length; i++) beep(midiFreq(notes[i]), 0.26, "triangle", 0.24, 0, i * 0.13);
  buzz(0.05);
}

// ---------- Mute ----------
var muteBtn = document.getElementById("muteBtn");
function setMuted(m) {
  muted = m;
  muteBtn.textContent = muted ? "🔇" : "🔊";
  if (masterGain && AC) masterGain.gain.setValueAtTime(muted ? 0 : 0.9, AC.currentTime);
}
muteBtn.addEventListener("pointerdown", function (e) {
  e.stopPropagation();
  e.preventDefault();
  ensureAudio();
  setMuted(!muted);
});
muteBtn.addEventListener("click", function (e) { e.stopPropagation(); });

// ---------- Game state ----------
var state = "menu"; // "menu" | "play" | "over"
var score = 0;
var combo = 0;
var bestCombo = 0;
var hiScore = 0;
try { hiScore = parseInt(localStorage.getItem("beattiles_hi") || "0", 10) || 0; } catch (e) { hiScore = 0; }

var tiles = [];       // {lane, midi, time, id}
var pops = [];        // {x, y, text, color, life, maxLife, vy}
var particles = [];   // {x, y, vx, vy, color, life, maxLife, r}
var laneFlash = [-9, -9, -9, -9]; // AC-time of last hit per lane
var lanePress = [-9, -9, -9, -9]; // AC-time of last press per lane
var shake = 0;
var overReason = "";
var overAt = 0;
var tileSeq = 0;

// Sequencer state
var seqStep = 0;        // next step to schedule
var nextStepTime = 0;   // AC time of next step
var songStartTime = 0;

// ---------- Melody / chart generation ----------
// Cheerful C-major pentatonic.
var PENTA = [60, 62, 64, 67, 69, 72, 74, 76, 79, 81];
var LANE_COLORS = ["#00e5ff", "#ff4ecd", "#ffe93d", "#3dff8f"];
var LANE_NAMES = ["D", "F", "J", "K"];

// Small deterministic-ish RNG (mulberry32), reseeded each run.
var rngState = 1;
function rng() {
  rngState |= 0; rngState = (rngState + 0x6D2B79F5) | 0;
  var t = Math.imul(rngState ^ (rngState >>> 15), 1 | rngState);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

var genMelodyIdx = 4;   // index into PENTA
var genLastLane = -1;
var genSameLaneRun = 0;
var genConsecTiles = 0;

// Decide the tile (if any) for a future step, and push it.
function generateTile(stepIndex, stepTime) {
  // One quiet intro bar: no tiles for the first 8 steps of the song.
  if (stepIndex < LEAD_STEPS + 8) { genConsecTiles = 0; return; }

  var segment = Math.floor(stepIndex / 32); // 32-step chart segments
  var density = Math.min(0.42 + segment * 0.045, 0.74);
  var pos = stepIndex % 8; // position inside a 4/4 bar of 8ths
  var posMul = 1.0;
  if (pos === 0) posMul = 1.5;        // downbeat: almost always a tile
  else if (pos === 4) posMul = 1.3;   // beat 3
  else if (pos === 2 || pos === 6) posMul = 1.05; // beats 2 & 4
  else posMul = 0.62;                 // off-8ths: sparser, syncopated

  if (genConsecTiles >= 4) { genConsecTiles = 0; return; } // forced breath

  if (rng() > density * posMul) { genConsecTiles = 0; return; }

  // Lane: pseudo-random, avoid camping on one lane.
  var lane = Math.floor(rng() * 4);
  if (lane === genLastLane) {
    genSameLaneRun++;
    if (genSameLaneRun >= 2 && rng() < 0.8) {
      lane = (lane + 1 + Math.floor(rng() * 3)) % 4;
      genSameLaneRun = 0;
    }
  } else {
    genSameLaneRun = 0;
  }
  genLastLane = lane;

  // Melody: walk the pentatonic scale so it feels like a tune.
  var move = Math.floor(rng() * 5) - 2; // -2..+2
  if (pos === 0 && rng() < 0.5) move = (genMelodyIdx > 4) ? -1 : 1; // lean home
  genMelodyIdx = Math.max(0, Math.min(PENTA.length - 1, genMelodyIdx + move));
  var midi = PENTA[genMelodyIdx];

  genConsecTiles++;
  tiles.push({ lane: lane, midi: midi, time: stepTime, id: tileSeq++ });
}

// ---------- Sequencer (the game clock) ----------
// Chord progression I–V–vi–IV in C, one chord per bar (8 steps).
var CHORD_ROOTS = [48, 55, 57, 53];           // C3 G3 A3 F3 (midi, bass — kept in phone-speaker range; a C2 fundamental is inaudible on small speakers)
var CHORD_TONES = [
  [60, 64, 67], [59, 62, 67], [60, 64, 69], [60, 65, 69]
];

function scheduleStep(step, time) {
  var delay = Math.max(0, time - nowSec());
  var bar = Math.floor(step / 8) % 4;
  var pos = step % 8;

  // Bass on beats 1 and 3 — triangle in the C3 range plus a soft
  // octave-up component, so the groove is audible on phone speakers.
  if (pos === 0 || pos === 4) {
    beep(midiFreq(CHORD_ROOTS[bar]), 0.34, "triangle", 0.30, 0, delay);
    beep(midiFreq(CHORD_ROOTS[bar] + 12), 0.22, "sine", 0.10, 0, delay);
  }
  // Chord pad at the top of each bar.
  if (pos === 0) {
    var tones = CHORD_TONES[bar];
    for (var i = 0; i < tones.length; i++) {
      beep(midiFreq(tones[i]), STEP_DUR * 7.5, "triangle", 0.10, 0, delay);
    }
  }
  // Gentle tick on off-8ths keeps the groove felt.
  if (pos % 2 === 1) {
    beep(6200, 0.03, "sine", 0.05, 0, delay);
  }

  // Tiles derive from this same schedule: spawn LEAD_STEPS ahead so a
  // tile created now lands in the hit zone exactly on its beat.
  generateTile(step + LEAD_STEPS, time + LEAD_STEPS * STEP_DUR);
}

function runSequencer() {
  if (state !== "play" || !AC) return;
  while (nextStepTime < AC.currentTime + LOOKAHEAD) {
    scheduleStep(seqStep, nextStepTime);
    seqStep++;
    nextStepTime += STEP_DUR;
  }
}

// ---------- Flow ----------
function startGame() {
  ensureAudio();
  score = 0;
  combo = 0;
  bestCombo = 0;
  tiles = [];
  pops = [];
  particles = [];
  shake = 0;
  overReason = "";
  tileSeq = 0;
  genMelodyIdx = 4;
  genLastLane = -1;
  genSameLaneRun = 0;
  genConsecTiles = 0;
  rngState = (Math.floor(Math.random() * 0x7fffffff) ^ Date.now()) | 0;
  if (rngState === 0) rngState = 12345;
  for (var i = 0; i < 4; i++) { laneFlash[i] = -9; lanePress[i] = -9; }

  state = "play";
  songStartTime = nowSec() + 0.08;
  seqStep = 0;
  nextStepTime = songStartTime;
  startJingle();
}

function endGame(reason) {
  if (state !== "play") return;
  state = "over";
  overReason = reason;
  overAt = nowSec();
  shake = 14;
  if (score > hiScore) {
    hiScore = score;
    try { localStorage.setItem("beattiles_hi", String(hiScore)); } catch (e) {}
  }
  gameOverJingle();
}

// ---------- Input ----------
function laneFromX(x) {
  var lx = x - playX();
  if (lx < 0 || lx >= playWidth()) return -1;
  return Math.floor(lx / laneW());
}

function tapLane(lane) {
  if (state !== "play" || lane < 0 || lane > 3) return;
  var now = nowSec();
  lanePress[lane] = now;

  // Closest unhit tile in this lane.
  var best = null;
  var bestAbs = Infinity;
  for (var i = 0; i < tiles.length; i++) {
    var t = tiles[i];
    if (t.lane !== lane) continue;
    var d = Math.abs(t.time - now);
    if (d < bestAbs) { bestAbs = d; best = t; }
  }

  if (best && bestAbs <= HIT_WINDOW) {
    // HIT — the player plays the melody note.
    tiles.splice(tiles.indexOf(best), 1);
    combo++;
    if (combo > bestCombo) bestCombo = combo;
    var gained = 10;
    if (combo > 0 && combo % 10 === 0) gained += 20; // combo bonus
    score += gained;
    laneFlash[lane] = now;
    pluck(best.midi);
    var cx = playX() + laneW() * lane + laneW() / 2;
    var cy = hitZoneCenter();
    pops.push({
      x: cx, y: cy - tileH() * 0.4, text: "+" + gained,
      color: LANE_COLORS[lane], life: 0, maxLife: 0.55, vy: -70
    });
    if (combo >= 5) {
      pops.push({
        x: cx, y: cy - tileH() * 0.4 - 30, text: combo + " COMBO",
        color: "#ffffff", life: 0, maxLife: 0.6, vy: -46
      });
    }
    for (var p = 0; p < 10; p++) {
      var a = Math.random() * Math.PI * 2;
      var sp = 60 + Math.random() * 190;
      particles.push({
        x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
        color: LANE_COLORS[lane], life: 0, maxLife: 0.4 + Math.random() * 0.25,
        r: 2 + Math.random() * 3
      });
    }
  } else if (best && bestAbs <= SLOPPY_WINDOW) {
    // OFF-BEAT — a bit off the beat: the tile still counts, but it pays
    // almost nothing (+2, melody note plays, combo does not grow).
    tiles.splice(tiles.indexOf(best), 1);
    score += 2;
    laneFlash[lane] = now;
    pluck(best.midi);
    var sx = playX() + laneW() * lane + laneW() / 2;
    pops.push({
      x: sx, y: hitZoneCenter() - tileH() * 0.4, text: "OFF-BEAT +2",
      color: "#b8b8d0", life: 0, maxLife: 0.55, vy: -60
    });
  } else {
    // Wrong tap ends the run (per the brief).
    endGame("Wrong tap!");
  }
}

canvas.addEventListener("pointerdown", function (e) {
  e.preventDefault();
  ensureAudio();
  if (state === "menu" || state === "over") {
    // Small delay after game over so the fatal tap doesn't instantly restart.
    if (state === "over" && nowSec() - overAt < 0.35) return;
    startGame();
    return;
  }
  var lane = laneFromX(e.clientX);
  if (lane >= 0) tapLane(lane);
  else endGame("Wrong tap!");
});

window.addEventListener("keydown", function (e) {
  if (e.repeat) return;
  var k = e.key;
  if (k === "m" || k === "M") { ensureAudio(); setMuted(!muted); return; }
  ensureAudio();
  if (state === "menu" || state === "over") {
    if (k === " " || k === "Enter") {
      e.preventDefault();
      if (state === "over" && nowSec() - overAt < 0.35) return;
      startGame();
    }
    return;
  }
  if (state === "play") {
    if (k === " ") { e.preventDefault(); return; } // no accidental scroll
    var lane = -1;
    var up = k.toUpperCase();
    if (up === "D") lane = 0;
    else if (up === "F") lane = 1;
    else if (up === "J") lane = 2;
    else if (up === "K") lane = 3;
    else if (k === "1") lane = 0;
    else if (k === "2") lane = 1;
    else if (k === "3") lane = 2;
    else if (k === "4") lane = 3;
    else if (k === "ArrowLeft") lane = 0;
    else if (k === "ArrowDown") lane = 1;
    else if (k === "ArrowUp") lane = 2;
    else if (k === "ArrowRight") lane = 3;
    if (lane >= 0) { e.preventDefault(); tapLane(lane); }
  }
});

// ---------- Update ----------
function update(dt) {
  if (shake > 0) shake = Math.max(0, shake - dt * 34);

  var i;
  for (i = pops.length - 1; i >= 0; i--) {
    pops[i].life += dt;
    pops[i].y += pops[i].vy * dt;
    if (pops[i].life >= pops[i].maxLife) pops.splice(i, 1);
  }
  for (i = particles.length - 1; i >= 0; i--) {
    var pt = particles[i];
    pt.life += dt;
    pt.x += pt.vx * dt;
    pt.y += pt.vy * dt;
    pt.vy += 500 * dt;
    if (pt.life >= pt.maxLife) particles.splice(i, 1);
  }

  if (state !== "play") return;
  runSequencer();

  // Missed tile (scrolled past the forgiving window untouched) ends the run.
  var now = nowSec();
  for (i = 0; i < tiles.length; i++) {
    if (now - tiles[i].time > SLOPPY_WINDOW) {
      endGame("Missed tile!");
      break;
    }
  }
  // Drop tiles far above (safety; normally none survive the miss check).
  tiles = tiles.filter(function (t) { return t.time > now - 1; });
}

// ---------- Drawing helpers ----------
function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function text(str, x, y, size, color, align, weight) {
  ctx.font = (weight || "700") + " " + size + "px system-ui, sans-serif";
  ctx.textAlign = align || "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
}

// ---------- Draw ----------
function draw() {
  var now = nowSec();
  var px = playX(), pw = playWidth(), lw = laneW();
  var hzTop = hitZoneTop(), hzH = hitZoneH(), hzC = hitZoneCenter();

  ctx.save();
  if (shake > 0) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  }

  // Background gradient.
  var bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, "#150a30");
  bg.addColorStop(0.55, "#0b0618");
  bg.addColorStop(1, "#1c0b38");
  ctx.fillStyle = bg;
  ctx.fillRect(-20, -20, W + 40, H + 40);

  // Playfield backing.
  ctx.fillStyle = "rgba(255,255,255,0.035)";
  ctx.fillRect(px, 0, pw, H);

  // Lane tints + hit / press flashes.
  var li;
  for (li = 0; li < 4; li++) {
    if (li % 2 === 1) {
      ctx.fillStyle = "rgba(255,255,255,0.025)";
      ctx.fillRect(px + li * lw, 0, lw, H);
    }
    var flashAge = now - laneFlash[li];
    if (flashAge >= 0 && flashAge < 0.22) {
      ctx.fillStyle = LANE_COLORS[li];
      ctx.globalAlpha = 0.30 * (1 - flashAge / 0.22);
      ctx.fillRect(px + li * lw, 0, lw, H);
      ctx.globalAlpha = 1;
    }
    var pressAge = now - lanePress[li];
    if (pressAge >= 0 && pressAge < 0.15) {
      ctx.fillStyle = "#ffffff";
      ctx.globalAlpha = 0.10 * (1 - pressAge / 0.15);
      ctx.fillRect(px + li * lw, 0, lw, H);
      ctx.globalAlpha = 1;
    }
  }

  // Lane separators + outer edges.
  ctx.strokeStyle = "rgba(255,255,255,0.16)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (li = 0; li <= 4; li++) {
    var lx = px + li * lw;
    ctx.moveTo(lx, 0); ctx.lineTo(lx, H);
  }
  ctx.stroke();

  // Tiles.
  var th = tileH(), tw = tileW();
  var speed = scrollSpeed();
  for (var ti = 0; ti < tiles.length; ti++) {
    var t = tiles[ti];
    var yC = hzC - (t.time - now) * speed;
    if (yC < -th || yC > H + th) continue;
    var tx = px + t.lane * lw + (lw - tw) / 2;
    var ty = yC - th / 2;
    var inZone = Math.abs(t.time - now) <= HIT_WINDOW;
    ctx.save();
    ctx.shadowColor = LANE_COLORS[t.lane];
    ctx.shadowBlur = inZone ? 26 : 12;
    ctx.fillStyle = LANE_COLORS[t.lane];
    roundRect(tx, ty, tw, th, 12);
    ctx.fill();
    ctx.restore();
    // Inner shine + note dot.
    ctx.fillStyle = "rgba(255,255,255,0.28)";
    roundRect(tx + 6, ty + 6, tw - 12, th * 0.32, 8);
    ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.beginPath();
    ctx.arc(tx + tw / 2, yC + th * 0.18, Math.min(11, tw * 0.11), 0, Math.PI * 2);
    ctx.fill();
    if (inZone) {
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 3;
      roundRect(tx - 2, ty - 2, tw + 4, th + 4, 14);
      ctx.stroke();
    }
  }

  // Hit zone — pulses on the beat.
  var beatPhase = 0;
  if (state === "play" && AC) {
    beatPhase = ((now - songStartTime) / STEP_DUR) % 1;
    if (beatPhase < 0) beatPhase += 1;
  }
  var pulse = 1 - beatPhase; // 1 right on a step, decaying after
  var hzGrad = ctx.createLinearGradient(0, hzTop, 0, hzTop + hzH);
  hzGrad.addColorStop(0, "rgba(120,80,255,0.10)");
  hzGrad.addColorStop(0.5, "rgba(160,110,255," + (0.20 + 0.22 * pulse) + ")");
  hzGrad.addColorStop(1, "rgba(120,80,255,0.10)");
  ctx.save();
  ctx.shadowColor = "#8a5cff";
  ctx.shadowBlur = 14 + 22 * pulse;
  ctx.fillStyle = hzGrad;
  roundRect(px + 4, hzTop, pw - 8, hzH, 14);
  ctx.fill();
  ctx.restore();
  ctx.strokeStyle = "rgba(255,255,255," + (0.45 + 0.4 * pulse) + ")";
  ctx.lineWidth = 2;
  roundRect(px + 4, hzTop, pw - 8, hzH, 14);
  ctx.stroke();
  // Per-lane targets inside the zone.
  for (li = 0; li < 4; li++) {
    var cx = px + li * lw + lw / 2;
    ctx.strokeStyle = LANE_COLORS[li];
    ctx.globalAlpha = 0.55 + 0.35 * pulse;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, hzC, Math.min(lw * 0.30, hzH * 0.34), 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // Particles.
  for (var pi = 0; pi < particles.length; pi++) {
    var pp = particles[pi];
    ctx.globalAlpha = 1 - pp.life / pp.maxLife;
    ctx.fillStyle = pp.color;
    ctx.beginPath();
    ctx.arc(pp.x, pp.y, pp.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Key labels under the hit zone.
  var labelSize = Math.max(13, Math.min(20, lw * 0.22));
  for (li = 0; li < 4; li++) {
    text(LANE_NAMES[li], px + li * lw + lw / 2, hzTop + hzH + (H - hzTop - hzH) / 2,
      labelSize, LANE_COLORS[li], "center", "800");
  }

  // HUD: score + combo during play.
  if (state === "play" || state === "over") {
    text(String(score), W / 2, 34, Math.min(44, W * 0.11), "#ffffff", "center", "800");
    if (combo >= 2) {
      var popScale = 1 + Math.max(0, 0.25 - (now - laneFlash[0]) * 0); // steady size
      text(combo + " combo", W / 2, 34 + Math.min(44, W * 0.11) * 0.75,
        Math.min(20, W * 0.05) * popScale, "#ffe93d", "center", "700");
    }
    text("HI " + hiScore, 14, 24, 15, "rgba(255,255,255,0.65)", "left", "700");
  }

  // Floating pops.
  for (var oi = 0; oi < pops.length; oi++) {
    var o = pops[oi];
    ctx.globalAlpha = 1 - o.life / o.maxLife;
    text(o.text, o.x, o.y, 20, o.color, "center", "800");
  }
  ctx.globalAlpha = 1;

  // Menu overlay.
  if (state === "menu") {
    ctx.fillStyle = "rgba(5,2,16,0.62)";
    ctx.fillRect(0, 0, W, H);
    var titleSize = Math.min(64, W * 0.145);
    text("BEAT TILES", W / 2, H * 0.24, titleSize, "#ffffff", "center", "900");
    text("♪  ♫  ♪", W / 2, H * 0.24 + titleSize * 0.85, 26, "#ff4ecd", "center", "700");
    text("TAP THE TILES ON THE BEAT", W / 2, H * 0.44, Math.min(24, W * 0.06), "#ffe93d", "center", "800");
    var ins = [
      "Tiles fall to the glowing hit zone —",
      "tap each one exactly on its beat to play its note.",
      "",
      "Tap a lane, or press  D  F  J  K  (or 1–4).",
      "Miss a tile or tap wrong… and the song ends.",
      "Chain hits for combos and bonus points!"
    ];
    for (var ii = 0; ii < ins.length; ii++) {
      text(ins[ii], W / 2, H * 0.52 + ii * 26, Math.min(17, W * 0.042),
        "rgba(255,255,255,0.88)", "center", "500");
    }
    if (hiScore > 0) {
      text("High score: " + hiScore, W / 2, H * 0.74, 18, "#3dff8f", "center", "700");
    }
    var blink = (Math.floor(performance.now() / 500) % 2 === 0);
    text(blink ? "▶  TAP ANYWHERE TO START" : "TAP ANYWHERE TO START",
      W / 2, H * 0.82, Math.min(21, W * 0.052), "#00e5ff", "center", "800");
  }

  // Game-over overlay.
  if (state === "over") {
    ctx.fillStyle = "rgba(5,2,16,0.66)";
    ctx.fillRect(0, 0, W, H);
    text("SONG OVER", W / 2, H * 0.28, Math.min(52, W * 0.12), "#ff4ecd", "center", "900");
    text(overReason, W / 2, H * 0.38, Math.min(24, W * 0.06), "#ffe93d", "center", "800");
    text("Score  " + score, W / 2, H * 0.50, Math.min(34, W * 0.085), "#ffffff", "center", "800");
    text("Best combo  " + bestCombo, W / 2, H * 0.57, 19, "rgba(255,255,255,0.85)", "center", "600");
    text("High score  " + hiScore, W / 2, H * 0.63, 19, "#3dff8f", "center", "700");
    if (score >= hiScore && score > 0) {
      text("★ NEW HIGH SCORE ★", W / 2, H * 0.69, 18, "#ffe93d", "center", "800");
    }
    var blink2 = (Math.floor(performance.now() / 500) % 2 === 0);
    text(blink2 ? "▶  TAP TO PLAY AGAIN" : "TAP TO PLAY AGAIN",
      W / 2, H * 0.80, Math.min(21, W * 0.052), "#00e5ff", "center", "800");
  }

  ctx.restore();
}

// ---------- Main loop ----------
var lastTs = 0;
function frame(ts) {
  var dt = Math.min(0.05, lastTs ? (ts - lastTs) / 1000 : 0.016);
  lastTs = ts;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- QA hook ----------
window.__game = {
  get state() { return state; },
  get score() { return score; },
  start: function () { startGame(); }
};
</script>
</body>
