<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#0c0c12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Simon</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:#0c0c12;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    touch-action:none; user-select:none; -webkit-user-select:none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { position:fixed; inset:0; display:block; touch-action:none; }
  #muteBtn {
    position:fixed; top:10px; right:10px; z-index:10;
    width:48px; height:48px; border-radius:12px;
    border:2px solid rgba(255,255,255,.4); background:rgba(10,10,16,.62);
    color:#fff; font-size:22px; line-height:1; cursor:pointer;
    touch-action:none; user-select:none; -webkit-user-select:none;
    display:flex; align-items:center; justify-content:center; padding:0;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="muteBtn" aria-label="Toggle sound">🔊</button>
<script>
// iOS audio routing: route Web Audio to the media/playback channel (iOS 17+
// Audio Session API) on the first gesture and inside audio init, so sound
// plays even with the silent switch on.
function iosPlaybackSession() {
  try { if ('audioSession' in navigator) navigator.audioSession.type = 'playback'; } catch (e) {}
}
document.addEventListener('pointerdown', iosPlaybackSession, true);
// Sleep in the background (2026-11-09): the wrapper's pauseTimers stops
// JS timers, but the Web Audio graph is a separate engine — suspend the
// audio context whenever the page is hidden so nothing keeps the CPU
// (or the sound) running while the app is in the background.
document.addEventListener("visibilitychange", function () {
  try {
    var c = window.__maCtx;
    if (document.hidden) {
      window.__maHidden = true;
      if (c) {
        if (c.close) { try { var p = c.close(); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
        if (c.suspend && c.state === "running") { try { c.suspend(); } catch (e) {} }
        window.__maCtx = null;
      }
    } else {
      window.__maHidden = false;
      var ac = c || (window.__maActx && window.__maActx());
      if (ac && ac.state === "suspended" && ac.resume) { try { ac.resume(); } catch (e) {} }
    }
  } catch (e) {}
});

document.addEventListener('touchstart', iosPlaybackSession, true);

"use strict";
/* ============================================================
   SIMON — watch the pads, listen to the tones, repeat the
   sequence. It grows by one every round. Strict rules:
   one wrong pad ends the game. Score = rounds completed.
   Keys Q W A S work too.
   ============================================================ */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1, u = 4;
let boardX = 0, boardY = 0, boardS = 0, padGap = 10;
const HUD_H = 66;

// Pad order: 0 top-left, 1 top-right, 2 bottom-left, 3 bottom-right
const PADS_DEF = [
  { color: "#37d67a", dark: "#14532d", midi: 64 }, // E4 green
  { color: "#ff5252", dark: "#5f1d1d", midi: 68 }, // G#4 red — pleasant spacing
  { color: "#ffd93d", dark: "#5f4d0d", midi: 60 }, // C4 yellow
  { color: "#4da3ff", dark: "#1d3a5f", midi: 57 }  // A3 blue
];

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  u = Math.min(W, H) / 100;
  padGap = Math.max(8, u * 2.2);
  boardS = Math.min(W - 28, H - HUD_H - 120);
  boardX = Math.round((W - boardS) / 2);
  boardY = Math.round(HUD_H + (H - HUD_H - boardS) / 2 - 10);
}
window.addEventListener("resize", resize);

// ---------- Audio ----------
let actx = null, muted = false;
const muteBtn = document.getElementById("muteBtn");
function initAudio() {
  iosPlaybackSession();
  if (!actx || actx.state === "closed") {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) actx = new AC(); window.__maCtx = actx; window.__maActx = function () { return actx; };;
    } catch (e) { actx = null; }
    if (actx) startMusicScheduler();
  }
  if (actx && actx.state === "suspended") actx.resume();
}
function midiFreq(m) { return 440 * Math.pow(2, (m - 69) / 12); }
function padTone(i, dur) {
  if (!actx || muted) return;
  const t = actx.currentTime;
  const f = midiFreq(PADS_DEF[i].midi);
  const o = actx.createOscillator(), g = actx.createGain();
  const o2 = actx.createOscillator(), g2 = actx.createGain();
  o.type = "sine"; o.frequency.setValueAtTime(f, t);
  o2.type = "triangle"; o2.frequency.setValueAtTime(f * 2, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.22, t + 0.015);
  g.gain.setValueAtTime(0.22, t + Math.max(0.02, dur - 0.06));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  g2.gain.setValueAtTime(0.0001, t);
  g2.gain.exponentialRampToValueAtTime(0.06, t + 0.015);
  g2.gain.exponentialRampToValueAtTime(0.0001, t + dur * 0.7);
  o.connect(g); g.connect(actx.destination);
  o2.connect(g2); g2.connect(actx.destination);
  o.start(t); o.stop(t + dur + 0.03);
  o2.start(t); o2.stop(t + dur + 0.03);
}
function beep(freq, dur, type, vol, slide) {
  if (!actx || muted) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || "sawtooth";
  o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t + dur);
  g.gain.setValueAtTime(vol || 0.08, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function sfxWrong() { beep(196, 0.45, "sawtooth", 0.12, 98); beep(147, 0.45, "square", 0.07, 73); }
function sfxRound() { beep(784, 0.09, "triangle", 0.09); setTimeout(() => beep(1046, 0.12, "triangle", 0.09), 85); }

// Soft pad-only ambience under the game, BPM 72. Bass/chords >= MIDI 48.
const BPM = 72, STEP_DUR = 60 / BPM / 2;
const PADS_CH = [ [57,60,64], [53,57,60], [55,59,62], [52,55,59] ];
let musicStep = 0, nextNoteTime = 0, musicTimer = null;
function toneAt(midi, when, dur, type, vol) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(midiFreq(midi), when);
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(vol, when + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(when); o.stop(when + dur + 0.03);
}
function scheduleStep(step, when) {
  if (muted) return;
  if (step % 8 === 0) {
    const chord = PADS_CH[Math.floor(step / 8) % PADS_CH.length];
    for (let i = 0; i < chord.length; i++) toneAt(chord[i], when, STEP_DUR * 7.9, "triangle", 0.012);
  }
}
function startMusicScheduler() {
  if (musicTimer !== null || !actx) return;
  musicStep = 0; nextNoteTime = actx.currentTime + 0.06;
  musicTimer = setInterval(function () {
    if (!actx) return;
    if (nextNoteTime < actx.currentTime) nextNoteTime = actx.currentTime + 0.05;
    while (nextNoteTime < actx.currentTime + 0.12) {
      scheduleStep(musicStep, nextNoteTime);
      nextNoteTime += STEP_DUR; musicStep = (musicStep + 1) % 32;
    }
  }, 25);
}
function setMuted(m) { muted = m; muteBtn.textContent = muted ? "🔇" : "🔊"; }
muteBtn.addEventListener("pointerdown", function (e) {
  e.stopPropagation(); e.preventDefault(); initAudio(); setMuted(!muted);
});
muteBtn.addEventListener("click", function (e) { e.stopPropagation(); e.preventDefault(); });

// ---------- Game state ----------
let state = "menu"; // menu | show | input | over
let best = 0;
try { best = parseInt(localStorage.getItem("simon_best") || "0", 10) || 0; } catch (e) { best = 0; }
let seq = [], inputIdx = 0, litPad = -1, message = "";

function startGame() {
  initAudio();
  seq = []; inputIdx = 0; litPad = -1;
  state = "show";
  nextRound();
}
function nextRound() {
  seq.push(Math.floor(Math.random() * 4));
  inputIdx = 0;
  message = "Watch…";
  state = "show";
  showSequence();
}
function showSequence() {
  const stepMs = Math.max(240, 430 - seq.length * 9);
  const onMs = stepMs * 0.68;
  seq.forEach((pad, i) => {
    setTimeout(() => { litPad = pad; padTone(pad, onMs / 1000); }, 450 + i * stepMs);
    setTimeout(() => { if (litPad === pad) litPad = -1; }, 450 + i * stepMs + onMs);
  });
  setTimeout(() => { state = "input"; message = "Your turn — repeat it!"; }, 450 + seq.length * stepMs + 120);
}
function pressPad(i) {
  if (state !== "input") return;
  litPad = i;
  padTone(i, 0.22);
  setTimeout(() => { if (litPad === i) litPad = -1; }, 190);
  if (i !== seq[inputIdx]) {
    message = "";
    state = "over";
    sfxWrong();
    const rounds = seq.length - 1;
    if (rounds > best) { best = rounds; try { localStorage.setItem("simon_best", String(best)); } catch (e) {} }
    return;
  }
  inputIdx++;
  if (inputIdx >= seq.length) {
    state = "show";
    message = "Round " + seq.length + " cleared!";
    sfxRound();
    setTimeout(nextRound, 950);
  }
}

function padAt(x, y) {
  const half = (boardS - padGap) / 2;
  for (let i = 0; i < 4; i++) {
    const px = boardX + (i % 2) * (half + padGap);
    const py = boardY + Math.floor(i / 2) * (half + padGap);
    if (x >= px && x <= px + half && y >= py && y <= py + half) return i;
  }
  return -1;
}
canvas.addEventListener("pointerdown", function (e) {
  initAudio();
  if (state === "menu" || state === "over") { startGame(); return; }
  const i = padAt(e.clientX, e.clientY);
  if (i >= 0) pressPad(i);
});
const KEYMAP = { q: 0, w: 1, a: 2, s: 3, Q: 0, W: 1, A: 2, S: 3 };
window.addEventListener("keydown", function (e) {
  initAudio();
  if (state === "menu" || state === "over") {
    if (e.key === " " || e.key === "Enter") startGame();
    return;
  }
  if (e.key === "m" || e.key === "M") { setMuted(!muted); return; }
  if (e.key in KEYMAP) pressPad(KEYMAP[e.key]);
});

// ---------- Draw ----------
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function draw() {
  ctx.fillStyle = "#0c0c12"; ctx.fillRect(0, 0, W, H);
  // HUD
  ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#f2f2fa";
  ctx.font = "bold " + Math.round(u * 5) + "px system-ui, sans-serif";
  const rounds = state === "over" ? seq.length - 1 : Math.max(0, seq.length - (state === "input" ? 1 : 0));
  ctx.fillText("Round " + Math.max(1, seq.length), 14, HUD_H / 2);
  ctx.textAlign = "right";
  ctx.fillStyle = "#9a9ab0";
  ctx.fillText("Best " + best, W - 66, HUD_H / 2);
  // Pads
  const half = (boardS - padGap) / 2;
  for (let i = 0; i < 4; i++) {
    const px = boardX + (i % 2) * (half + padGap);
    const py = boardY + Math.floor(i / 2) * (half + padGap);
    const lit = litPad === i;
    ctx.fillStyle = lit ? PADS_DEF[i].color : PADS_DEF[i].dark;
    rr(px, py, half, half, 18); ctx.fill();
    if (lit) {
      ctx.strokeStyle = "rgba(255,255,255,0.85)"; ctx.lineWidth = 3;
      rr(px + 2, py + 2, half - 4, half - 4, 16); ctx.stroke();
    }
    ctx.fillStyle = lit ? "rgba(0,0,0,0.55)" : "rgba(255,255,255,0.35)";
    ctx.font = "bold " + Math.round(half * 0.2) + "px system-ui, sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(["Q","W","A","S"][i], px + half / 2, py + half / 2);
  }
  // Status line
  ctx.fillStyle = "#d8d8ea";
  ctx.font = Math.round(u * 4.6) + "px system-ui, sans-serif";
  ctx.textAlign = "center";
  const statusY = boardY + boardS + 42;
  if (state === "show" || state === "input") ctx.fillText(message, W / 2, statusY);
  if (state === "input") {
    ctx.fillStyle = "#9a9ab0";
    ctx.font = Math.round(u * 3.8) + "px system-ui, sans-serif";
    ctx.fillText((inputIdx + 1) + " of " + seq.length, W / 2, statusY + 30);
  }
  if (state === "menu" || state === "over") {
    ctx.fillStyle = "rgba(4,4,10,0.82)"; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold " + Math.round(u * 11) + "px system-ui, sans-serif";
    ctx.fillText("SIMON", W / 2, H * 0.28);
    ctx.fillStyle = "#e6e6f2";
    ctx.font = Math.round(u * 4.4) + "px system-ui, sans-serif";
    if (state === "menu") {
      ctx.fillText("Watch the pads light up and play their tones.", W / 2, H * 0.40);
      ctx.fillText("Then repeat the sequence by tapping them.", W / 2, H * 0.455);
      ctx.fillStyle = "#ffb3a7";
      ctx.fillText("Strict rules: one wrong pad ends the game.", W / 2, H * 0.51);
      ctx.fillStyle = "#9a9ab0";
      ctx.fillText("Score = rounds completed. Keys Q W A S work too.", W / 2, H * 0.565);
      if (best) ctx.fillText("Your best: " + best + " rounds", W / 2, H * 0.62);
    } else {
      ctx.fillStyle = "#ff8f7a";
      ctx.fillText("Wrong pad! You completed " + (seq.length - 1) + " round" + (seq.length - 1 === 1 ? "" : "s") + ".", W / 2, H * 0.42);
      ctx.fillStyle = "#9a9ab0";
      ctx.fillText("Best: " + best + " rounds", W / 2, H * 0.475);
    }
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold " + Math.round(u * 5) + "px system-ui, sans-serif";
    ctx.fillText(state === "menu" ? "TAP TO START" : "TAP TO PLAY AGAIN", W / 2, H * 0.68);
  }
}

// ---------- Loop ----------
function frame() {
  requestAnimationFrame(frame);
  draw();
}
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
