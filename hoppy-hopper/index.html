<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Hoppy Hopper</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden;
    background: radial-gradient(120% 90% at 50% 0%, #2b5a3a 0%, rgba(43,90,58,0) 55%), linear-gradient(180deg,#173d24,#0d2415 70%);
    font-family: "Avenir Next","Segoe UI",system-ui, sans-serif; }
  canvas { display: block; margin: 0 auto; touch-action: none; }
  #hud { position: fixed; top: 12px; left: 16px; color: #fff; font-size: 22px;
    font-weight: 800; text-shadow: 0 2px 6px rgba(0,0,0,.45); letter-spacing:.4px;
    background: rgba(14,32,20,.42); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,.28); border-radius: 16px; padding: 8px 16px 10px;
    box-shadow: 0 10px 28px rgba(0,0,0,.35); }
  #over { position: fixed; inset: 0; display: none; align-items: center; flex-direction: column;
    justify-content: center; background: radial-gradient(90% 70% at 50% 40%, rgba(20,40,28,.55), rgba(8,14,10,.82)); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); color: #fff;
    font-size: 38px; font-weight: 800; text-align: center; text-shadow: 0 4px 18px rgba(0,0,0,.5); }
</style>
</head>
<body>
<div id="hud">Score <span id="score">0</span><div id="best" style="font-size:14px;font-weight:600;opacity:.9">Best 0</div></div>
<div id="over">SPLAT!<br><span style="font-size:20px">tap to hop again</span></div>
<canvas id="g"></canvas>
<script>
// Hoppy Hopper — a tiny Crossy-Road-style hopping game in ~110 lines.
const cv = document.getElementById('g'), ctx = cv.getContext('2d');
const ROWS = 9, PLAYER_ROW = 2;
let W, H, laneH;
function size() {
  W = cv.width = Math.min(520, innerWidth);
  H = cv.height = innerHeight;
  laneH = H / ROWS;
}
addEventListener('resize', size); size();

// ---------- tiny synth (added 2026-11-02: this game shipped silent) ----------
// iOS routing: Web Audio defaults to the "ambient" channel, which the
// iPhone silent switch mutes entirely. Route it to the media/playback
// channel (iOS 17+ Audio Session API) on the first user gesture and
// inside the synth.
function iosPlaybackSession() {
  try { if ('audioSession' in navigator) navigator.audioSession.type = 'playback'; } catch (e) {}
}
document.addEventListener('pointerdown', iosPlaybackSession, true);
// Sleep in the background (2026-11-09): the wrapper's pauseTimers stops
// JS timers, but the Web Audio graph is a separate engine — suspend the
// audio context whenever the page is hidden so nothing keeps the CPU
// (or the sound) running while the app is in the background.
document.addEventListener("visibilitychange", function () {
  try {
    var c = window.__maCtx;
    if (document.hidden) {
      window.__maHidden = true;
      if (c) {
        if (c.close) { try { var p = c.close(); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
        if (c.suspend && c.state === "running") { try { c.suspend(); } catch (e) {} }
        window.__maCtx = null;
      }
    } else {
      window.__maHidden = false;
      var ac = c || (window.__maActx && window.__maActx());
      if (ac && ac.state === "suspended" && ac.resume) { try { ac.resume(); } catch (e) {} }
    }
  } catch (e) {}
});

document.addEventListener('touchstart', iosPlaybackSession, true);
let AC = null;
function beep(freq, dur, type, vol, slide) {
  try {
    iosPlaybackSession();
    if (AC && AC.state === "closed") AC = null; AC = AC || new (window.AudioContext || window.webkitAudioContext)(); window.__maCtx = AC; window.__maActx = function () { return AC; };
    if (AC.state === 'suspended') AC.resume();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, AC.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, AC.currentTime + dur);
    g.gain.setValueAtTime(vol || 0.12, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + dur);
  } catch (e) {}
}
const sfx = {
  hop:   () => beep(420, 0.12, 'square', 0.06, 760),
  splat: () => beep(160, 0.28, 'sawtooth', 0.10, 55),
  start: () => beep(520, 0.10, 'triangle', 0.08, 780),
};

const rnd = Math.random;
let lanes = [], playerLane = 0, score = 0, dead = false, last = 0;

// Top-5 score history, persisted in the browser via localStorage.
const TOP_KEY = 'hoppy-hopper-top5';
let top5 = [];
try { top5 = JSON.parse(localStorage.getItem(TOP_KEY)) || []; } catch (e) { top5 = []; }
top5 = top5.filter(n => typeof n === 'number').slice(0, 5);
function saveTop(s) {
  if (s <= 0) return;
  top5.push(s); top5.sort((a, b) => b - a); top5 = top5.slice(0, 5);
  try { localStorage.setItem(TOP_KEY, JSON.stringify(top5)); } catch (e) {}
}
function refreshBest() {
  document.getElementById('best').textContent = 'Best ' + (top5[0] || 0);
}
function showGameOver() {
  saveTop(score);
  refreshBest();
  const medals = ['🥇', '🥈', '🥉', '4.', '5.'];
  const rows = top5.length
    ? top5.map((s, i) => `<div style="font-size:19px">${medals[i]} ${s}</div>`).join('')
    : '<div style="font-size:16px;opacity:.75">No scores yet — hop!</div>';
  const ov = document.getElementById('over');
  ov.innerHTML = `SPLAT!<br><span style="font-size:22px">Score ${score}</span>`
    + `<div style="margin-top:12px;font-size:19px;font-weight:800">TOP 5</div>${rows}`
    + `<div style="margin-top:12px;font-size:20px">tap to hop again</div>`;
  ov.style.display = 'flex';
}
refreshBest();

function makeLane(i) {
  const road = i > 0 && rnd() < 0.65;
  const cars = [];
  if (road) {
    const n = 1 + Math.floor(rnd() * 3);
    for (let k = 0; k < n; k++) cars.push(rnd());
  }
  return { road, dir: rnd() < 0.5 ? -1 : 1,
           speed: 0.12 + rnd() * 0.30, cars };
}
function ensure() {
  while (lanes.length <= playerLane + ROWS) lanes.push(makeLane(lanes.length));
}
function reset() { playerLane = 0; score = 0; dead = false; lanes = []; ensure();
  document.getElementById('over').style.display = 'none'; }
function hop() {
  if (dead) { reset(); sfx.start(); return; }
  sfx.hop();
  playerLane++; score = Math.max(score, playerLane);
  document.getElementById('score').textContent = score;
  ensure();
}
addEventListener('pointerdown', hop);
addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'ArrowUp') hop(); });
ensure();

function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000 || 0.016); last = t;
  const cam = playerLane - PLAYER_ROW;
  if (!dead) {
    for (const l of lanes) {
      if (!l.road) continue;
      for (let k = 0; k < l.cars.length; k++) {
        let x = l.cars[k] + l.dir * l.speed * dt;
        if (x > 1.15) x -= 1.30;
        if (x < -0.15) x += 1.30;
        l.cars[k] = x;
      }
    }
    const pl = lanes[playerLane];
    if (pl.road && pl.cars.some(x => Math.abs(x - 0.5) < 0.15)) {
      dead = true;
      sfx.splat();
      showGameOver();
    }
  }
  for (let r = 0; r < ROWS; r++) {
    const li = cam + r;
    if (li < 0) continue;
    const l = lanes[li], top = H - (r + 1) * laneH;
    if (l.road) {
      const rg = ctx.createLinearGradient(0, top, 0, top + laneH);
      rg.addColorStop(0, '#4a4f5c'); rg.addColorStop(0.5, '#33363f'); rg.addColorStop(1, '#24262d');
      ctx.fillStyle = rg; ctx.fillRect(0, top, W, laneH);
      ctx.fillStyle = 'rgba(255,255,255,.10)'; ctx.fillRect(0, top, W, 2);
    } else {
      const gg = ctx.createLinearGradient(0, top, 0, top + laneH);
      if (li % 2) { gg.addColorStop(0, '#86d174'); gg.addColorStop(1, '#62ad52'); }
      else { gg.addColorStop(0, '#92d97f'); gg.addColorStop(1, '#6db95e'); }
      ctx.fillStyle = gg; ctx.fillRect(0, top, W, laneH);
      ctx.fillStyle = 'rgba(255,255,220,.16)'; ctx.fillRect(0, top, W, 2);
    }
    if (l.road) {
      ctx.fillStyle = '#ffd95e';
      ctx.save(); ctx.shadowColor = 'rgba(240,200,80,.6)'; ctx.shadowBlur = 6;
      for (let d = 0; d < 8; d++)
        ctx.fillRect(d * W / 8 + 6, top + laneH / 2 - 3, W / 8 - 12, 6);
      ctx.restore();
      const cols = [['#ff8a7a','#d93a30'], ['#7db4ff','#2f62c4'], ['#ffd166','#dd9412']];
      l.cars.forEach((x, k) => {
        const cx0 = (x - 0.09) * W, cy0 = top + laneH * 0.22, cw = 0.18 * W, ch = laneH * 0.56;
        ctx.fillStyle = 'rgba(0,0,0,.28)';
        ctx.beginPath(); ctx.roundRect(cx0 + 3, cy0 + 5, cw, ch, 10); ctx.fill();
        const cg = ctx.createLinearGradient(0, cy0, 0, cy0 + ch);
        cg.addColorStop(0, cols[k % 3][0]); cg.addColorStop(1, cols[k % 3][1]);
        ctx.fillStyle = cg;
        ctx.beginPath(); ctx.roundRect(cx0, cy0, cw, ch, 10); ctx.fill();
        ctx.fillStyle = 'rgba(190,235,255,.85)';
        ctx.beginPath(); ctx.roundRect(cx0 + cw * 0.30, cy0 + ch * 0.22, cw * 0.40, ch * 0.34, 5); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.35)';
        ctx.beginPath(); ctx.roundRect(cx0 + 4, cy0 + 3, cw - 8, ch * 0.22, 7); ctx.fill();
        ctx.fillStyle = '#16181d';
        for (const wx of [0.18, 0.82]) { ctx.beginPath(); ctx.arc(cx0 + cw * wx, cy0 + ch + 1, Math.max(3, ch * 0.14), 0, 7); ctx.fill(); }
      });
    }
  }
  // the hopper — glossy frog with soft shadow and highlight
  const px = W / 2, py = H - (PLAYER_ROW + 0.5) * laneH, rad = laneH * 0.30;
  ctx.fillStyle = 'rgba(20,50,20,.30)';
  ctx.beginPath(); ctx.ellipse(px, py + rad * 0.82, rad * 0.95, rad * 0.28, 0, 0, 7); ctx.fill();
  const fg = ctx.createRadialGradient(px - rad * 0.35, py - rad * 0.4, rad * 0.2, px, py, rad * 1.25);
  fg.addColorStop(0, '#8fe388'); fg.addColorStop(0.6, '#4bb45a'); fg.addColorStop(1, '#2e8f3e');
  ctx.fillStyle = fg;
  ctx.beginPath(); ctx.arc(px, py, rad, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.28)';
  ctx.beginPath(); ctx.ellipse(px - rad * 0.32, py - rad * 0.48, rad * 0.38, rad * 0.20, -0.5, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(px - rad * 0.37, py - rad * 0.2, rad * 0.3, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(px + rad * 0.37, py - rad * 0.2, rad * 0.3, 0, 7); ctx.fill();
  ctx.fillStyle = '#1e1e1e';
  ctx.beginPath(); ctx.arc(px - rad * 0.37, py - rad * 0.2, rad * 0.15, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(px + rad * 0.37, py - rad * 0.2, rad * 0.15, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  ctx.beginPath(); ctx.arc(px - rad * 0.42, py - rad * 0.26, rad * 0.05, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(px + rad * 0.32, py - rad * 0.26, rad * 0.05, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,150,150,.45)';
  ctx.beginPath(); ctx.arc(px - rad * 0.62, py + rad * 0.28, rad * 0.16, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(px + rad * 0.62, py + rad * 0.28, rad * 0.16, 0, 7); ctx.fill();
  // vignette for depth
  const vg = ctx.createRadialGradient(W/2, H/2, H*0.35, W/2, H/2, H*0.85);
  vg.addColorStop(0, 'rgba(8,25,12,0)'); vg.addColorStop(1, 'rgba(8,25,12,.18)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
