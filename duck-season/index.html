<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#7ec8e3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Duck Season</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden;
    background:
      radial-gradient(120% 90% at 50% 0%, #bfe9f7 0%, rgba(191,233,247,0) 55%),
      linear-gradient(180deg, #7ec8e3 0%, #4a9ec4 60%, #2f7396 100%);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    touch-action:none; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color: transparent; }
  canvas { position:fixed; inset:0; display:block; touch-action:none; cursor:crosshair; }
  #muteBtn { position:fixed; top:10px; right:10px; z-index:10; width:48px; height:48px; border-radius:14px;
    border:1px solid rgba(255,255,255,.65); background:linear-gradient(180deg, rgba(70,140,180,.55), rgba(20,60,90,.55));
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    box-shadow:0 6px 18px rgba(10,40,60,.35), inset 0 1px 0 rgba(255,255,255,.35);
    color:#fff; font-size:22px;
    line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="muteBtn" aria-label="Toggle sound">🔊</button>
<script>
// iOS audio routing: Web Audio defaults to the "ambient" channel, which the
// iPhone silent switch mutes entirely. Route it to the media/playback
// channel (iOS 17+ Audio Session API) on the first user gesture and inside
// audio init, so game music/SFX play even with silent mode on.
function iosPlaybackSession() {
  try { if ('audioSession' in navigator) navigator.audioSession.type = 'playback'; } catch (e) {}
}
document.addEventListener('pointerdown', iosPlaybackSession, true);
// Sleep in the background (2026-11-09): the wrapper's pauseTimers stops
// JS timers, but the Web Audio graph is a separate engine — suspend the
// audio context whenever the page is hidden so nothing keeps the CPU
// (or the sound) running while the app is in the background.
document.addEventListener("visibilitychange", function () {
  try {
    var c = window.__maCtx;
    if (document.hidden) {
      window.__maHidden = true;
      if (c) {
        if (c.close) { try { var p = c.close(); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
        if (c.suspend && c.state === "running") { try { c.suspend(); } catch (e) {} }
        window.__maCtx = null;
      }
    } else {
      window.__maHidden = false;
      var ac = c || (window.__maActx && window.__maActx());
      if (ac && ac.state === "suspended" && ac.resume) { try { ac.resume(); } catch (e) {} }
    }
  } catch (e) {}
});

document.addEventListener('touchstart', iosPlaybackSession, true);
"use strict";
/* DUCK SEASON — original tap shooter. Ducks dart across the sky; tap to
   shoot. 10 ducks per round, a hit quota to advance.
   Fairness: duck speed is capped (MAX_SPEED = 260 px/s, "fast" ducks are
   clamped to the same cap) and every duck's path guarantees a minimum
   on-screen time of ~1.6s (420px view / 260px/s), so every duck is humanly
   hittable. Ammo is PER DUCK: each duck launched adds SHOTS_PER_DUCK = 3 to
   the flight ammo pool, so a round always offers 3 x 10 = 30 shots against
   a maximum quota of 10 — a perfect player (1 shot per duck) can never be
   shot-starved. */
const VW = 420, VH = 720;
const MAX_SPEED = 260, MIN_AIR_TIME = 1.6, SHOTS_PER_DUCK = 3;
const canvas = document.getElementById("game"), ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1, scale = 1, ox = 0, oy = 0;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  scale = Math.min(W / VW, H / VH) * DPR; ox = (W * DPR - VW * scale) / 2; oy = (H * DPR - VH * scale) / 2;
}
window.addEventListener("resize", resize); resize();

// Guarded storage (2026-11-23 restyle robustness fix): a raw localStorage
// read at boot throws when storage is denied (preview panes / private mode)
// and kills the whole script — same keys, wrapped in try/catch.
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
let actx = null, muted = lsGet("dsMuted") === "1", musicTimer = null, musicStep = 0;
const muteBtn = document.getElementById("muteBtn");
muteBtn.textContent = muted ? "🔇" : "🔊";
muteBtn.addEventListener("click", () => { muted = !muted; lsSet("dsMuted", muted ? "1" : "0"); muteBtn.textContent = muted ? "🔇" : "🔊"; });
function initAudio() {
  iosPlaybackSession();
  if (!actx || actx.state === "closed") { try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); window.__maCtx = actx; window.__maActx = function () { return actx; };; } catch (e) {} }
  if (actx && actx.state === "suspended") actx.resume();
}
function tone(freq, dur, type, vol, when) {
  if (!actx || muted) return;
  const t = when || actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = type || "triangle"; o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.14, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
}
function sfx(n) {
  if (!actx || muted) return;
  if (n === "shot") { tone(156, 0.14, "square", 0.2); tone(98, 0.1, "square", 0.12, actx.currentTime + 0.05); }
  else if (n === "hit") { tone(880, 0.1, "triangle", 0.14); tone(1318, 0.14, "triangle", 0.12, actx.currentTime + 0.07); }
  else if (n === "miss") tone(330, 0.2, "square", 0.1);
  else if (n === "win") { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.2, "triangle", 0.13, actx.currentTime + i * 0.11)); }
  else if (n === "lose") tone(196, 0.4, "square", 0.14);
}
const MELODY = [523, 587, 659, 784, 659, 587, 523, 494, 523, 659, 587, 523];
function startMusic() {
  if (musicTimer) return;
  musicTimer = setInterval(() => {
    if (!actx || muted) return;
    tone(MELODY[musicStep % MELODY.length], 0.22, "triangle", 0.05);
    musicStep++;
  }, 280);
}

let state = "menu", round = 1, score = 0, best = 0, hits = 0, ducksSeen = 0;
let ducks = [], spawnTimer = 0, flightAmmo = 0, roundMsg = "", roundMsgT = 0;
let crossX = VW / 2, crossY = VH / 2;
best = parseInt(lsGet("dsBest") || "0", 10);
function quota() { return Math.min(10, 5 + round); }
function duckSpeed() { return Math.min(MAX_SPEED, 95 + round * 16); }
function resetGame() {
  round = 1; score = 0; hits = 0; ducksSeen = 0; ducks = []; spawnTimer = 0.6; flightAmmo = 0;
  roundMsg = "Round 1 — hit 6 of 10!"; roundMsgT = 2.2;
}
function spawnDuck() {
  const dir = Math.random() < 0.5 ? 1 : -1;
  const y0 = 90 + Math.random() * 380, amp = 20 + Math.random() * 50, ph = Math.random() * 6;
  const fast = Math.random() < 0.2;
  ducks.push({
    x: dir > 0 ? -40 : VW + 40, y0, amp, ph, dir,
    speed: Math.min(MAX_SPEED, duckSpeed() * (fast ? 1.25 : 1)), t: 0, hit: false, fall: 0,
    color: ["#6b4a2a", "#3a5a3a", "#4a3a6b"][Math.floor(Math.random() * 3)]
  });
  ducksSeen++;
  flightAmmo += SHOTS_PER_DUCK; // this duck brings its own 3 shots
}
function update(dt) {
  if (state !== "play") return;
  if (roundMsgT > 0) roundMsgT -= dt;
  if (ducksSeen < 10 && ducks.length < 2) {
    spawnTimer -= dt;
    if (spawnTimer <= 0) { spawnDuck(); spawnTimer = 0.5 + Math.random() * 0.7; }
  }
  for (const d of ducks) {
    if (d.hit) { d.fall += dt; d.y0 += 500 * d.fall * dt; continue; }
    d.t += dt;
    d.x += d.dir * d.speed * dt;
  }
  ducks = ducks.filter(d => d.x > -70 && d.x < VW + 70 && !(d.hit && d.fall > 1.2));
  if (ducks.length === 0 && state === "play") flightAmmo = 0; // sky empty: pool resets, next duck brings its own 3
  if (ducksSeen >= 10 && ducks.length === 0) {
    if (hits >= quota()) {
      score += hits * 20 + 200; sfx("win"); round++;
      hits = 0; ducksSeen = 0; spawnTimer = 0.8; flightAmmo = 0;
      roundMsg = "Round " + round + " — hit " + quota() + " of 10!"; roundMsgT = 2.2;
    } else {
      state = "over"; sfx("lose");
      if (score > best) { best = score; lsSet("dsBest", String(best)); }
    }
  }
}
function duckY(d) { return d.y0 + Math.sin(d.t * 2.2 + d.ph) * d.amp; }
canvas.addEventListener("pointermove", e => {
  crossX = (e.clientX * DPR - ox) / scale; crossY = (e.clientY * DPR - oy) / scale;
});
canvas.addEventListener("pointerdown", e => {
  initAudio();
  if (state === "menu") { startMusic(); resetGame(); state = "play"; return; }
  if (state === "over") { state = "menu"; return; }
  const mx = (e.clientX * DPR - ox) / scale, my = (e.clientY * DPR - oy) / scale;
  crossX = mx; crossY = my;
  if (flightAmmo <= 0) return;
  flightAmmo--; sfx("shot");
  let got = null;
  for (const d of ducks) {
    if (d.hit) continue;
    const dy = duckY(d);
    if (Math.abs(d.x - mx) < 30 && Math.abs(dy - my) < 30) { got = d; break; }
  }
  if (got) {
    got.hit = true; got.fall = 0; hits++;
    score += 50 + Math.round(got.speed / 10); sfx("hit");
  } else {
    sfx("miss");
  }
});
window.addEventListener("keydown", e => {
  if (e.key === "Enter" && state !== "play") { initAudio(); startMusic(); resetGame(); state = "play"; }
});

// ---- visual-only helpers (restyle): rounded rects, glass panels, HUD pill ----
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function glassPanel(x, y, w, h) {
  ctx.save();
  ctx.shadowColor = "rgba(10,40,60,.4)"; ctx.shadowBlur = 26; ctx.shadowOffsetY = 10;
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, "rgba(240,250,255,.88)"); g.addColorStop(1, "rgba(190,225,245,.92)");
  rr(x, y, w, h, 18); ctx.fillStyle = g; ctx.fill();
  ctx.restore();
  rr(x, y, w, h, 18); ctx.strokeStyle = "rgba(255,255,255,.7)"; ctx.lineWidth = 1.5; ctx.stroke();
  rr(x + 6, y + 6, w - 12, (h - 12) / 2, 12); ctx.fillStyle = "rgba(255,255,255,.35)"; ctx.fill();
}
function hudPill() {
  ctx.save();
  ctx.shadowColor = "rgba(10,40,60,.35)"; ctx.shadowBlur = 10; ctx.shadowOffsetY = 3;
  const g = ctx.createLinearGradient(0, 6, 0, 44);
  g.addColorStop(0, "rgba(38,92,124,.85)"); g.addColorStop(1, "rgba(18,52,74,.85)");
  rr(6, 6, VW - 12, 38, 19); ctx.fillStyle = g; ctx.fill();
  ctx.restore();
  rr(6, 6, VW - 12, 38, 19); ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 1; ctx.stroke();
}
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const pageG = ctx.createLinearGradient(0, 0, 0, H);
  pageG.addColorStop(0, "#8fd0ea"); pageG.addColorStop(0.6, "#57a8cf"); pageG.addColorStop(1, "#35779c");
  ctx.fillStyle = pageG; ctx.fillRect(0, 0, W, H);
  ctx.setTransform(scale, 0, 0, scale, ox, oy);
  // sky gradient with depth + sun halo (visual only)
  const skyG = ctx.createLinearGradient(0, 0, 0, VH);
  skyG.addColorStop(0, "#aee2f5"); skyG.addColorStop(0.55, "#8fd0ea"); skyG.addColorStop(1, "#cdeffb");
  ctx.fillStyle = skyG; ctx.fillRect(0, 0, VW, VH);
  const sun = ctx.createRadialGradient(52, 58, 6, 52, 58, 120);
  sun.addColorStop(0, "rgba(255,244,180,.95)"); sun.addColorStop(0.25, "rgba(255,236,150,.55)"); sun.addColorStop(1, "rgba(255,236,150,0)");
  ctx.fillStyle = sun; ctx.fillRect(0, 0, VW, VH);
  ctx.fillStyle = "#fff3b0"; ctx.beginPath(); ctx.arc(52, 58, 22, 0, Math.PI * 2); ctx.fill();
  // soft rounded clouds (same anchor points as before, glossier shapes)
  for (let i = 0; i < 5; i++) {
    const x = (i * 130 + 30) % VW, y = 70 + i * 55;
    ctx.fillStyle = "rgba(190,220,238,.5)";
    ctx.beginPath(); ctx.ellipse(x + 28, y + 10, 34, 12, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.92)";
    ctx.beginPath();
    ctx.ellipse(x + 28, y + 6, 32, 12, 0, 0, Math.PI * 2);
    ctx.ellipse(x + 14, y + 2, 18, 10, 0, 0, Math.PI * 2);
    ctx.ellipse(x + 42, y + 1, 20, 11, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.5)";
    ctx.beginPath(); ctx.ellipse(x + 24, y, 18, 6, 0, 0, Math.PI * 2); ctx.fill();
  }
  // grass: layered gradient meadow with a lit top edge and a darker hedge band
  const grG = ctx.createLinearGradient(0, VH - 90, 0, VH);
  grG.addColorStop(0, "#6fc276"); grG.addColorStop(0.18, "#57a85c"); grG.addColorStop(1, "#2f7038");
  ctx.fillStyle = grG; ctx.fillRect(0, VH - 90, VW, 90);
  ctx.fillStyle = "rgba(255,255,200,.5)"; ctx.fillRect(0, VH - 90, VW, 3);
  ctx.fillStyle = "rgba(30,90,40,.35)"; ctx.fillRect(0, VH - 26, VW, 26);
  if (state === "menu") {
    glassPanel(20, 104, VW - 40, 330);
    const tg = ctx.createLinearGradient(0, 118, 0, 164);
    tg.addColorStop(0, "#2a5a74"); tg.addColorStop(1, "#123a4c");
    ctx.fillStyle = tg; ctx.textAlign = "center";
    ctx.font = "bold 42px system-ui"; ctx.fillText("🦆 Duck Season", VW / 2, 150);
    ctx.fillStyle = "#1d3a4a";
    ctx.font = "20px system-ui"; ctx.fillText("Tap the ducks before they escape!", VW / 2, 210);
    ctx.fillText("3 shots per duck • 10 ducks a round", VW / 2, 240);
    ctx.font = "18px system-ui"; ctx.fillText("Best: " + best, VW / 2, 290);
    ctx.font = "bold 22px system-ui"; ctx.fillText("Tap to start", VW / 2, 400);
    return;
  }
  for (const d of ducks) {
    const y = duckY(d), flip = d.dir < 0;
    ctx.save(); ctx.translate(d.x, y); if (flip) ctx.scale(-1, 1);
    ctx.shadowColor = "rgba(20,60,90,.35)"; ctx.shadowBlur = 7; ctx.shadowOffsetY = 3;
    ctx.fillStyle = d.color;
    ctx.beginPath(); ctx.ellipse(0, 0, 22, 12, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(18, -4, 16, 7);
    ctx.shadowColor = "transparent"; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    // glossy sheen over the body + head
    const sheen = ctx.createRadialGradient(-6, -8, 2, -6, -8, 24);
    sheen.addColorStop(0, "rgba(255,255,255,.5)"); sheen.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = sheen;
    ctx.beginPath(); ctx.ellipse(0, 0, 22, 12, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#f2c200"; ctx.fillRect(30, -2, 8, 4);
    ctx.fillStyle = "#fff"; ctx.fillRect(22, -6, 6, 6); ctx.fillStyle = "#000"; ctx.fillRect(24, -4, 3, 3);
    ctx.fillStyle = "rgba(255,255,255,.85)"; ctx.fillRect(23, -5, 2, 2);
    ctx.fillStyle = d.color; ctx.beginPath();
    ctx.moveTo(-8, -8); ctx.lineTo(-2, -22 + Math.sin(d.t * 10) * 4); ctx.lineTo(6, -8); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.35)"; ctx.beginPath();
    ctx.moveTo(-6, -8); ctx.lineTo(-2, -19 + Math.sin(d.t * 10) * 4); ctx.lineTo(3, -8); ctx.fill();
    ctx.restore();
    if (d.hit) { ctx.fillStyle = "#e23b3b"; ctx.font = "bold 18px system-ui"; ctx.textAlign = "center"; ctx.fillText("💥", d.x, y - 20); }
  }
  // crosshair (soft red glow)
  ctx.save(); ctx.shadowColor = "rgba(226,59,59,.75)"; ctx.shadowBlur = 8;
  ctx.strokeStyle = "rgba(226,59,59,.9)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(crossX, crossY, 16, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(crossX - 22, crossY); ctx.lineTo(crossX - 10, crossY);
  ctx.moveTo(crossX + 10, crossY); ctx.lineTo(crossX + 22, crossY);
  ctx.moveTo(crossX, crossY - 22); ctx.lineTo(crossX, crossY - 10);
  ctx.moveTo(crossX, crossY + 10); ctx.lineTo(crossX, crossY + 22); ctx.stroke();
  ctx.restore();
  hudPill();
  ctx.fillStyle = "#fff"; ctx.font = "bold 18px system-ui"; ctx.textAlign = "left";
  ctx.fillText("Round " + round, 12, 28);
  ctx.textAlign = "center"; ctx.fillText("🦆 " + hits + "/" + quota() + "  •  Shots: " + flightAmmo, VW / 2, 28);
  ctx.textAlign = "right"; ctx.fillText(score + " pts", VW - 12, 28);
  if (roundMsgT > 0) {
    ctx.fillStyle = "rgba(18,52,74,.55)"; rr(VW / 2 - 165, 58, 330, 42, 21); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 1; rr(VW / 2 - 165, 58, 330, 42, 21); ctx.stroke();
    ctx.save(); ctx.shadowColor = "rgba(255,220,90,.8)"; ctx.shadowBlur = 10;
    ctx.fillStyle = "#fff"; ctx.font = "bold 20px system-ui"; ctx.textAlign = "center";
    ctx.fillText(roundMsg, VW / 2, 86);
    ctx.restore();
  }
  if (state === "over") {
    ctx.fillStyle = "rgba(8,30,45,.55)"; ctx.fillRect(0, 0, VW, VH);
    glassPanel(VW / 2 - 175, VH / 2 - 95, 350, 190);
    const og = ctx.createLinearGradient(0, VH / 2 - 62, 0, VH / 2 - 16);
    og.addColorStop(0, "#2a5a74"); og.addColorStop(1, "#123a4c");
    ctx.fillStyle = og; ctx.textAlign = "center";
    ctx.font = "bold 38px system-ui"; ctx.fillText("They got away!", VW / 2, VH / 2 - 20);
    ctx.fillStyle = "#1d3a4a";
    ctx.font = "20px system-ui";
    ctx.fillText("Score: " + score + "  •  Best: " + best, VW / 2, VH / 2 + 20);
    ctx.fillText("Tap to return to menu", VW / 2, VH / 2 + 60);
  }
}
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
